const MATERIAS = ['Matemática', 'Física', 'Química', 'Inglês', 'Linguagens'];
const EXATAS = ['Matemática', 'Física', 'Química'];
const NMS = { NM1: 'NM1 · ITA', NM2: 'NM2 · Provão ITA + Provão IME + Qualitativa', NM3: 'NM3 · IME' };
const MULT = { NM1: 1.5, NM2: 1, NM3: 1.5 };
const TURMAS_NOTAS = [1, 2, 3, 4]; // 1ª A, 1ª B, 2ª A, 2ª B (3ª série e Cursinho entram depois)

const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const nomeTurma = (id) => estado.turmas.find(t => t.id === id)?.nome || '';
const codigoTurma = (txt) => semAcento(txt || '').replace(/SERIE/g, '').replace(/[^0-9A-Z]/g, '');
const linkPublico = (token) => location.origin + location.pathname + '#lancar-' + token;
const erroNaTela = (e) => { $('#conteudo').innerHTML = `<div class="aviso erro">Erro: ${esc(e.message || e)}</div>`; };

// Lê o que foi digitado: aceita vírgula ou ponto. Vazio = apagar. NaN = inválido.
function lerNota(txt) {
  const t = String(txt).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  const n = Number(t);
  return n >= 0 && n <= 10 ? Math.round(n * 100) / 100 : NaN;
}

// Liga as caixas de nota: valida, salva ao sair da caixa e mostra verde (salvo) ou vermelho (erro)
function ligarNotas(container, salvar, aoSalvar) {
  container.querySelectorAll('input.nota').forEach(inp => {
    inp.onchange = async () => {
      const v = lerNota(inp.value);
      inp.classList.remove('salvo', 'invalido');
      if (Number.isNaN(v)) { inp.classList.add('invalido'); inp.title = 'Digite um número de 0 a 10 (ex.: 1,5)'; alertaNotas(`"${inp.value}" não é uma nota válida. Digite um número de 0 a 10 (ex.: 1,5).`); return; }
      inp.disabled = true;
      const { error } = await salvar(inp.dataset, v);
      inp.disabled = false;
      if (error) { inp.classList.add('invalido'); inp.title = error.message; alertaNotas(error.message); return; }
      inp.value = v == null ? '' : String(v).replace('.', ',');
      inp.classList.add('salvo'); inp.title = 'Salvo';
      aoSalvar && aoSalvar(inp.dataset, v);
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); proximaCaixa(inp); } };
  });
}
// Enter desce para o próximo aluno na mesma coluna (como numa planilha)
function proximaCaixa(inp) {
  const col = inp.dataset.questao || 'segunda';
  const todas = [...inp.closest('table').querySelectorAll(`input.nota:not(:disabled)`)].filter(i => (i.dataset.questao || 'segunda') === col);
  const prox = todas[todas.indexOf(inp) + 1];
  inp.blur(); prox && prox.focus();
}
function alertaNotas(msg) {
  const a = document.querySelector('.alerta-notas');
  if (a) { a.textContent = msg; a.classList.remove('escondido'); setTimeout(() => a.classList.add('escondido'), 6000); }
}

// Calcula a linha de um aluno: soma das questões, 2ª chamada, nota real e com multiplicador
// aplica = false quando a coordenação desmarcou o multiplicador daquele aluno. A nota final nunca passa de 10.
// NM2 e Linguagens (NM1/NM3): nota real = média simples das colunas, só quando todas estão lançadas.
function calcularLinha(valores, segunda, nm, aplica = true, materia = '') {
  const presentes = valores.filter(v => v != null);
  const soma = presentes.length ? Math.round(presentes.reduce((a, b) => a + b, 0) * 100) / 100 : null;
  const media = valores.length && presentes.length === valores.length ? Math.round(soma / valores.length * 100) / 100 : null;
  const real = segunda != null ? segunda : (nm === 'NM2' || materia === 'Linguagens' ? media : soma);
  const final = real == null ? null : Math.min(10, Math.round(real * (aplica ? MULT[nm] : 1) * 100) / 100);
  return { soma, real, final };
}

// ---------- Um ciclo: quadro NM × matéria × turma ----------
async function paginaCiclo(cicloId) {
  $('#conteudo').innerHTML = '<div class="carregando">Carregando ciclo…</div>';
  const [{ data: ciclo, error: e1 }, { data: planilhas, error: e2 }, { data: linhas, error: e3 }] = await Promise.all([
    db.from('ciclos').select('*').eq('id', cicloId).single(),
    db.from('planilhas').select('*').eq('ciclo_id', cicloId),
    db.from('notas_planilha').select('planilha_id, nota_real').eq('ciclo_id', cicloId),
  ]);
  if (e1 || e2 || e3) return erroNaTela(e1 || e2 || e3);
  const { data: pends } = planilhas.length
    ? await db.from('pendencias_notas').select('planilha_id').in('planilha_id', planilhas.map(p => p.id))
    : { data: [] };
  const resumo = (pid) => {
    const l = linhas.filter(x => x.planilha_id === pid);
    return `${l.filter(x => x.nota_real != null).length} de ${l.length} com nota`;
  };
  const selo = (pid) => {
    const np = (pends || []).filter(x => x.planilha_id === pid).length;
    return np ? ` <span class="status vermelho">${np} ${np === 1 ? 'pendência' : 'pendências'}</span>` : '';
  };
  const celula = (nm, materia, turmaId) => {
    const doc = eDocumento(nm, materia);
    const p = planilhas.find(x => x.nm === nm && x.materia === materia && x.turma_id === turmaId);
    if (p) return `<td><button class="botao leve pequeno" data-planilha="${p.id}">${resumo(p.id)}</button>
      ${doc ? '<span class="status fechada">PDF</span>' : `${eMisto(nm, materia) ? '<span class="status fechada">PDF + redação</span> ' : ''}<span class="status ${p.aberta ? 'aberta' : 'fechada'}">${p.aberta ? 'aberta' : 'fechada'}</span>`}${selo(p.id)}</td>`;
    if (!permite('notas', 'editar')) return '<td class="pendente">não criada</td>';
    return doc
      ? `<td><button class="botao leve pequeno" data-importar="${nm}|${materia}|${turmaId}">Importar PDF</button></td>`
      : `<td><button class="botao pequeno" data-criar="${nm}|${materia}|${turmaId}">+ Criar planilha</button></td>`;
  };
  $('#conteudo').innerHTML = `
    <div class="barra"><button class="botao leve" id="voltar">← Ciclos</button><h1>${esc(ciclo.nome)}</h1><div class="espaco"></div>
      ${estado.papel === 'admin' ? '<button class="botao leve" id="apagar-ciclo">Apagar ciclo…</button>' : ''}</div>
    ${['NM1', 'NM2', 'NM3'].map(nm => `
      <h2>${NMS[nm]} <span class="etiqueta">${MULT[nm] === 1 ? 'mantém a nota' : '× ' + fmt(MULT[nm])}</span></h2>
      <div class="rolavel"><table>
        <thead><tr><th>Matéria</th>${TURMAS_NOTAS.map(t => `<th>${esc(nomeTurma(t))}</th>`).join('')}</tr></thead>
        <tbody>${MATERIAS.map(m => `<tr><td><strong>${m}</strong></td>${TURMAS_NOTAS.map(t => celula(nm, m, t)).join('')}</tr>`).join('')}</tbody>
      </table></div>`).join('')}`;
  $('#voltar').onclick = () => irPara('notas');
  if ($('#apagar-ciclo')) $('#apagar-ciclo').onclick = () => apagarCiclo(ciclo, planilhas.length, linhas.filter(x => x.nota_real != null).length);
  document.querySelectorAll('[data-planilha]').forEach(b => b.onclick = () => irPara('planilha', Number(b.dataset.planilha)));
  document.querySelectorAll('[data-importar]').forEach(b => b.onclick = () => {
    const [nm, materia, turma] = b.dataset.importar.split('|');
    importarPdf(ciclo, nm, materia, Number(turma));
  });
  document.querySelectorAll('[data-criar]').forEach(b => b.onclick = () => {
    const [nm, materia, turma] = b.dataset.criar.split('|');
    criarPlanilha(ciclo, nm, materia, Number(turma), planilhas);
  });
}

// ---------- Apagar um ciclo inteiro (só administrador) ----------
function apagarCiclo(ciclo, nPlanilhas, nNotas) {
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').classList.remove('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Apagar ciclo</h2><span class="etiqueta">${esc(ciclo.nome)} · ${ciclo.ano_letivo}</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <div class="aviso erro">Isto apaga <strong>para sempre</strong> o ciclo e tudo o que está dentro dele:
        ${nPlanilhas} ${nPlanilhas === 1 ? 'planilha' : 'planilhas'}, ${nNotas} ${nNotas === 1 ? 'nota lançada' : 'notas lançadas'}, os links dos professores,
        as 2ª chamadas e as pendências. As notas somem também do boletim, dos comparativos e do desempenho. Não dá para desfazer.</div>
      <p style="margin-top:16px">Para confirmar, digite o nome do ciclo: <strong>${esc(ciclo.nome)}</strong></p>
      <input type="text" id="confirma-ciclo" autocomplete="off" placeholder="${esc(ciclo.nome)}">
    </div>
    <div id="msg-apagar-ciclo" class="aviso erro escondido" style="margin:0 24px 14px"></div>
    <div class="rodape-ficha"><button class="botao leve" id="cancelar-apagar">Cancelar</button>
      <button class="botao perigo" id="confirmar-apagar" disabled>Apagar ciclo</button></div>`;
  $('#ficha .fechar').onclick = fecharFicha;
  $('#cancelar-apagar').onclick = fecharFicha;
  $('#confirma-ciclo').oninput = () => { $('#confirmar-apagar').disabled = $('#confirma-ciclo').value.trim() !== ciclo.nome.trim(); };
  $('#confirma-ciclo').focus();
  $('#confirmar-apagar').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Apagando…';
    const { data, error } = await db.from('ciclos').delete().eq('id', ciclo.id).select('id');
    if (error || !data || !data.length) {
      e.target.disabled = false; e.target.textContent = 'Apagar ciclo';
      $('#msg-apagar-ciclo').textContent = error ? 'Não foi possível apagar: ' + error.message : 'O ciclo não foi apagado (sem permissão). Só o administrador pode apagar.';
      return $('#msg-apagar-ciclo').classList.remove('escondido');
    }
    estado.desemp = null;
    fecharFicha();
    irPara('notas', undefined, 'replace');
  };
}

// ---------- Criar planilha: escolher os professores ----------
async function criarPlanilha(ciclo, nm, materia, turmaId, planilhasDoCiclo) {
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').innerHTML = '<div class="carregando">Carregando professores…</div>';
  const { data: profs } = await db.from('professores').select('*').eq('ativo', true).order('nome');
  // Sugestão: os mesmos professores da outra NM desta matéria/turma; senão, os cadastrados para a matéria e turma
  let sugestao = [];
  const irma = planilhasDoCiclo.find(p => p.materia === materia && p.turma_id === turmaId);
  if (irma) {
    const { data: q } = await db.from('questoes').select('professor, professor_email').eq('planilha_id', irma.id).order('numero');
    sugestao = (q || []).map(x => ({ nome: x.professor, email: x.professor_email || '' }));
  } else {
    const cod = codigoTurma(nomeTurma(turmaId));
    sugestao = (profs || []).filter(p => semAcento(p.materia || '') === semAcento(materia) && (!p.turmas || codigoTurma(p.turmas).includes(cod)))
      .map(p => ({ nome: p.nome, email: p.email || '' }));
  }
  sugestao = sugestao.filter(x => !/ \(PDF\)$/.test(x.nome));
  const misto = eMisto(nm, materia);
  if (misto) sugestao = sugestao.slice(0, 1);
  if (!sugestao.length) sugestao = [{ nome: '', email: '' }];

  const linha = (p) => `<div class="linha-prof">
      <input type="text" class="prof-nome" list="lista-profs" placeholder="Nome do professor" value="${esc(p.nome)}">
      <input type="email" class="prof-email" placeholder="E-mail (para o aviso)" value="${esc(p.email)}">
      <button type="button" class="botao leve pequeno remover" title="Remover">×</button></div>`;
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Nova planilha</h2>
      <span class="etiqueta">${esc(materia)} · ${nm} · ${esc(nomeTurma(turmaId))} · ${esc(ciclo.nome)}</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <h3>${misto ? 'Professor da Redação' : 'Professores (uma coluna/questão para cada um, na ordem)'}</h3>
      ${misto ? '<p class="subtitulo" style="margin-top:0">A planilha terá duas colunas: a nota do PDF da prova (você importa depois, dentro da planilha) e a Redação, lançada por este professor no link. Nota real = média das duas.</p>' : ''}
      <datalist id="lista-profs">${(profs || []).map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist>
      <div id="linhas-prof">${sugestao.map(linha).join('')}</div>
      ${misto ? '' : '<button type="button" class="botao leve pequeno" id="mais-prof">+ Adicionar professor</button>'}
    </div>
    <div class="secao"><button class="botao" id="gerar">Gerar planilha</button>
      <div id="msg-criar" class="aviso erro escondido"></div></div>`;
  $('#ficha .fechar').onclick = fecharFicha;
  const ligarLinhas = () => {
    document.querySelectorAll('.linha-prof .remover').forEach(b => b.onclick = () => b.parentElement.remove());
    document.querySelectorAll('.prof-nome').forEach(i => i.onchange = () => {
      const p = (profs || []).find(x => x.nome === i.value);
      const em = i.parentElement.querySelector('.prof-email');
      if (p && !em.value) em.value = p.email || '';
    });
  };
  ligarLinhas();
  if ($('#mais-prof')) $('#mais-prof').onclick = () => { $('#linhas-prof').insertAdjacentHTML('beforeend', linha({ nome: '', email: '' })); ligarLinhas(); };
  $('#gerar').onclick = async () => {
    const lista = [...document.querySelectorAll('.linha-prof')].map(l => ({
      nome: l.querySelector('.prof-nome').value.trim(), email: l.querySelector('.prof-email').value.trim().toLowerCase() || null,
    })).filter(x => x.nome);
    const msg = $('#msg-criar');
    if (!lista.length) { msg.textContent = 'Adicione pelo menos um professor.'; msg.classList.remove('escondido'); return; }
    $('#gerar').disabled = true;
    const { data: p, error } = await db.from('planilhas').insert({ ciclo_id: ciclo.id, nm, materia, turma_id: turmaId }).select().single();
    if (error) { msg.textContent = error.message; msg.classList.remove('escondido'); $('#gerar').disabled = false; return; }
    const colunas = misto
      ? [{ planilha_id: p.id, numero: 1, professor: 'Documento (PDF)' }, { planilha_id: p.id, numero: 2, professor: lista[0].nome, professor_email: lista[0].email }]
      : lista.map((x, i) => ({ planilha_id: p.id, numero: i + 1, professor: x.nome, professor_email: x.email }));
    const { error: e2 } = await db.from('questoes').insert(colunas);
    if (e2) { msg.textContent = e2.message; msg.classList.remove('escondido'); $('#gerar').disabled = false; return; }
    fecharFicha();
    irPara('planilha', p.id);
  };
}

// ---------- Uma planilha (visão da coordenação) ----------
async function paginaPlanilha(planilhaId) {
  $('#conteudo').innerHTML = '<div class="carregando">Carregando planilha…</div>';
  const { data: p, error } = await db.from('planilhas').select('*').eq('id', planilhaId).single();
  if (error) return erroNaTela(error);
  const [{ data: ciclo }, { data: questoesBrutas }, { data: segundas }, { data: pendencias }, { data: semMult }] = await Promise.all([
    db.from('ciclos').select('*').eq('id', p.ciclo_id).single(),
    db.from('questoes').select('*').eq('planilha_id', p.id).order('numero'),
    db.from('segunda_chamada').select('*').eq('planilha_id', p.id),
    db.from('pendencias_notas').select('*').eq('planilha_id', p.id).order('id'),
    db.from('sem_multiplicador').select('aluno_id').eq('planilha_id', p.id),
  ]);
  const questoes = ordenarColunas(questoesBrutas || [], p.nm);
  const { data: notas } = questoes.length
    ? await db.from('notas_questao').select('aluno_id, questao_id, nota').in('questao_id', questoes.map(q => q.id))
    : { data: [] };
  const valor = new Map((notas || []).map(n => [`${n.aluno_id}-${n.questao_id}`, Number(n.nota)]));
  const seg = new Map((segundas || []).map(s => [s.aluno_id, Number(s.nota)]));
  const semM = new Set((semMult || []).map(x => x.aluno_id));
  const pend = pendencias || [];
  const alunos = estado.matriculas.filter(m => m.turma_id === p.turma_id && m.situacao === 'ativo')
    .sort((a, b) => (a.ordem ?? 999) - (b.ordem ?? 999)).map(m => estado.alunos.get(m.aluno_id)).filter(Boolean);
  const editar = permite('notas', 'editar');
  const temMult = MULT[p.nm] !== 1;
  // sem multiplicador (NM2) só existe a visão das notas dos professores
  const vista = temMult ? (estado.vistaPlanilha || 'prof') : 'prof';
  const cx = (v, attrs) => editar
    ? `<input class="nota" inputmode="decimal" ${attrs} value="${v == null ? '' : String(v).replace('.', ',')}">`
    : (v == null ? '—' : fmt(v));
  const doc = eDocumento(p.nm, p.materia);
  const misto = eMisto(p.nm, p.materia);
  const emails = questoes.map(q => q.professor_email).filter(Boolean);
  const titulo = `${p.materia} · ${p.nm} · ${nomeTurma(p.turma_id)} · ${ciclo.nome}`;
  const mensagem = `Olá! A planilha de notas de ${titulo} está aberta.\nLance as notas ${misto ? 'de Redação' : 'da sua questão'} neste link (salva automaticamente):\n${linkPublico(p.token)}`;
  // valor de cada coluna original; se houver 2ª chamada daquela prova, ela substitui
  const valoresDe = (a) => questoes.filter(q => !q.substitui_id).map(b => {
    const sub = questoes.find(x => x.substitui_id === b.id);
    return (sub ? valor.get(`${a}-${sub.id}`) : null) ?? valor.get(`${a}-${b.id}`) ?? null;
  });
  const temSegunda = p.nm !== 'NM2' && p.materia !== 'Inglês';   // na NM2 e no Inglês a 2ª chamada é por prova (colunas próprias)
  const linhaDe = (a) => calcularLinha(valoresDe(a), temSegunda ? seg.get(a) ?? null : null, p.nm, !semM.has(a), p.materia);

  // Pendências ligadas a um aluno da turma (aparecem na linha dele) e as soltas (nome do documento que não está na turma)
  const pendDoAluno = (id) => pend.filter(x => x.aluno_id === id);
  const soltas = pend.filter(x => !x.aluno_id || !alunos.some(a => a.id === x.aluno_id));
  const acoes = (x) => !editar ? '' : (x.aluno_id && x.nota != null && x.tipo !== 'fora_do_documento'
    ? `<button class="botao pequeno" data-usar="${x.id}">${x.tipo === 'nome_diferente' ? 'É o mesmo aluno: lançar' : 'Lançar esta nota:'} ${fmt(x.nota)}</button>` : '')
    + `<button class="botao leve pequeno" data-descartar="${x.id}">${x.tipo === 'fora_do_documento' ? 'Dispensar aviso' : 'Descartar'}</button>`;
  const motivos = (id) => pendDoAluno(id).map(x => `<span class="motivo">⚠ ${esc(x.motivo)}${acoes(x) ? '<br>' + acoes(x) : ''}</span>`).join('');
  const opcoesAlunos = `<option value="">Escolha o aluno da turma…</option>` + [...alunos].sort((a, b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('');

  $('#conteudo').innerHTML = `
    <div class="barra"><button class="botao leve" id="voltar">← ${esc(ciclo.nome)}</button>
      <div><h1>${esc(p.materia)} · ${p.nm} · ${esc(nomeTurma(p.turma_id))}</h1></div>
      ${doc ? '<span class="status fechada">notas vindas de PDF</span>' : `<span class="status ${p.aberta ? 'aberta' : 'fechada'}">${p.aberta ? 'aberta para os professores' : 'fechada'}</span>`}
      ${pend.length ? `<span class="status vermelho">${pend.length} ${pend.length === 1 ? 'pendência' : 'pendências'}</span>` : ''}
      <button class="botao" id="imprimir-relatorio" style="margin-left:auto">Imprimir relatório</button></div>
    ${doc ? `<div class="caixa-link"><strong>Notas importadas de PDF.</strong>
      ${editar ? questoes.map(q => `<button class="botao leve pequeno" data-reimportar="${q.numero}">Importar ${esc(nomeColuna(q))}</button>`).join('') : ''}
      <span class="subtitulo" style="margin:0">${p.nm === 'NM2' || p.materia === 'Inglês' ? regraNm2(p.materia) + ' A 2ª chamada de uma prova substitui a nota daquela prova. ' : ''}Importar de novo atualiza as notas e refaz as pendências daquela prova.</span></div>` : `
    <div class="caixa-link">
      <strong>Link dos professores:</strong>
      <input type="text" readonly value="${esc(linkPublico(p.token))}" id="link-publico">
      <button class="botao leve pequeno" id="copiar-link">Copiar link</button>
      <button class="botao leve pequeno" id="copiar-msg">Copiar mensagem (WhatsApp)</button>
      ${emails.length ? `<a class="botao leve pequeno" id="avisar" href="mailto:?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent('Notas - ' + titulo)}&body=${encodeURIComponent(mensagem)}">Avisar por e-mail (${emails.length})</a>` : ''}
      ${editar ? `<button class="botao leve pequeno" id="abrir-fechar">${p.aberta ? 'Fechar lançamento' : 'Reabrir lançamento'}</button>` : ''}
    </div>
    ${misto ? `<div class="caixa-link"><strong>Nota da prova (PDF):</strong>
      ${editar ? questoes.filter(colunaPdf).map(q => `<button class="botao leve pequeno" data-reimportar="${q.numero}">Importar PDF da prova</button>`).join('') : ''}
      <span class="subtitulo" style="margin:0">Nota real = (PDF + Redação) ÷ 2, quando as duas estiverem lançadas. Depois × ${fmt(MULT[p.nm])}, no máximo 10. O professor de Redação não vê nem altera a coluna do PDF.</span></div>` : ''}`}
    ${soltas.length ? `<div class="caixa-erros"><h3>No documento, mas fora desta turma (${soltas.length}) — nota NÃO lançada</h3>
      ${soltas.map(x => `<div class="item"><strong>${esc(x.nome_documento || '')}</strong>${x.nota != null ? ` · nota ${fmt(x.nota)}` : ''}<br>${esc(x.motivo)}
        ${editar ? `<br><select data-destino="${x.id}">${opcoesAlunos}</select><button class="botao pequeno" data-lancar="${x.id}">Lançar para este aluno</button>${acoes(x)}` : ''}</div>`).join('')}</div>` : ''}
    <div class="aviso erro escondido alerta-notas"></div>
    ${temMult ? `<div class="abas abas-planilha">
      <button data-vista="prof" class="${vista === 'prof' ? 'ativa' : ''}">Notas dos professores</button>
      <button data-vista="mult" class="${vista === 'mult' ? 'ativa' : ''}">Com multiplicador (× ${fmt(MULT[p.nm])})</button></div>` : ''}
    <div class="rolavel"><table id="tabela-notas" class="vista-${vista}">
      <thead><tr><th>Nº</th><th>Aluno</th>
        ${questoes.map(q => `<th class="num col-prof">${doc || colunaPdf(q) ? `${esc(misto ? 'Prova' : nomeColuna(q))}<br><small>PDF</small>` : `${misto ? 'Redação' : 'Q' + q.numero}<br><small>${esc(q.professor)}</small>`}</th>`).join('')}
        ${doc || misto ? '' : '<th class="num col-prof">Soma</th>'}${temSegunda ? '<th class="num col-prof">2ª chamada</th>' : ''}<th class="num">Nota real</th>
        ${temMult ? `<th class="mult col-mult">Usar × ${fmt(MULT[p.nm])}?</th>` : ''}<th class="num col-mult">Nota final<br><small>máx. 10</small></th></tr></thead>
      <tbody>${alunos.map((a, i) => {
        const c = linhaDe(a.id);
        return `<tr data-linha="${a.id}" class="${pendDoAluno(a.id).length ? 'com-erro' : ''}"><td>${i + 1}</td><td>${esc(a.nome)}${motivos(a.id)}</td>
          ${questoes.map(q => `<td class="num col-prof">${cx(valor.get(`${a.id}-${q.id}`), `data-aluno="${a.id}" data-questao="${q.id}"`)}</td>`).join('')}
          <td class="num col-prof ${c.soma > 10 && !misto ? 'acima' : ''} ${doc || misto ? 'escondido' : ''}" data-soma>${fmt(c.soma)}</td>
          ${temSegunda ? `<td class="num col-prof">${cx(seg.get(a.id), `data-aluno="${a.id}" data-segunda="1"`)}</td>` : ''}
          <td class="num forte" data-real>${fmt(c.real)}</td>
          ${temMult ? `<td class="mult col-mult"><input type="checkbox" data-mult="${a.id}" ${semM.has(a.id) ? '' : 'checked'} ${editar ? '' : 'disabled'} title="Marcado = aplica o multiplicador"></td>` : ''}
          <td class="num forte col-mult" data-final>${fmt(c.final)}</td></tr>`;
      }).join('')}</tbody></table></div>
    ${editar ? `<p class="subtitulo" style="margin-top:14px">${doc ? 'Linhas em vermelho têm pendência: corrija e a marca some. Digitar a nota do aluno também resolve a pendência dele.'
      : 'A coordenação também pode corrigir qualquer nota aqui. Soma em vermelho = passou de 10.'}
      ${temMult ? ' Desmarque "Usar ×" para o aluno ficar com a nota real. A nota final nunca passa de 10.' : ''}
      ${doc || misto ? '' : '<button class="botao leve pequeno" id="mais-questao">+ Adicionar professor/questão</button>'}</p>` : ''}`;

  $('#voltar').onclick = () => irPara('ciclo', p.ciclo_id);
  document.querySelectorAll('.abas-planilha button').forEach(b => b.onclick = () => {
    estado.vistaPlanilha = b.dataset.vista;
    $('#tabela-notas').className = 'vista-' + b.dataset.vista;
    document.querySelectorAll('.abas-planilha button').forEach(x => x.classList.toggle('ativa', x === b));
  });
  $('#imprimir-relatorio').onclick = () => {
    const dados = { p, ciclo, questoes, alunos, valor, seg, semM, doc, linhaDe, temSegunda, misto };
    if (!temMult) return imprimirRelatorio(dados, false);
    $('#fundo-ficha').classList.remove('escondido');
    $('#ficha').innerHTML = `
      <div class="modal-topo"><div><h2>Imprimir relatório</h2>
        <span class="etiqueta">${esc(p.materia)} · ${p.nm} · ${esc(nomeTurma(p.turma_id))} · ${esc(ciclo.nome)}</span></div>
        <button class="fechar" aria-label="Fechar">×</button></div>
      <div class="secao escolha-impressao">
        <button class="botao leve" data-imp="sem">Sem multiplicador<small>Notas de cada professor, soma, 2ª chamada e nota real</small></button>
        <button class="botao" data-imp="com">Com multiplicador<small>Nota real, se o × ${fmt(MULT[p.nm])} foi aplicado e nota final (máx. 10)</small></button>
      </div>`;
    $('#ficha .fechar').onclick = fecharFicha;
    document.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => { fecharFicha(); imprimirRelatorio(dados, b.dataset.imp === 'com'); });
  };
  document.querySelectorAll('[data-reimportar]').forEach(b => b.onclick = () => importarPdf(ciclo, p.nm, p.materia, p.turma_id, p.id, Number(b.dataset.reimportar)));
  const copiar = async (txt, botao) => { try { await navigator.clipboard.writeText(txt); botao.textContent = 'Copiado!'; } catch { $('#link-publico').select(); } };
  if ($('#copiar-link')) $('#copiar-link').onclick = (e) => copiar(linkPublico(p.token), e.target);
  if ($('#copiar-msg')) $('#copiar-msg').onclick = (e) => copiar(mensagem, e.target);
  if ($('#abrir-fechar')) $('#abrir-fechar').onclick = async () => {
    await db.from('planilhas').update({ aberta: !p.aberta }).eq('id', p.id); paginaPlanilha(p.id);
  };
  if ($('#mais-questao')) $('#mais-questao').onclick = async () => {
    const nome = window.prompt ? prompt('Nome do professor da nova questão:') : null;
    if (!nome) return;
    await db.from('questoes').insert({ planilha_id: p.id, numero: questoes.length + 1, professor: nome.trim() });
    paginaPlanilha(p.id);
  };

  // ----- Resolver pendências -----
  const falhou = (e) => { alertaNotas('Não foi possível salvar: ' + e.message); };
  const lancarNota = async (aluno_id, nota, pendId, questaoId) => {
    const q = questoes.find(x => x.id === questaoId) || questoes[0];
    if (!q) return falhou({ message: 'planilha sem coluna de nota' });
    const { error: e1 } = await db.from('notas_questao').upsert({ aluno_id, questao_id: q.id, nota, atualizado_em: new Date().toISOString() });
    if (e1) return falhou(e1);
    await db.from('pendencias_notas').delete().eq('planilha_id', p.id).eq('aluno_id', aluno_id).eq('questao_id', q.id);
    if (pendId) await db.from('pendencias_notas').delete().eq('id', pendId);
    paginaPlanilha(p.id);
  };
  document.querySelectorAll('[data-usar]').forEach(b => b.onclick = () => {
    const x = pend.find(y => y.id === Number(b.dataset.usar));
    lancarNota(x.aluno_id, Number(x.nota), x.id, x.questao_id);
  });
  document.querySelectorAll('[data-lancar]').forEach(b => b.onclick = () => {
    const x = pend.find(y => y.id === Number(b.dataset.lancar));
    const destino = Number($(`[data-destino="${x.id}"]`).value);
    if (!destino) return alertaNotas('Escolha primeiro o aluno da turma que deve receber esta nota.');
    if (x.nota == null) return alertaNotas('Este item não tem nota válida no documento. Digite a nota direto na linha do aluno.');
    lancarNota(destino, Number(x.nota), x.id, x.questao_id);
  });
  document.querySelectorAll('[data-descartar]').forEach(b => b.onclick = async () => {
    const { error: e } = await db.from('pendencias_notas').delete().eq('id', Number(b.dataset.descartar));
    if (e) return falhou(e);
    paginaPlanilha(p.id);
  });

  // ----- Multiplicador por aluno -----
  const atualizarLinha = (aluno) => {
    const c = linhaDe(aluno);
    const tr = $('#tabela-notas').querySelector(`tr[data-linha="${aluno}"]`);
    tr.querySelector('[data-soma]').textContent = fmt(c.soma);
    tr.querySelector('[data-soma]').classList.toggle('acima', c.soma > 10 && !misto);
    tr.querySelector('[data-real]').textContent = fmt(c.real);
    tr.querySelector('[data-final]').textContent = fmt(c.final);
  };
  document.querySelectorAll('[data-mult]').forEach(ch => ch.onchange = async () => {
    const aluno_id = Number(ch.dataset.mult);
    ch.disabled = true;
    const { error: e } = ch.checked
      ? await db.from('sem_multiplicador').delete().eq('planilha_id', p.id).eq('aluno_id', aluno_id)
      : await db.from('sem_multiplicador').insert({ planilha_id: p.id, aluno_id });
    ch.disabled = false;
    if (e) { ch.checked = !ch.checked; return falhou(e); }
    ch.checked ? semM.delete(aluno_id) : semM.add(aluno_id);
    atualizarLinha(aluno_id);
  });

  // ----- Salvar nota digitada pela coordenação -----
  ligarNotas($('#tabela-notas'), (d, v) => {
    const aluno_id = Number(d.aluno);
    if (d.segunda) return v == null
      ? db.from('segunda_chamada').delete().eq('aluno_id', aluno_id).eq('planilha_id', p.id)
      : db.from('segunda_chamada').upsert({ aluno_id, planilha_id: p.id, nota: v });
    const questao_id = Number(d.questao);
    return v == null
      ? db.from('notas_questao').delete().eq('aluno_id', aluno_id).eq('questao_id', questao_id)
      : db.from('notas_questao').upsert({ aluno_id, questao_id, nota: v, atualizado_em: new Date().toISOString() });
  }, async (d, v) => {
    const aluno = Number(d.aluno);
    if (d.segunda) { v == null ? seg.delete(aluno) : seg.set(aluno, v); } else { valor.set(`${aluno}-${d.questao}`, v); }
    atualizarLinha(aluno);
    // nota digitada para um aluno com pendência = pendência resolvida
    const daColuna = pendDoAluno(aluno).filter(x => d.segunda || x.questao_id === Number(d.questao) || !x.questao_id);
    if (v != null && daColuna.length) {
      for (const x of daColuna) await db.from('pendencias_notas').delete().eq('id', x.id);
      paginaPlanilha(p.id);
    }
  });
}

// Relatório de notas para imprimir: sem multiplicador (notas dos professores) ou com multiplicador
function imprimirRelatorio({ p, ciclo, questoes, alunos, valor, seg, semM, doc, linhaDe, temSegunda = true, misto = false }, comMult) {
  const hoje = new Date().toLocaleDateString('pt-BR');
  const linhas = alunos.map((a, i) => ({ a, i, c: linhaDe(a.id) }));
  const media = (k) => {
    const v = linhas.map(l => l.c[k]).filter(x => x != null);
    return v.length ? fmt(Math.round(v.reduce((s, x) => s + x, 0) / v.length * 100) / 100) : '—';
  };
  const semNota = linhas.filter(l => l.c.real == null).length;
  const cab = comMult
    ? `<th class="n">Nº</th><th>Aluno</th><th class="n">Nota real</th><th class="n">Multiplicador</th><th class="n">Nota final</th>`
    : `<th class="n">Nº</th><th>Aluno</th>${questoes.map(q => `<th class="n">${doc ? esc(nomeColuna(q)) : misto ? (colunaPdf(q) ? 'Prova (PDF)' : `Redação<br>${esc(q.professor)}`) : `Q${q.numero}<br>${esc(q.professor)}`}</th>`).join('')}
       ${doc || misto ? '' : '<th class="n">Soma</th>'}${temSegunda ? '<th class="n">2ª chamada</th>' : ''}<th class="n">Nota real</th>`;
  const corpo = linhas.map(({ a, i, c }) => comMult
    ? `<tr><td class="n">${i + 1}</td><td>${esc(a.nome)}</td><td class="n">${fmt(c.real)}</td>
        <td class="n">${semM.has(a.id) ? 'não aplicado' : '× ' + fmt(MULT[p.nm])}</td><td class="n forte">${fmt(c.final)}</td></tr>`
    : `<tr><td class="n">${i + 1}</td><td>${esc(a.nome)}</td>${questoes.map(q => `<td class="n">${fmt(valor.get(`${a.id}-${q.id}`))}</td>`).join('')}
        ${doc || misto ? '' : `<td class="n">${fmt(c.soma)}</td>`}${temSegunda ? `<td class="n">${fmt(seg.get(a.id))}</td>` : ''}<td class="n forte">${fmt(c.real)}</td></tr>`).join('');
  $('#impressao').innerHTML = `
    <div class="imp-topo"><h1>NOTAS · ${esc(p.materia.toUpperCase())} · ${p.nm} · ${esc(nomeTurma(p.turma_id).toUpperCase())}</h1>
      <span>${esc(ciclo.nome)} · impresso em ${hoje}</span></div>
    <p class="imp-sub"><strong>${comMult ? `Com multiplicador (× ${fmt(MULT[p.nm])}, nota final no máximo 10)` : (MULT[p.nm] !== 1 ? 'Sem multiplicador — notas lançadas pelos professores' : 'Notas lançadas')}</strong>
      · ${alunos.length} alunos</p>
    <table class="imp-tabela"><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table>
    <p class="imp-rodape">Média da turma: nota real ${media('real')}${comMult ? ` · nota final ${media('final')}` : ''}
      ${semNota ? ` · ${semNota} ${semNota === 1 ? 'aluno sem nota' : 'alunos sem nota'}` : ''}</p>`;
  setTimeout(() => window.print(), 100);
}

// ---------- Importar notas de um PDF (nome do aluno + nota) ----------
// Usado para Inglês (NM1, NM2, NM3, sempre a Prova de Inglês) e para as matérias do NM2.
// O sistema lê o PDF no próprio navegador (o arquivo não é enviado a lugar nenhum),
// encontra cada aluno pelo nome e mostra uma prévia antes de salvar.
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const eDocumento = (nm, materia) => nm === 'NM2' || materia === 'Inglês';
// Linguagens NM1/NM3: uma coluna vem do PDF (coordenação importa) e a Redação vem do link do professor
const eMisto = (nm, materia) => materia === 'Linguagens' && nm !== 'NM2';
const colunaPdf = (q) => / \(PDF\)$/.test(q.professor);

// Lê o texto do PDF e monta as linhas (juntando os pedaços que estão na mesma altura da página)
async function lerLinhasPdf(arquivo) {
  await carregarScript(PDFJS_URL);
  if (!window.__pdfWorker) {
    const codigo = await (await fetch(PDFJS_WORKER)).text();
    window.__pdfWorker = URL.createObjectURL(new Blob([codigo], { type: 'text/javascript' }));
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = window.__pdfWorker;
  const pdf = await pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
  const linhas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const conteudo = await (await pdf.getPage(n)).getTextContent();
    const grupos = [];
    for (const item of conteudo.items) {
      if (!item.str || !item.str.trim()) continue;
      const y = item.transform[5], x = item.transform[4];
      let g = grupos.find(g => Math.abs(g.y - y) <= 3);
      if (!g) { g = { y, itens: [] }; grupos.push(g); }
      g.itens.push({ x, s: item.str });
    }
    grupos.sort((a, b) => b.y - a.y)
      .forEach(g => linhas.push(g.itens.sort((a, b) => a.x - b.x).map(i => i.s).join('  ').replace(/\s+/g, ' ').trim()));
  }
  return linhas;
}

// Entende o PDF: cabeçalho (simulado, turma, disciplina) + uma linha por aluno: NOME  TURMA  NOTA  ACERTOS
function interpretarPdf(linhas) {
  const campo = (rotulo) => {
    const l = linhas.find(l => semAcento(l).startsWith(rotulo));
    return l ? l.slice(l.indexOf(':') + 1).trim() : '';
  };
  const re = /^(.*\S)\s+(\S+)\s+(\d{1,2}(?:[.,]\d{1,2})?)\s+(\d+\s*\/\s*\d+)$/;
  return {
    titulo: linhas[0] || '',
    disciplina: campo('DISCIPLINA'),
    turma: campo('TURMA'),
    alunos: linhas.map(l => l.match(re)).filter(Boolean)
      .map(m => ({ nome: m[1].trim(), nota: lerNota(m[3]), acertos: m[4].replace(/\s/g, '') })),
  };
}

// Semelhança entre dois nomes (0 a 1), para achar pequenas diferenças de grafia (GIOVANNA x GYOVANNA)
function semelhanca(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let ant = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const atual = [i];
    for (let j = 1; j <= n; j++) atual[j] = Math.min(ant[j] + 1, atual[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    ant = atual;
  }
  return 1 - ant[n] / Math.max(m, n);
}
function casarAluno(nomePdf, alunos) {
  const alvo = semAcento(nomePdf).replace(/\s+/g, ' ');
  const exato = alunos.find(a => semAcento(a.nome).replace(/\s+/g, ' ') === alvo);
  if (exato) return { aluno: exato, tipo: 'exato' };
  let melhor = null, nota = 0;
  for (const a of alunos) { const s = semelhanca(alvo, semAcento(a.nome)); if (s > nota) { nota = s; melhor = a; } }
  return nota >= 0.88 ? { aluno: melhor, tipo: 'parecido' } : { aluno: null, tipo: 'nao' };
}

// Regras da importação (definidas pela coordenação):
//  * a nota só entra sozinha quando o nome do documento é IGUAL ao do sistema (acentos e espaços não contam);
//  * nome parecido, aluno fora da turma, aluno da turma que não está no documento e nota ilegível
//    NÃO recebem nota: ficam marcados em vermelho na planilha, com o motivo, para a coordenação corrigir.
// parcial = lista de 2ª chamada: só vêm os alunos que faltaram, então quem não está nela não é pendência
function analisarImportacao(info, alunos, turmaId, parcial = false) {
  const norm = (s) => semAcento(s).replace(/\s+/g, ' ').trim();
  const linhas = info.alunos.map(l => ({ ...l, exato: alunos.find(a => norm(a.nome) === norm(l.nome)) || null }));
  // aluno que aparece duas vezes com nome igual: nenhuma das duas entra
  const contagem = new Map();
  linhas.forEach(l => l.exato && contagem.set(l.exato.id, (contagem.get(l.exato.id) || 0) + 1));
  const casados = new Set(linhas.filter(l => l.exato).map(l => l.exato.id));
  const livres = alunos.filter(a => !casados.has(a.id));
  const outraTurma = (nome) => {
    const m = estado.matriculas.find(m => m.turma_id !== turmaId && m.situacao === 'ativo' && norm(estado.alunos.get(m.aluno_id)?.nome || '') === norm(nome));
    return m ? nomeTurma(m.turma_id) : null;
  };
  const turma = nomeTurma(turmaId);
  const lancar = [], pendencias = [];
  for (const l of linhas) {
    const notaOk = l.nota != null && !Number.isNaN(l.nota);
    if (l.exato && contagem.get(l.exato.id) > 1) {
      pendencias.push({ tipo: 'nota_invalida', aluno_id: l.exato.id, nome_documento: l.nome, nota: notaOk ? l.nota : null,
        motivo: `Aparece mais de uma vez no documento (esta linha: nota ${notaOk ? fmt(l.nota) : 'ilegível'}). Confira qual nota é a certa e digite-a.` });
    } else if (l.exato && !notaOk) {
      pendencias.push({ tipo: 'nota_invalida', aluno_id: l.exato.id, nome_documento: l.nome, nota: null,
        motivo: 'O nome bate, mas a nota do documento não pôde ser lida. Digite a nota manualmente.' });
    } else if (l.exato) {
      lancar.push({ aluno_id: l.exato.id, nota: l.nota, nome: l.nome });
    } else {
      const c = casarAluno(l.nome, livres);
      if (c.aluno) {
        pendencias.push({ tipo: 'nome_diferente', aluno_id: c.aluno.id, nome_documento: l.nome, nota: notaOk ? l.nota : null,
          motivo: `Nome escrito diferente. No documento: "${l.nome}"${notaOk ? ` (nota ${fmt(l.nota)})` : ''}. No sistema: "${c.aluno.nome}". Corrija a grafia no cadastro ou confirme que é o mesmo aluno.` });
      } else {
        const outra = outraTurma(l.nome);
        pendencias.push({ tipo: 'fora_da_turma', aluno_id: null, nome_documento: l.nome, nota: notaOk ? l.nota : null,
          motivo: outra ? `Está no documento, mas no sistema está matriculado na ${outra}, não na ${turma}.`
                        : `Está no documento, mas não está matriculado na ${turma} (nem foi encontrado em outra turma).` });
      }
    }
  }
  const comAviso = new Set(pendencias.filter(x => x.aluno_id).map(x => x.aluno_id));
  for (const a of (parcial ? [] : alunos)) {
    if (!casados.has(a.id) && !comAviso.has(a.id)) pendencias.push({ tipo: 'fora_do_documento', aluno_id: a.id, nome_documento: null, nota: null,
      motivo: 'Está na turma, mas não aparece no documento. Confira o documento ou digite a nota.' });
  }
  return { linhas, lancar, pendencias };
}

// Colunas das planilhas de documento (n = número da coluna; sub = coluna que a 2ª chamada substitui).
// NM2 de Matemática, Física e Química: Provão ITA + Provão IME + Prova Qualitativa (nota = média das três).
// NM2 de Linguagens: só a Prova Qualitativa (a nota é a dela, sem média).
// Inglês (NM1, NM2 e NM3): prova própria de Inglês, via PDF, com 2ª chamada (a nota é a da prova).
const COLUNAS_NM2 = [
  { n: 1, nome: 'Provão ITA (PDF)' }, { n: 5, nome: 'Provão IME (PDF)' }, { n: 2, nome: 'Qualitativa (PDF)' },
  { n: 3, nome: '2ª chamada Provão ITA (PDF)', sub: 1 }, { n: 6, nome: '2ª chamada Provão IME (PDF)', sub: 5 },
  { n: 4, nome: '2ª chamada Qualitativa (PDF)', sub: 2 }];
const COLUNAS_INGLES = [{ n: 1, nome: 'Prova de Inglês (PDF)' }, { n: 3, nome: '2ª chamada Prova de Inglês (PDF)', sub: 1 }];
const colunasDocumento = (nm, materia) => materia === 'Inglês' ? COLUNAS_INGLES
  : nm !== 'NM2' ? [{ n: 1, nome: 'Documento (PDF)' }]
  : materia === 'Linguagens' ? COLUNAS_NM2.filter(c => c.n === 2 || c.n === 4) : COLUNAS_NM2;
const rotuloColuna = (c) => c.nome.replace(' (PDF)', '');
const regraNm2 = (materia) => materia === 'Linguagens' ? 'Nota real = nota da Prova Qualitativa (Linguagens não tem média na NM2).'
  : materia === 'Inglês' ? 'Nota real = nota da Prova de Inglês.'
  : 'Nota real = (Provão ITA + Provão IME + Qualitativa) ÷ 3, quando as três estiverem lançadas.';
const nomeColuna = (q) => q.professor === 'Documento (PDF)' ? 'Nota do documento' : q.professor.replace(' (PDF)', '');
// ordem de exibição: cada coluna original seguida da sua 2ª chamada (na NM2: Provão ITA, Provão IME, Qualitativa)
const ORDEM_NM2 = { 1: 1, 5: 2, 2: 3 };
const ordenarColunas = (qs, nm) => {
  const pos = (q) => nm === 'NM2' ? (ORDEM_NM2[q.numero] ?? q.numero + 10) : q.numero;
  const base = qs.filter(q => !q.substitui_id).sort((a, b) => pos(a) - pos(b));
  return [...base.flatMap(b => [b, ...qs.filter(x => x.substitui_id === b.id)]), ...qs.filter(x => x.substitui_id && !base.some(b => b.id === x.substitui_id))];
};

async function importarPdf(ciclo, nm, materia, turmaId, planilhaId = null, coluna = null) {

  const alunos = estado.matriculas.filter(m => m.turma_id === turmaId && m.situacao === 'ativo')
    .map(m => estado.alunos.get(m.aluno_id)).filter(Boolean).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').classList.add('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Importar notas do PDF</h2>
      <span class="etiqueta">${esc(materia)} · ${nm} · ${esc(nomeTurma(turmaId))} · ${esc(ciclo.nome)}</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <label for="arquivo-pdf">Escolha o PDF com o nome dos alunos e as notas</label>
      ${comEscolha ? `<label for="qual-prova">Este PDF é</label>

  $('#ficha .fechar').onclick = fecharFicha;
  // se a pessoa trocar "Este PDF é" depois de escolher o arquivo, a prévia é refeita com a nova escolha
  let escolhaManual = false;
  if ($('#qual-prova')) $('#qual-prova').onchange = () => {
    escolhaManual = true;
    if ($('#arquivo-pdf').files[0]) $('#arquivo-pdf').onchange({ target: $('#arquivo-pdf') });

  $('#arquivo-pdf').onchange = async (e) => {

    $('#previa').innerHTML = '<div class="carregando">Lendo o PDF…</div>';
    let info;
    try { info = interpretarPdf(await lerLinhasPdf(arq)); }
    catch (err) { $('#previa').innerHTML = `<div class="secao"><div class="aviso erro">Não consegui ler o PDF: ${esc(err.message)}</div></div>`; return; }
    if (!info.alunos.length) { $('#previa').innerHTML = '<div class="secao"><div class="aviso erro">Não encontrei linhas de alunos com nota neste PDF.</div></div>'; return; }

    // Avisos: disciplina, turma e tipo de simulado diferentes do que foi escolhido
    const avisos = [];
    if (info.disciplina && !semAcento(info.disciplina).includes(semAcento(materia))) avisos.push(`O PDF é de <strong>${esc(info.disciplina)}</strong>, mas você está importando para ${esc(materia)}.`);
    const codPdf = (semAcento(info.turma).match(/(\d)([AB])I?$/) || []).slice(1).join('');
    if (codPdf && codPdf !== codigoTurma(nomeTurma(turmaId))) avisos.push(`O PDF é da turma <strong>${esc(info.turma)}</strong>, que parece ser a ${codPdf[0]}ª Série ${codPdf[1]}, não a ${esc(nomeTurma(turmaId))}.`);
    const tituloSA = semAcento(info.titulo);
    const segundaCh = /CHAMADA/.test(tituloSA);
    const provaoIme = /\bIME\b/.test(tituloSA);
    const provaPdf = materia === 'Inglês' ? (segundaCh ? 3 : 1)
      : /QUALITATIVA/.test(tituloSA) ? (segundaCh ? 4 : 2)
      : /PROVAO/.test(tituloSA) ? (provaoIme ? (segundaCh ? 6 : 5) : (segundaCh ? 3 : 1)) : null;
    const nmPdf = /QUALITATIVA|PROVAO/.test(tituloSA) ? 'NM2' : /\bIME\b/.test(tituloSA) ? 'NM3' : /\bITA\b/.test(tituloSA) ? 'NM1' : null;
    const rotulo = { NM1: 'ITA (NM1)', NM2: 'Provão/Qualitativa (NM2)', NM3: 'IME (NM3)' };
    const nomeProva = (n) => colunaDe(n) ? rotuloColuna(colunaDe(n)) : (COLUNAS_NM2.find(c => c.n === n) ? rotuloColuna(COLUNAS_NM2.find(c => c.n === n)) : '');
    if (nmPdf && nmPdf !== nm) avisos.push(`O título do PDF fala em <strong>${rotulo[nmPdf]}</strong>, mas você está importando para ${nm}.`);
    if (comEscolha && provaPdf) {
      // o título diz qual é a prova: se veio de um botão de outra prova, avisa; senão, já escolhe
      const escolhida = escolhaManual ? Number($('#qual-prova').value) : coluna;
      if (!colunaDe(provaPdf)) avisos.push(`O título do PDF indica <strong>${nomeProva(provaPdf)}</strong>, mas na ${nm} ${esc(materia)} tem só: ${colunas.filter(c => !c.sub).map(rotuloColuna).join(', ')}. Confira o PDF.`);
      else if (escolhida && escolhida !== provaPdf) avisos.push(`O título do PDF indica <strong>${nomeProva(provaPdf)}</strong>, mas foi escolhido ${nomeProva(escolhida)}. Confira o campo "Este PDF é".`);
      else $('#qual-prova').value = String(provaPdf);
    }

    const colunaEscolhida = comEscolha ? Number($('#qual-prova').value) : 1;
    const parcial = comEscolha && !!colunaDe(colunaEscolhida)?.sub;
    if (parcial) avisos.push(`Importando como <strong>${nomeProva(colunaEscolhida)}</strong>: só entram os alunos da lista, e a nota deles substitui a da prova original. Quem não está na lista não fica pendente.`);
    const r = analisarImportacao(info, alunos, turmaId, parcial);
    const vermelhas = r.pendencias;
    $('#previa').innerHTML = `
      <div class="secao">
        <h3>${esc(info.titulo)}</h3>
        ${avisos.map(a => `<div class="pendencia">${a}</div>`).join('')}
        <p style="margin:6px 0 12px">${info.alunos.length} alunos no documento ·
          <strong>${r.lancar.length} notas serão lançadas</strong> (nome igual) ·
          <strong style="color:var(--erro)">${vermelhas.length} ${vermelhas.length === 1 ? 'pendência' : 'pendências'}</strong> (ficam sem nota, em vermelho)</p>
        ${vermelhas.length ? `<div class="caixa-erros"><h3>Ficarão em vermelho para você corrigir</h3>
          ${vermelhas.map(x => `<div class="item"><strong>${esc(x.aluno_id ? estado.alunos.get(x.aluno_id).nome : x.nome_documento)}</strong><br>${esc(x.motivo)}</div>`).join('')}</div>` : ''}
        <div class="rolavel"><table id="tabela-importacao"><thead><tr><th>Nome no documento</th><th class="num">Nota</th><th>Situação</th></tr></thead>
          <tbody>${r.linhas.map(l => {
            const vai = r.lancar.some(x => x.nome === l.nome);
            return `<tr class="${vai ? '' : 'com-erro'}"><td>${esc(l.nome)}</td>
              <td class="num">${l.nota == null || Number.isNaN(l.nota) ? 'ilegível' : fmt(l.nota)}</td>
              <td>${vai ? '<span class="status aberta">nome igual · será lançada</span>' : '<span class="status vermelho">não será lançada</span>'}</td></tr>`;
          }).join('')}</tbody></table></div>
      </div>
      <div class="secao"><button class="botao" id="salvar-importacao">Salvar ${r.lancar.length} notas${vermelhas.length ? ` e marcar ${vermelhas.length} pendências` : ''}</button>
        <div id="msg-importacao" class="aviso escondido"></div></div>`;

    $('#salvar-importacao').onclick = async () => {
      const msg = $('#msg-importacao');
      $('#salvar-importacao').disabled = true;
      try {
        // cria a planilha na primeira importação: NM2 com as colunas das suas provas; as outras com uma coluna
        const numero = comEscolha ? Number($('#qual-prova').value) : 1;
        let pid = planilhaId;
        if (!pid) {
          const { data: p, error } = await db.from('planilhas').insert({ ciclo_id: ciclo.id, nm, materia, turma_id: turmaId, aberta: false }).select().single();
          if (error) throw error;
          pid = p.id;
        }
        const { data: qs, error: eq } = await db.from('questoes').select('id, numero').eq('planilha_id', pid).order('numero');
        if (eq) throw eq;
        // cria as colunas que faltam (as originais antes das de 2ª chamada, que apontam para elas)
        for (const c of colunas) {
          if (qs.some(q => q.numero === c.n)) continue;
          const nova = { planilha_id: pid, numero: c.n, professor: c.nome };
          if (c.sub) nova.substitui_id = qs.find(q => q.numero === c.sub).id;
          const { data: criada, error: e2 } = await db.from('questoes').insert(nova).select().single();
          if (e2) throw e2;
          qs.push(criada);
        }
        const questaoId = qs.find(q => q.numero === numero).id;
        const prefixo = comEscolha ? `[${nomeProva(numero)}] ` : '';
        if (r.lancar.length) {
          const { error: e3 } = await db.from('notas_questao').upsert(
            r.lancar.map(x => ({ aluno_id: x.aluno_id, questao_id: questaoId, nota: x.nota, atualizado_em: new Date().toISOString() })));
          if (e3) throw e3;
        }
        // a lista de pendências desta prova é refeita a cada importação (as da outra prova ficam)
        const { error: e4 } = await db.from('pendencias_notas').delete().eq('planilha_id', pid).eq('questao_id', questaoId);
        if (e4) throw e4;
        if (vermelhas.length) {
          const { error: e5 } = await db.from('pendencias_notas').insert(vermelhas.map(x => ({ planilha_id: pid, questao_id: questaoId, ...x, motivo: prefixo + x.motivo })));
          if (e5) throw e5;
        }
        fecharFicha();
        irPara('planilha', pid);
      } catch (err) {
        msg.textContent = 'Não foi possível salvar: ' + err.message; msg.classList.add('erro'); msg.classList.remove('escondido');
        $('#salvar-importacao').disabled = false;
      }
    };
  };
}

// ---------- Professores (cadastro + importação de Excel) ----------
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
// =====================================================================
// HORÁRIOS DE AULA
// Uma linha por aula: turma, dia (1 = segunda … 6 = sábado), início, fim e professor.
// Toda a equipe vê; admin e coordenação sobem o Excel e definem as salas.
// =====================================================================
const EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
const DIAS_LONGO = ['', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
const DIAS_CURTO = ['', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
const DURACAO_AULA = 50;   // minutos, quando o Excel só traz a hora de início
// horário padrão da escola (usado na planilha modelo quando ainda não há horário salvo)
const SLOTS_PADRAO = ['07:00', '07:50', '08:40', '10:00', '10:50', '11:40', '14:00', '14:50', '15:40', '17:00', '17:50']
  .map(h => ({ ini: paraMin(h), fim: paraMin(h) + DURACAO_AULA }));
// cores suaves por professor: [fundo, cor forte]
const CORES_AULA = [['#e8f1fd', '#2a78d6'], ['#fdeee6', '#d85a22'], ['#e3f5ed', '#16935f'], ['#fdf3d9', '#b07800'], ['#f0eafb', '#7148c4'],
  ['#fde8ef', '#c93a6e'], ['#e3f3f6', '#14879a'], ['#edf4e0', '#5d8a17'], ['#f5ece4', '#94592b'], ['#eaeef6', '#46598a'],
  ['#fbede0', '#bb5c16'], ['#e6efec', '#367563']];

function paraMin(h) { const m = String(h || '').match(/(\d{1,2})[:hH](\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
const hm = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const chaveProf = (p) => semAcento(String(p || '')).replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
function corDe(texto) {
  let h = 0; for (const c of chaveProf(texto)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return CORES_AULA[h % CORES_AULA.length];
}
const estiloCor = (texto) => { const [f, c] = corDe(texto); return `--fundo:${f};--cor:${c}`; };
const nomeCurtoTurma = (t) => t ? t.nome.replace(/\s*S[ée]rie\s*/i, ' ').replace(/\s+/g, ' ').trim() : '';   // "1ª A"
const salaDe = (turmaId) => estado.turmas.find(t => t.id === turmaId)?.sala || '';
function agoraNaEscola() {
  const d = new Date(); return { dia: d.getDay() === 0 ? 7 : d.getDay(), min: d.getHours() * 60 + d.getMinutes() };
}

// horários (slots) de aula, em ordem, e os intervalos entre eles
function montarSlots(aulas) {
  const mapa = new Map();
  aulas.forEach(a => mapa.set(a.ini, Math.max(mapa.get(a.ini) || 0, a.fim)));
  const slots = [...mapa].map(([ini, fim]) => ({ ini, fim })).sort((x, y) => x.ini - y.ini);
  return slots.length ? slots : SLOTS_PADRAO;
}
function pausaEntre(a, b) {
  if (!a || !b || b.ini <= a.fim) return null;
  return { ini: a.fim, fim: b.ini, nome: b.ini - a.fim >= 60 ? 'Almoço' : 'Intervalo' };
}
const diasUsados = (aulas) => { const max = Math.max(5, ...aulas.map(a => a.dia)); return [1, 2, 3, 4, 5, 6, 7].filter(d => d <= max); };

async function carregarHorario() {
  const { data, error } = await db.from('horarios').select('turma_id, dia, inicio, fim, professor').eq('ano_letivo', ANO_LETIVO).order('dia').order('inicio');
  if (error) throw error;
  return (data || []).map(x => ({ turma: x.turma_id, dia: x.dia, ini: paraMin(x.inicio), fim: paraMin(x.fim), prof: x.professor }));
}

async function paginaHorarios() {
  $('#conteudo').innerHTML = '<div class="carregando">Carregando horários…</div>';
  let aulas;
  try { aulas = await carregarHorario(); } catch (e) { return erroNaTela(e); }
  const H = estado.hor || (estado.hor = { visao: 'agora', turma: null, prof: null, momento: null });
  const turmasCom = estado.turmas.filter(t => aulas.some(a => a.turma === t.id));
  const profs = [...new Map(aulas.map(a => [chaveProf(a.prof), a.prof])).entries()]
    .map(([chave, nome]) => ({ chave, nome, n: aulas.filter(a => chaveProf(a.prof) === chave).length }))
    .sort((x, y) => x.nome.localeCompare(y.nome));
  if (!H.turma || !turmasCom.some(t => t.id === H.turma)) H.turma = turmasCom[0]?.id || null;
  if (!H.prof || !profs.some(p => p.chave === H.prof)) H.prof = profs[0]?.chave || null;
  const slots = montarSlots(aulas), dias = diasUsados(aulas);

  $('#conteudo').innerHTML = `
    <div class="barra"><div><h1>Horários de aula</h1></div><div class="espaco"></div>
      ${permite('horarios', 'editar') ? `<button class="botao leve" id="hor-salas">Salas das turmas</button>
        <button class="botao leve" id="hor-modelo">Baixar planilha (Excel)</button>
        <button class="botao" id="hor-subir">Subir horário (Excel)</button>` : ''}</div>
    <p class="subtitulo">${aulas.length ? `${aulas.length} aulas por semana · ${turmasCom.length} turmas · ${profs.length} professores · ano letivo ${ANO_LETIVO}`
      : 'Nenhum horário cadastrado ainda.'}</p>
    ${aulas.length ? `<div class="barra">
      <div class="alternar">
        <button data-hvisao="agora" class="${H.visao === 'agora' ? 'ativa' : ''}">Quem está onde</button>
        <button data-hvisao="turma" class="${H.visao === 'turma' ? 'ativa' : ''}">Por turma</button>
        <button data-hvisao="professor" class="${H.visao === 'professor' ? 'ativa' : ''}">Por professor</button>
      </div><div class="espaco"></div>
      <button class="botao leve" id="hor-imprimir">Imprimir</button>
      ${H.visao === 'turma' ? '<button class="botao leve" id="hor-imprimir-todas">Imprimir todas as turmas</button>' : ''}
    </div><div id="hor-corpo"></div>`
    : `<div class="hor-vazio">
        <div class="hor-vazio-icone">🗓️</div>
        <h2>Comece pelo Excel</h2>
        <p>${permite('horarios', 'editar') ? `Baixe a planilha modelo (uma aba para cada turma, já formatada), preencha o nome do professor em cada aula e suba o arquivo.
          Também dá para subir direto a planilha que vocês já usam, no mesmo formato: uma aba por turma, horários nas linhas e os dias nas colunas.`
          : 'A coordenação ainda não cadastrou o horário deste ano.'}</p>
        ${permite('horarios', 'editar') ? '<div class="barra" style="justify-content:center"><button class="botao leve" id="hor-modelo2">Baixar planilha modelo</button><button class="botao" id="hor-subir2">Subir horário (Excel)</button></div>' : ''}
      </div>`}`;
  const ligar = (id, fn) => { if ($(id)) $(id).onclick = fn; };
  ligar('#hor-salas', () => editarSalas());
  ligar('#hor-modelo', () => baixarModeloHorario(aulas));
  ligar('#hor-modelo2', () => baixarModeloHorario(aulas));
  ligar('#hor-subir', () => subirHorario());
  ligar('#hor-subir2', () => subirHorario());
  if (!aulas.length) return;
  document.querySelectorAll('[data-hvisao]').forEach(b => b.onclick = () => { H.visao = b.dataset.hvisao; paginaHorarios(); });

  const corpo = $('#hor-corpo');
  // ---------- Quem está onde (agora ou um momento escolhido) ----------
  const momentoAtual = () => {
    if (H.momento) return H.momento;
    const agora = agoraNaEscola();
    const dia = dias.includes(agora.dia) ? agora.dia : dias[0];
    const doDia = slots;
    const atual = dia === agora.dia ? doDia.find(s => agora.min >= s.ini && agora.min < s.fim) : null;
    const proximo = dia === agora.dia ? doDia.find(s => s.ini > agora.min) : null;
    return { dia, ini: (atual || proximo || doDia[0]).ini, agora: dia === agora.dia, emAula: !!atual, min: agora.min };
  };
  const painelMomento = (dia, ini) => {
    const slot = slots.find(s => s.ini === ini) || { ini, fim: ini + DURACAO_AULA };
    const iSlot = slots.indexOf(slot);
    const nesse = aulas.filter(a => a.dia === dia && a.ini === ini);
    const cards = turmasCom.map(t => {
      const a = nesse.find(x => x.turma === t.id);
      const depois = slots.slice(iSlot + 1).map(s => aulas.find(x => x.dia === dia && x.ini === s.ini && x.turma === t.id)).find(Boolean);
      return `<div class="hor-card ${a ? '' : 'livre'}" ${a ? `style="${estiloCor(a.prof)}"` : ''}>
        <div class="hor-card-topo"><strong>${esc(t.nome)}</strong>${t.sala ? `<span class="hor-sala">${esc(t.sala)}</span>` : ''}</div>
        ${a ? `<div class="hor-card-prof">${esc(a.prof)}</div><div class="hor-card-hora">${hm(a.ini)} – ${hm(a.fim)}</div>`
            : '<div class="hor-card-prof vazio">Sem aula</div><div class="hor-card-hora">&nbsp;</div>'}
        <div class="hor-card-depois">${depois ? `Depois: <strong>${esc(depois.prof)}</strong> às ${hm(depois.ini)}` : 'Última aula do dia'}</div>
      </div>`;
    }).join('');
    const lista = [...nesse].sort((x, y) => x.prof.localeCompare(y.prof));
    return `<div class="hor-cards">${cards}</div>
      <h2>Professores em sala · ${DIAS_LONGO[dia]}, ${hm(slot.ini)} – ${hm(slot.fim)}</h2>
      ${lista.length ? `<table class="hor-lista"><thead><tr><th>Professor</th><th>Turma</th><th>Sala</th><th>Horário</th></tr></thead><tbody>
        ${lista.map(a => `<tr><td><span class="hor-bolinha" style="${estiloCor(a.prof)}"></span><strong>${esc(a.prof)}</strong></td>
          <td>${esc(nomeTurma(a.turma))}</td><td>${esc(salaDe(a.turma)) || '<span class="vazio">sem sala</span>'}</td><td>${hm(a.ini)} – ${hm(a.fim)}</td></tr>`).join('')}
      </tbody></table>` : '<p class="subtitulo">Nenhuma aula neste horário.</p>'}`;
  };
  const desenharAgora = () => {
    const m = momentoAtual();
    const real = agoraNaEscola();
    let aviso = '';
    if (!H.momento) {
      if (!m.agora) aviso = `Hoje (${DIAS_LONGO[real.dia]}) não há aulas. Mostrando ${DIAS_LONGO[m.dia]}.`;
      else if (!m.emAula) {
        const antes = [...slots].reverse().find(s => s.fim <= real.min), prox = slots.find(s => s.ini > real.min);
        const pausa = pausaEntre(antes, prox);
        aviso = prox ? (pausa ? `Agora é ${pausa.nome.toLowerCase()} (${hm(pausa.ini)} – ${hm(pausa.fim)}). Mostrando a próxima aula.` : `As aulas começam às ${hm(prox.ini)}. Mostrando a primeira aula.`)
                     : 'As aulas de hoje já terminaram. Mostrando a primeira aula do dia.';
      }
    }
    corpo.innerHTML = `
      <div class="hor-momento">
        <div class="hor-relogio">${H.momento ? '<span class="hor-tag">Outro horário</span>' : '<span class="hor-tag ao-vivo">● Agora</span>'}
          <strong>${DIAS_LONGO[m.dia]}</strong> <span>${hm(m.ini)} – ${hm((slots.find(s => s.ini === m.ini) || {}).fim || m.ini + DURACAO_AULA)}</span></div>
        <div class="hor-escolha">
          <div class="hor-chips">${dias.map(d => `<button class="hor-chip ${d === m.dia ? 'ativa' : ''}" data-hdia="${d}">${DIAS_CURTO[d]}</button>`).join('')}</div>
          <div class="hor-chips">${slots.map(s => `<button class="hor-chip ${s.ini === m.ini ? 'ativa' : ''}" data-hini="${s.ini}">${hm(s.ini)}</button>`).join('')}</div>
          ${H.momento ? '<button class="botao leve pequeno" id="hor-agora">Voltar para agora</button>' : ''}
        </div>
      </div>
      ${aviso ? `<div class="aviso">${aviso}</div>` : ''}
      ${painelMomento(m.dia, m.ini)}`;
    corpo.querySelectorAll('[data-hdia]').forEach(b => b.onclick = () => { H.momento = { dia: Number(b.dataset.hdia), ini: m.ini }; desenharAgora(); });
    corpo.querySelectorAll('[data-hini]').forEach(b => b.onclick = () => { H.momento = { dia: m.dia, ini: Number(b.dataset.hini) }; desenharAgora(); });
    if ($('#hor-agora')) $('#hor-agora').onclick = () => { H.momento = null; desenharAgora(); };
  };

  // ---------- Grade da semana (turma ou professor) ----------
  const destaqueAgora = () => { const a = agoraNaEscola(); const s = slots.find(x => a.min >= x.ini && a.min < x.fim); return s ? { dia: a.dia, ini: s.ini } : null; };
  const grade = (celula, sel) => {
    const ag = destaqueAgora(), hoje = agoraNaEscola().dia;
    let linhas = '';
    slots.forEach((s, i) => {
      const p = pausaEntre(slots[i - 1], s);
      if (p) linhas += `<tr class="hor-pausa"><td colspan="${dias.length + 1}">${p.nome} · ${hm(p.ini)} – ${hm(p.fim)}</td></tr>`;
      linhas += `<tr><th class="hor-hora">${hm(s.ini)}<small>${hm(s.fim)}</small></th>${dias.map(d => {
        const marcado = sel && sel.dia === d && sel.ini === s.ini, agora = ag && ag.dia === d && ag.ini === s.ini;
        return `<td class="${d === hoje ? 'hoje' : ''}" data-hmom="${d}|${s.ini}">${celula(d, s, agora, marcado)}</td>`;
      }).join('')}</tr>`;
    });
    return `<div class="rolavel"><table class="hor-grade"><thead><tr><th class="hor-hora">Horário</th>
      ${dias.map(d => `<th class="${d === hoje ? 'hoje' : ''}">${DIAS_CURTO[d]}${d === hoje ? '<small>hoje</small>' : ''}</th>`).join('')}</tr></thead>
      <tbody>${linhas}</tbody></table></div>`;
  };
  const caixa = (texto, sub, cor, agora, marcado) => `<div class="hor-aula ${agora ? 'agora' : ''} ${marcado ? 'marcada' : ''}" style="${estiloCor(cor)}">
    ${agora ? '<span class="hor-agora-tag">agora</span>' : ''}<strong>${esc(texto)}</strong>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  const ligarCelulas = (redesenhar) => corpo.querySelectorAll('[data-hmom]').forEach(td => td.onclick = () => {
    const [d, i] = td.dataset.hmom.split('|').map(Number); H.momento = { dia: d, ini: i }; redesenhar(true);
  });

  const desenharTurma = (rolar) => {
    const t = estado.turmas.find(x => x.id === H.turma);
    const minhas = aulas.filter(a => a.turma === H.turma);
    const sel = H.momento;
    corpo.innerHTML = `
      <div class="hor-chips grande">${turmasCom.map(x => `<button class="hor-chip ${x.id === H.turma ? 'ativa' : ''}" data-hturma="${x.id}">${esc(nomeCurtoTurma(x))}</button>`).join('')}</div>
      <div class="hor-cabeca"><h2>${esc(t.nome)}</h2>${t.sala ? `<span class="hor-sala grande">${esc(t.sala)}</span>` : (permite('horarios', 'editar') ? '<span class="vazio">sala não definida</span>' : '')}
        <span class="subtitulo" style="margin:0">${minhas.length} aulas por semana · clique numa aula para ver onde está cada professor naquele horário</span></div>
      ${grade((d, s, agora, marcado) => { const a = minhas.find(x => x.dia === d && x.ini === s.ini); return a ? caixa(a.prof, '', a.prof, agora, marcado) : '<div class="hor-sem">—</div>'; }, sel)}
      <div id="hor-momento-baixo">${sel ? `<div class="barra" style="margin-top:24px"><div class="espaco"></div><button class="botao leve pequeno" id="hor-fechar-mom">Fechar</button></div>${painelMomento(sel.dia, sel.ini)}` : ''}</div>`;
    corpo.querySelectorAll('[data-hturma]').forEach(b => b.onclick = () => { H.turma = Number(b.dataset.hturma); desenharTurma(); });
    ligarCelulas(desenharTurma);
    if ($('#hor-fechar-mom')) $('#hor-fechar-mom').onclick = () => { H.momento = null; desenharTurma(); };
    if (rolar && sel) $('#hor-momento-baixo').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const desenharProfessor = (rolar) => {
    const p = profs.find(x => x.chave === H.prof);
    const minhas = aulas.filter(a => chaveProf(a.prof) === H.prof);
    const sel = H.momento;
    const turmasDele = [...new Set(minhas.map(a => a.turma))].map(id => nomeCurtoTurma(estado.turmas.find(t => t.id === id))).join(', ');
    corpo.innerHTML = `
      <div class="barra"><input type="search" id="hor-busca-prof" placeholder="Buscar professor"></div>
      <div class="hor-chips grande" id="hor-lista-profs">${profs.map(x => `<button class="hor-chip ${x.chave === H.prof ? 'ativa' : ''}" data-hprof="${esc(x.chave)}">
        <span class="hor-bolinha" style="${estiloCor(x.nome)}"></span>${esc(x.nome)} <small>${x.n}</small></button>`).join('')}</div>
      <div class="hor-cabeca"><h2><span class="hor-bolinha grande" style="${estiloCor(p.nome)}"></span>${esc(p.nome)}</h2>
        <span class="subtitulo" style="margin:0">${minhas.length} aulas por semana · ${esc(turmasDele)}</span></div>
      ${grade((d, s, agora, marcado) => {
        const a = minhas.filter(x => x.dia === d && x.ini === s.ini);
        if (!a.length) return '<div class="hor-sem">livre</div>';
        return a.map(x => caixa(nomeTurma(x.turma), salaDe(x.turma), nomeTurma(x.turma), agora, marcado)).join('') + (a.length > 1 ? '<div class="hor-conflito">2 turmas no mesmo horário</div>' : '');
      }, sel)}
      <div id="hor-momento-baixo">${sel ? `<div class="barra" style="margin-top:24px"><div class="espaco"></div><button class="botao leve pequeno" id="hor-fechar-mom">Fechar</button></div>${painelMomento(sel.dia, sel.ini)}` : ''}</div>`;
    corpo.querySelectorAll('[data-hprof]').forEach(b => b.onclick = () => { H.prof = b.dataset.hprof; desenharProfessor(); });
    $('#hor-busca-prof').oninput = () => {
      const f = chaveProf($('#hor-busca-prof').value);
      corpo.querySelectorAll('[data-hprof]').forEach(b => b.classList.toggle('escondido', !!f && !b.dataset.hprof.includes(f)));
    };
    ligarCelulas(desenharProfessor);
    if ($('#hor-fechar-mom')) $('#hor-fechar-mom').onclick = () => { H.momento = null; desenharProfessor(); };
    if (rolar && sel) $('#hor-momento-baixo').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  // ---------- Impressão (A4 deitado, uma grade por página) ----------
  const folha = (titulo, sub, celula) => {
    let linhas = '';
    slots.forEach((s, i) => {
      const p = pausaEntre(slots[i - 1], s);
      if (p) linhas += `<tr class="imp-hor-pausa"><td colspan="${dias.length + 1}">${p.nome} · ${hm(p.ini)} – ${hm(p.fim)}</td></tr>`;
      linhas += `<tr><th>${hm(s.ini)}<br><small>${hm(s.fim)}</small></th>${dias.map(d => `<td>${celula(d, s)}</td>`).join('')}</tr>`;
    });
    return `<div class="imp-horario"><div class="imp-topo"><h1>${esc(titulo)}</h1><span>${esc(sub)}</span></div>
      <table class="imp-hor-grade"><thead><tr><th>Horário</th>${dias.map(d => `<th>${DIAS_LONGO[d].replace('-feira', '')}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>`;
  };
  const impCaixa = (txt, sub, cor) => `<div class="imp-hor-aula" style="${estiloCor(cor)}"><strong>${esc(txt)}</strong>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  const folhaTurma = (t) => folha(`HORÁRIO · ${t.nome.toUpperCase()}`, `${t.sala ? t.sala + ' · ' : ''}ano letivo ${ANO_LETIVO}`,
    (d, s) => { const a = aulas.find(x => x.turma === t.id && x.dia === d && x.ini === s.ini); return a ? impCaixa(a.prof, '', a.prof) : ''; });
  const imprimir = (html) => { $('#impressao').innerHTML = html; setTimeout(() => window.print(), 50); };
  ligar('#hor-imprimir', () => {
    if (H.visao === 'turma') return imprimir(folhaTurma(estado.turmas.find(t => t.id === H.turma)));
    if (H.visao === 'professor') {
      const p = profs.find(x => x.chave === H.prof);
      return imprimir(folha(`HORÁRIO · PROF. ${p.nome}`, `ano letivo ${ANO_LETIVO}`, (d, s) => aulas.filter(x => chaveProf(x.prof) === H.prof && x.dia === d && x.ini === s.ini)
        .map(x => impCaixa(nomeTurma(x.turma), salaDe(x.turma), nomeTurma(x.turma))).join('')));
    }
    // quem está onde: um quadro geral (turmas nas colunas) para o dia escolhido
    const m = momentoAtual();
    imprimir(`<div class="imp-horario"><div class="imp-topo"><h1>QUADRO DO DIA · ${DIAS_LONGO[m.dia].toUpperCase()}</h1><span>ano letivo ${ANO_LETIVO}</span></div>
      <table class="imp-hor-grade"><thead><tr><th>Horário</th>${turmasCom.map(t => `<th>${esc(nomeCurtoTurma(t))}${t.sala ? `<br><small>${esc(t.sala)}</small>` : ''}</th>`).join('')}</tr></thead><tbody>
      ${slots.map((s, i) => { const p = pausaEntre(slots[i - 1], s);
        return (p ? `<tr class="imp-hor-pausa"><td colspan="${turmasCom.length + 1}">${p.nome} · ${hm(p.ini)} – ${hm(p.fim)}</td></tr>` : '') +
          `<tr><th>${hm(s.ini)}<br><small>${hm(s.fim)}</small></th>${turmasCom.map(t => { const a = aulas.find(x => x.turma === t.id && x.dia === m.dia && x.ini === s.ini); return `<td>${a ? impCaixa(a.prof, '', a.prof) : ''}</td>`; }).join('')}</tr>`; }).join('')}
      </tbody></table></div>`);
  });
  ligar('#hor-imprimir-todas', () => imprimir(turmasCom.map(folhaTurma).join('')));

  ({ agora: desenharAgora, turma: desenharTurma, professor: desenharProfessor })[H.visao]();
}

// ---------- Ler o Excel (uma aba por turma, ou vários quadros numa aba só) ----------
const DIA_DO_TEXTO = { SEG: 1, SEGUNDA: 1, TER: 2, TERCA: 2, QUA: 3, QUARTA: 3, QUI: 4, QUINTA: 4, SEX: 5, SEXTA: 5, SAB: 6, SABADO: 6, DOM: 7, DOMINGO: 7 };
function diaDoTexto(v) { const t = semAcento(String(v || '')).replace(/-?FEIRA/, '').replace(/[^A-Z]/g, ''); return DIA_DO_TEXTO[t] || null; }
function turmaDoTexto(v, estrito = true) {
  const t = semAcento(String(v || '')).replace(/[ªº°]/g, ' ').replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!t) return null;
  if (/^(TURMA )?CURSINHO$/.test(t) || (!estrito && /CURSINHO/.test(t))) return estado.turmas.find(x => !x.serie)?.id || null;
  const m = estrito ? t.match(/^(?:TURMA )?([123]) ?(?:SERIE |ANO )?([AB])$/) : t.match(/\b([123]) ?(?:SERIE |ANO )?([AB])\b/);
  if (!m) return null;
  return estado.turmas.find(x => Number(x.serie) === Number(m[1]) && String(x.letra).toUpperCase() === m[2])?.id || null;
}
function horaDaCelula(v) {
  if (typeof v === 'number') { const frac = v % 1; return frac > 0 || v === 0 ? { ini: Math.round(frac * 1440) } : null; }
  const achados = [...String(v || '').matchAll(/(\d{1,2})[:hH](\d{2})/g)].map(m => Number(m[1]) * 60 + Number(m[2]));
  return achados.length ? { ini: achados[0], fim: achados[1] } : null;
}
function lerHorarioExcel(wb) {
  const avisos = [], blocos = [];
  for (const nomeAba of wb.SheetNames) {
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { header: 1, raw: true, defval: '' });
    for (let r = 0; r < linhas.length; r++) {
      const diasCol = {}; linhas[r].forEach((v, c) => { const d = diaDoTexto(v); if (d) diasCol[c] = d; });
      if (Object.keys(diasCol).length < 3) continue;          // não é a linha de cabeçalho (SEG, TER, …)
      // turma: célula acima do cabeçalho (até 4 linhas) ou o nome da aba
      let turma = null, sala = null;
      for (let k = r - 1; k >= Math.max(0, r - 4); k--) {
        for (const v of linhas[k]) {
          if (!turma) turma = turmaDoTexto(v);
          const tx = String(v).trim();
          if (!sala && /^sala\b/i.test(tx)) sala = (/^sala\s*:/i.test(tx) ? tx.replace(/^sala\s*:\s*/i, '') : tx).split(/\s[·|]\s/)[0].trim() || null;
        }
      }
      if (!turma) turma = turmaDoTexto(nomeAba, false);
      const colHora = Math.min(...Object.keys(diasCol).map(Number)) - 1;
      const aulas = [];
      for (let k = r + 1; k < linhas.length; k++) {
        const lin = linhas[k];
        if (Object.keys(lin).filter(c => diaDoTexto(lin[c])).length >= 3) break;   // começou outro quadro
        const rotulo = semAcento(String(lin[Math.max(colHora, 0)] ?? ''));
        if (/INTERVALO|ALMOCO|LANCHE|RECREIO/.test(rotulo)) continue;
        const h = horaDaCelula(lin[Math.max(colHora, 0)]);
        if (!h) continue;
        for (const [c, d] of Object.entries(diasCol)) {
          const prof = String(lin[c] ?? '').replace(/\s+/g, ' ').trim();
          if (!prof || /^[-–—.]+$/.test(prof)) continue;
          aulas.push({ dia: d, ini: h.ini, fim: h.fim && h.fim > h.ini ? h.fim : h.ini + DURACAO_AULA, prof: prof.toLocaleUpperCase('pt-BR') });
        }
      }
      if (!turma) { avisos.push(`Aba "${nomeAba}": não reconheci a turma do quadro da linha ${r + 1}. Escreva a turma (ex.: 1ª A) acima do cabeçalho.`); continue; }
      if (blocos.some(b => b.turma === turma)) { avisos.push(`A ${nomeTurma(turma)} aparece mais de uma vez; usei só a primeira (aba "${blocos.find(b => b.turma === turma).aba}").`); continue; }
      blocos.push({ turma, sala, aba: nomeAba, aulas });
    }
  }
  // junta grafias do mesmo professor (HELCIO e HÉLCIO viram HÉLCIO)
  const variantes = new Map();
  blocos.forEach(b => b.aulas.forEach(a => {
    const k = chaveProf(a.prof), m = variantes.get(k) || new Map(); m.set(a.prof, (m.get(a.prof) || 0) + 1); variantes.set(k, m);
  }));
  const unificados = [];
  const acentos = (x) => x.normalize('NFD').length - x.length;
  const melhor = new Map([...variantes].map(([k, m]) => {
    const opcoes = [...m.entries()].sort((x, y) => acentos(y[0]) - acentos(x[0]) || y[1] - x[1]);
    if (opcoes.length > 1) unificados.push(`${opcoes.map(o => o[0]).join(' / ')} → ${opcoes[0][0]}`);
    return [k, opcoes[0][0]];
  }));
  blocos.forEach(b => b.aulas.forEach(a => { a.prof = melhor.get(chaveProf(a.prof)); }));
  // mesmo professor em duas turmas no mesmo horário
  const conflitos = [], vistos = new Map();
  blocos.forEach(b => b.aulas.forEach(a => {
    const k = `${a.dia}|${a.ini}|${chaveProf(a.prof)}`;
    if (vistos.has(k) && vistos.get(k) !== b.turma) conflitos.push(`${a.prof}: ${DIAS_CURTO[a.dia]} ${hm(a.ini)} na ${nomeTurma(vistos.get(k))} e na ${nomeTurma(b.turma)}`);
    else vistos.set(k, b.turma);
  }));
  return { blocos, avisos, unificados, conflitos };
}

function subirHorario() {
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').classList.add('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Subir horário (Excel)</h2><span class="etiqueta">ano letivo ${ANO_LETIVO} · substitui o horário atual</span></div>

    <div class="secao">
      <p style="margin-top:0">O arquivo pode ter <strong>uma aba para cada turma</strong> (como a planilha modelo) ou vários quadros numa aba só. Em cada quadro:</p>
      <ul class="hor-regras">
        <li>a turma escrita acima do quadro (ex.: <strong>1ª A</strong> ou <strong>1ª Série A</strong>);</li>
        <li>uma linha de cabeçalho com <strong>HORÁRIO</strong> e os dias (<strong>SEG, TER, QUA, QUI, SEX, SAB</strong>);</li>
        <li>uma linha por aula, com a hora de início (ou "07:00 – 07:50") e o nome do professor em cada dia;</li>
        <li>linhas de <strong>INTERVALO</strong> e <strong>ALMOÇO</strong> são ignoradas.</li>
      </ul>
      <div class="barra"><input type="file" id="hor-arquivo" accept=".xlsx,.xls"><button class="botao leve pequeno" id="hor-baixar-modelo">Baixar planilha modelo</button></div>
    </div>
    <div id="hor-previa"></div>
    <div id="msg-hor" class="aviso erro escondido" style="margin:0 24px 14px"></div>
    <div class="rodape-ficha"><button class="botao leve" id="hor-cancelar">Cancelar</button><button class="botao" id="hor-confirmar" disabled>Substituir horário</button></div>`;
  $('#ficha .fechar').onclick = fecharFicha;
  $('#hor-cancelar').onclick = fecharFicha;
  $('#hor-baixar-modelo').onclick = async () => baixarModeloHorario(await carregarHorario().catch(() => []));
  let lido = null;
  const erro = (m) => { $('#msg-hor').textContent = m; $('#msg-hor').classList.remove('escondido'); };
  $('#hor-arquivo').onchange = async (e) => {
    $('#msg-hor').classList.add('escondido'); $('#hor-confirmar').disabled = true; lido = null;
    const arq = e.target.files[0]; if (!arq) return;
    $('#hor-previa').innerHTML = '<div class="carregando">Lendo a planilha…</div>';
    try {
      await carregarScript(XLSX_URL);
      lido = lerHorarioExcel(XLSX.read(await arq.arrayBuffer()));
    } catch (err) { $('#hor-previa').innerHTML = ''; return erro('Não consegui ler o arquivo: ' + err.message); }
    const total = lido.blocos.reduce((s, b) => s + b.aulas.length, 0);
    if (!total) { $('#hor-previa').innerHTML = ''; return erro('Não encontrei nenhuma aula. Confira se o arquivo segue o formato acima.' + (lido.avisos.length ? ' ' + lido.avisos.join(' ') : '')); }
    const profs = new Map(); lido.blocos.forEach(b => b.aulas.forEach(a => profs.set(a.prof, (profs.get(a.prof) || 0) + 1)));
    const atual = await carregarHorario().catch(() => []);
    $('#hor-previa').innerHTML = `<div class="secao">
      <div class="tiles">
        <div class="tile"><span>Turmas</span><strong>${lido.blocos.length}</strong></div>
        <div class="tile"><span>Aulas por semana</span><strong>${total}</strong></div>
        <div class="tile"><span>Professores</span><strong>${profs.size}</strong></div>
        <div class="tile ${lido.conflitos.length ? 'ruim' : ''}"><span>Choques de horário</span><strong>${lido.conflitos.length}</strong></div>
      </div>
      <table class="hor-lista" style="margin-top:14px"><thead><tr><th>Turma</th><th>Aba do Excel</th><th>Aulas</th><th>Sala no Excel</th></tr></thead><tbody>
        ${lido.blocos.map(b => `<tr><td><strong>${esc(nomeTurma(b.turma))}</strong></td><td>${esc(b.aba)}</td><td>${b.aulas.length}</td><td>${esc(b.sala || '') || '<span class="vazio">—</span>'}</td></tr>`).join('')}
      </tbody></table>
      ${lido.conflitos.length ? `<div class="aviso erro"><strong>Professor em duas turmas ao mesmo tempo</strong> (confira no Excel; dá para salvar assim mesmo):<br>${lido.conflitos.map(esc).join('<br>')}</div>` : ''}

      <div class="hor-chips">${[...profs].sort((x, y) => x[0].localeCompare(y[0])).map(([p, n]) => `<span class="hor-chip"><span class="hor-bolinha" style="${estiloCor(p)}"></span>${esc(p)} <small>${n}</small></span>`).join('')}</div>
