  $('#hor-confirmar').onclick = async (e) => {
    if (!lido) return;
    e.target.disabled = true; e.target.textContent = 'Salvando…';
    const linhas = lido.blocos.flatMap(b => b.aulas.map(a => ({ turma_id: b.turma, dia: a.dia, inicio: hm(a.ini), fim: hm(a.fim), professor: a.prof })));
    const { error } = await db.rpc('substituir_horario', { p_ano: ANO_LETIVO, p_linhas: linhas });
    if (error) { e.target.disabled = false; e.target.textContent = 'Tentar de novo'; return erro('Não foi possível salvar: ' + error.message); }
    // salas que vieram no Excel (só preenche onde a turma ainda não tem sala)
    for (const b of lido.blocos) {
      const t = estado.turmas.find(x => x.id === b.turma);
      if (b.sala && !t.sala) { const r = await db.from('turmas').update({ sala: b.sala }).eq('id', t.id); if (!r.error) t.sala = b.sala; }
    }
    fecharFicha();
    estado.hor = { visao: 'turma', turma: lido.blocos[0].turma, prof: null, momento: null };
    paginaHorarios();
  };
}

// =====================================================================
// FREQUÊNCIA: uma folha impressa por turma e por dia. Quem faltou ganha um X
// no quadradinho; quem veio assina. A câmera do celular lê a folha.
// =====================================================================
const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
const QRGEN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const FREQ_MINIMA = 75;        // presença abaixo disso (em %) gera alerta
const FREQ_SEGUIDAS = 3;       // faltas seguidas que geram alerta
const FREQ_DIAS_MIN = 5;       // só calcula alerta de % depois de alguns dias de aula
const QR_PREFIXO = 'ITAIME-FREQ:';
const ALUNOS_POR_FOLHA = 42;

// Tudo na folha é medido em milímetros (A4 em pé: 210 x 297).
// Os quadrados pretos dos cantos e do meio das laterais são as "âncoras" que a câmera procura.
const FOLHA = {
  marcas: { TL: [15, 15], TR: [195, 15], BR: [195, 282], BL: [15, 282], ML: [15, 148.5], MR: [195, 148.5] },
  lado: 9,
  x: { num: 24, nome: 32, faltou: 112, assin: 126, fim: 186 },
  topoTabela: 43, cab: 6, fimTabela: 272,
  qr: { x: 160, y: 7, lado: 26 },
};
const PPM = 5;   // pixels por milímetro na folha "endireitada"

function geometriaFolha(n) {
  const inicio = FOLHA.topoTabela + FOLHA.cab;
  const h = Math.min(6.5, (FOLHA.fimTabela - inicio) / Math.max(n, 1));
  const caixa = Math.min(4.6, Math.max(3, h - 1.6));
  const cx = (FOLHA.x.faltou + FOLHA.x.assin) / 2;
  return { inicio, h, caixa, linhas: Array.from({ length: n }, (_, i) => {
    const y = inicio + i * h; return { y, caixa: [cx - caixa / 2, y + (h - caixa) / 2] }; }) };
}
const diaSemana = (d) => new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long' });
const pctPresenca = (r) => r && Number(r.dias) ? Math.round(1000 * (r.dias - r.faltas) / r.dias) / 10 : null;
const emAlerta = (r) => !!r && Number(r.dias) > 0 &&
  ((Number(r.dias) >= FREQ_DIAS_MIN && pctPresenca(r) < FREQ_MINIMA) || Number(r.faltas_seguidas) >= FREQ_SEGUIDAS);
const alunosAtivosDaTurma = (turmaId) => estado.matriculas
  .filter(m => m.turma_id === turmaId && m.situacao === 'ativo')
  .sort((x, y) => (x.ordem ?? 999) - (y.ordem ?? 999) || (estado.alunos.get(x.aluno_id)?.nome || '').localeCompare(estado.alunos.get(y.aluno_id)?.nome || '', 'pt-BR'))
  .map(m => m.aluno_id);

// atestados que valem num dia (Map aluno → atestado) e saídas do dia (Map aluno → [saídas])
async function atestadosDoDia(dia) {
  const { data, error } = await db.from('atestados').select('*').lte('data_inicio', dia).gte('data_fim', dia);
  return new Map(error ? [] : (data || []).map(a => [a.aluno_id, a]));
}
async function saidasDoDia(dia) {
  const { data, error } = await db.from('saidas').select('*').eq('data', dia).order('hora_saida');
  const m = new Map();
  if (!error) (data || []).forEach(x => { if (!m.has(x.aluno_id)) m.set(x.aluno_id, []); m.get(x.aluno_id).push(x); });
  return m;
}
const hhmm = (t) => t ? String(t).slice(0, 5) : '';
// verso de toda folha de frequência: "OCORRÊNCIAS DO DIA" com linhas de ponta a ponta
function svgVerso(turma, dia, rotulo) {
  const linhas = [];
  for (let y = 34; y <= 292; y += 8.6) linhas.push(`<line x1="0" y1="${y}" x2="210" y2="${y}" stroke="#777" stroke-width=".3"/>`);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" font-family="Arial, Helvetica, sans-serif">
    <rect width="210" height="297" fill="#fff"/>
    <text x="105" y="15" font-size="7" font-weight="700" text-anchor="middle">OCORRÊNCIAS DO DIA</text>
    <text x="105" y="22.5" font-size="3.3" text-anchor="middle">${esc(`Turma: ${turma} · Data: ${data(dia)}${rotulo ? ' · ' + rotulo : ''}`)}</text>
    <text x="105" y="28" font-size="2.7" text-anchor="middle" fill="#555">Professor(a): anote aqui as ocorrências da sala durante o dia e devolva esta folha à coordenação no fim do expediente.</text>
    ${linhas.join('')}
  </svg>`;
}

// ---------- desenho da folha (SVG em milímetros: sai igual em qualquer impressora) ----------
function svgQR(texto, x, y, lado) {
  const qr = qrcode(0, 'M'); qr.addData(texto); qr.make();
  const n = qr.getModuleCount(), m = 4, total = n + 2 * m, k = lado / total;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<g transform="translate(${x} ${y}) scale(${k})"><rect width="${total}" height="${total}" fill="#fff"/>
    <path d="${d}" fill="#000" shape-rendering="crispEdges"/></g>`;
}
function svgFolha(folha, turma, primeiroNum, atestados) {
  const g = geometriaFolha(folha.alunos.length), X = FOLHA.x, L = FOLHA.lado, n = folha.alunos.length;
  const fimTab = g.inicio + n * g.h;
  const txt = (x, y, tam, t, extra = '') => `<text x="${x}" y="${y}" font-size="${tam}" ${extra}>${esc(t)}</text>`;
  const marcas = Object.values(FOLHA.marcas).map(([cx, cy]) => `<rect x="${cx - L / 2}" y="${cy - L / 2}" width="${L}" height="${L}" fill="#000"/>`).join('');
  const caixaTopo = (x, y, w, rot, valor) => `
    <rect x="${x}" y="${y}" width="${w}" height="7.5" fill="none" stroke="#000" stroke-width=".35"/>
    <line x1="${x + 17}" y1="${y}" x2="${x + 17}" y2="${y + 7.5}" stroke="#000" stroke-width=".35"/>
    ${txt(x + 2, y + 5, 3, rot, 'font-weight="700"')}${txt(x + 19.5, y + 5.1, 3.4, valor, 'font-weight="700"')}`;
  const linhas = folha.alunos.map((id, i) => {
    const r = g.linhas[i], nome = estado.alunos.get(id)?.nome || '', base = r.y + g.h / 2 + 1;
    const tam = Math.min(3, g.h * 0.55), longo = nome.length * tam * 0.6 > X.faltou - X.nome - 3;
    return `<line x1="${X.num}" y1="${r.y + g.h}" x2="${X.fim}" y2="${r.y + g.h}" stroke="#666" stroke-width=".2"/>
      ${txt((X.num + X.nome) / 2, base, tam, primeiroNum + i, 'text-anchor="middle"')}
      ${txt(X.nome + 1.5, base, tam, nome, longo ? `textLength="${X.faltou - X.nome - 3}" lengthAdjust="spacingAndGlyphs"` : '')}
      <rect x="${r.caixa[0]}" y="${r.caixa[1]}" width="${g.caixa}" height="${g.caixa}" fill="#fff" stroke="#000" stroke-width=".35"/>
      ${atestados?.has(id) ? txt((X.assin + X.fim) / 2, base, Math.min(2.8, tam), 'ATESTADO MÉDICO (falta abonada)', 'text-anchor="middle" font-weight="700" fill="#555"') : ''}`;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" font-family="Arial, Helvetica, sans-serif">
    <rect width="210" height="297" fill="#fff"/>${marcas}
    ${txt(24, 13.5, 5.2, 'LISTA DE FREQUÊNCIA', 'font-weight="700"')}
    ${txt(24, 18.5, 2.8, `Turmas ITA-IME · ${folha.ano_letivo}`, 'fill="#444"')}
    ${caixaTopo(24, 22, 64, 'TURMA:', turma.toUpperCase())}
    ${caixaTopo(92, 22, 62, 'DATA:', `${data(folha.data)} · ${diaSemana(folha.data)}`)}
    ${txt(24, 36, 2.9, 'Faltou: marque um X no quadradinho.  Veio: assine o seu nome na sua linha.')}
    ${txt(24, 40, 2.4, 'Não escreva sobre os quadrados pretos dos cantos nem sobre o código ao lado.', 'fill="#555"')}
    ${svgQR(QR_PREFIXO + folha.id, FOLHA.qr.x, FOLHA.qr.y, FOLHA.qr.lado)}
    ${txt(FOLHA.qr.x + FOLHA.qr.lado / 2, FOLHA.qr.y + FOLHA.qr.lado + 3.2, 2.8, `Folha nº ${folha.id}`, 'text-anchor="middle" font-weight="700"')}
    <rect x="${X.num}" y="${FOLHA.topoTabela}" width="${X.fim - X.num}" height="${fimTab - FOLHA.topoTabela}" fill="none" stroke="#000" stroke-width=".35"/>
    <line x1="${X.num}" y1="${g.inicio}" x2="${X.fim}" y2="${g.inicio}" stroke="#000" stroke-width=".35"/>
    ${[X.nome, X.faltou, X.assin].map(x => `<line x1="${x}" y1="${FOLHA.topoTabela}" x2="${x}" y2="${fimTab}" stroke="#000" stroke-width=".25"/>`).join('')}
    ${txt((X.num + X.nome) / 2, FOLHA.topoTabela + 4.2, 2.9, 'Nº', 'text-anchor="middle" font-weight="700"')}
    ${txt(X.nome + 1.5, FOLHA.topoTabela + 4.2, 2.9, 'NOME', 'font-weight="700"')}
    ${txt((X.faltou + X.assin) / 2, FOLHA.topoTabela + 4.2, 2.6, 'FALTOU', 'text-anchor="middle" font-weight="700"')}
    ${txt((X.assin + X.fim) / 2, FOLHA.topoTabela + 4.2, 2.9, 'ASSINATURA', 'text-anchor="middle" font-weight="700"')}
    ${linhas}
    ${txt(24, 280.5, 2.4, `Folha nº ${folha.id} · ${turma} · ${data(folha.data)} · ${n} ${n === 1 ? 'aluno' : 'alunos'}`, 'fill="#444"')}
    ${txt(186, 280.5, 2.4, 'Depois da aula, fotografe a folha inteira com o celular.', 'text-anchor="end" fill="#444"')}
  </svg>`;
}

// ---------- imprimir as folhas do dia ----------
function abrirImprimirFolhas() {
  const turmas = estado.turmas.map(t => ({ t, n: alunosAtivosDaTurma(t.id).length }));
  $('#fundo-ficha').classList.remove('escondido'); $('#ficha').classList.remove('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Imprimir folhas de frequência</h2>
      <span class="etiqueta">uma folha por turma, com os alunos ativos de hoje</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <label for="fi-data">Dia da chamada</label>
      <input type="date" id="fi-data" value="${estado.freq?.dia || hojeLocal()}" style="max-width:220px">
      <h3 style="margin:18px 0 8px">Turmas</h3>
      <div class="fr-escolha">${turmas.map(({ t, n }) => `<label class="${n ? '' : 'vazio'}"><input type="checkbox" value="${t.id}" ${n ? 'checked' : 'disabled'}>
        ${esc(t.nome)} <small>${n} ${n === 1 ? 'aluno' : 'alunos'}${n > ALUNOS_POR_FOLHA ? ` · ${Math.ceil(n / ALUNOS_POR_FOLHA)} folhas` : ''}</small></label>`).join('')}</div>
      <p class="subtitulo" style="margin:14px 0 0">Imprima em A4, <strong>frente e verso</strong> (virar na borda longa) e <strong>sem ajustar à página</strong> (escala 100%).
        A frente é a lista; o verso é a página "Ocorrências do dia" para o professor anotar. Cada folha tem um código só dela: imprima de novo se a turma mudar.
        Alunos com atestado no dia já saem marcados.</p>
    </div>
    <div id="msg-fi" class="aviso erro escondido" style="margin:0 24px 14px"></div>
    <div class="rodape-ficha"><button class="botao leve" id="fi-cancelar">Cancelar</button>
      <button class="botao" id="fi-ok">Gerar e imprimir</button></div>`;
  $('#ficha .fechar').onclick = fecharFicha; $('#fi-cancelar').onclick = fecharFicha;
  $('#fi-ok').onclick = async (e) => {
    const dia = $('#fi-data').value, ids = [...document.querySelectorAll('.fr-escolha input:checked')].map(c => Number(c.value));
    const erro = (m) => { $('#msg-fi').textContent = m; $('#msg-fi').classList.remove('escondido'); e.target.disabled = false; e.target.textContent = 'Gerar e imprimir'; };
    if (!dia) return erro('Escolha o dia.');
    if (!ids.length) return erro('Marque pelo menos uma turma.');
    e.target.disabled = true; e.target.textContent = 'Gerando…';
    try { await carregarScript(QRGEN_URL); } catch { return erro('Não consegui carregar o gerador de código. Confira a internet e tente de novo.'); }
    const novas = [];
    for (const tid of ids) {
      const alunos = alunosAtivosDaTurma(tid), partes = Math.ceil(alunos.length / ALUNOS_POR_FOLHA), tam = Math.ceil(alunos.length / partes);
      for (let p = 0; p < partes; p++) novas.push({ ano_letivo: ANO_LETIVO, turma_id: tid, data: dia, alunos: alunos.slice(p * tam, (p + 1) * tam) });
    }
    const { data: criadas, error } = await db.from('folhas_frequencia').insert(novas).select('id, ano_letivo, turma_id, data, alunos');
    if (error) return erro('Não foi possível gerar: ' + error.message);
    const ordem = (f) => [ids.indexOf(f.turma_id), alunosAtivosDaTurma(f.turma_id).indexOf(f.alunos[0])];
    criadas.sort((x, y) => ordem(x)[0] - ordem(y)[0] || ordem(x)[1] - ordem(y)[1]);
    const atestados = await atestadosDoDia(dia);
    $('#impressao').innerHTML = criadas.map(f => `<div class="imp-folha">${svgFolha(f, nomeTurma(f.turma_id), ordem(f)[1] + 1, atestados)}</div>
      <div class="imp-folha">${svgVerso(nomeTurma(f.turma_id), f.data, `folha nº ${f.id}`)}</div>`).join('');
    fecharFicha();
    imprimirSemMargem();
  };
}
// as folhas precisam sair do tamanho exato do A4 (sem a margem padrão do sistema)
function imprimirSemMargem() {
  const st = document.createElement('style'); st.id = 'pagina-folha';
  st.textContent = '@media print { @page { size: A4 portrait; margin: 0; } }';
  document.head.appendChild(st);
  const tirar = () => { st.remove(); window.removeEventListener('afterprint', tirar); };
  window.addEventListener('afterprint', tirar);
  setTimeout(() => { window.print(); setTimeout(tirar, 1500); }, 150);
}

// ---------- leitura da foto ----------
async function carregarImagem(arquivo, maxLado = 2200) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));

// encontra os quadrados pretos, endireita a folha e lê o código da folha
async function localizarFolha(arquivo) {
  const img = await carregarImagem(arquivo);
  const bin = binarizar(img, Math.round(Math.max(img.w, img.h) / 10), 0.7);
  const todas = manchas(bin, img.w, img.h).filter(c => !c.borda).map(c => {
    const bw = c.x1 - c.x0 + 1, bh = c.y1 - c.y0 + 1;
    return { ...c, bw, bh, cheio: c.area / (bw * bh), p: [c.cx, c.cy] };
  }).filter(c => c.cheio >= 0.45 && c.bw / c.bh < 2 && c.bh / c.bw < 2 && bin[Math.round(c.cy) * img.w + Math.round(c.cx)]);
  todas.sort((a, b) => b.area - a.area);
  const top = todas.slice(0, 10);
  if (top.length < 4) throw new Error('Não achei os 4 quadrados pretos dos cantos da folha.');
  // os 4 cantos: a combinação de manchas que forma o maior quadrilátero
  let melhor = null;
  for (let a = 0; a < top.length; a++) for (let b = a + 1; b < top.length; b++) for (let c = b + 1; c < top.length; c++) for (let d = c + 1; d < top.length; d++) {
    const g = [top[a], top[b], top[c], top[d]], areas = g.map(x => x.area);
    if (Math.max(...areas) > 5 * Math.min(...areas)) continue;
    const pts = emOrdemHoraria(g.map(x => x.p)), ar = areaPoligono(pts);
    if (!melhor || ar > melhor.ar) melhor = { pts, ar, g };
  }
  if (!melhor || melhor.ar < img.w * img.h * 0.08) throw new Error('Não achei os 4 quadrados pretos dos cantos da folha.');
  const M = FOLHA.marcas, mmCantos = [M.TL, M.TR, M.BR, M.BL];
  // descobre qual canto é o de cima à esquerda: primeiro pelo formato (a folha é mais alta que larga), depois pelo código
  const giros = [0, 1, 2, 3].map(k => [0, 1, 2, 3].map(i => melhor.pts[(i + k) % 4]))
    .filter(c => (dist(c[0], c[1]) + dist(c[2], c[3])) < (dist(c[1], c[2]) + dist(c[3], c[0])));
  await carregarScript(JSQR_URL);
  let escolhido = null, folhaId = null;
  for (const c of giros) {
    const mapa = homografia(mmCantos, c);
    if (!mapa) continue;
    const id = lerQRRetificado(img, mapa);
    if (id) { escolhido = c; folhaId = id; break; }
  }
  // sem código legível: supõe a folha em pé (canto de cima à esquerda é o mais perto do topo da foto)
  if (!escolhido) escolhido = giros.sort((x, y) => (x[0][0] + x[0][1]) - (y[0][0] + y[0][1]))[0] || melhor.pts;
  let mapa = homografia(mmCantos, escolhido);
  if (!mapa) throw new Error('A folha ficou muito torta na foto.');
  // papel curvado: se achar também os quadrados do meio das laterais, usa metade de cima e metade de baixo separadas
  const escala = dist(escolhido[0], escolhido[1]) / (M.TR[0] - M.TL[0]);
  const perto = (mm) => { const alvo = mapa(...mm); const c = todas.filter(x => dist(x.p, alvo) < 7 * escala).sort((x, y) => dist(x.p, alvo) - dist(y.p, alvo))[0]; return c?.p; };
  const ml = perto(M.ML), mr = perto(M.MR);
  let meio = false;
  if (ml && mr) {
    const cima = homografia([M.TL, M.TR, M.MR, M.ML], [escolhido[0], escolhido[1], mr, ml]);
    const baixo = homografia([M.ML, M.MR, M.BR, M.BL], [ml, mr, escolhido[2], escolhido[3]]);
    if (cima && baixo) { mapa = (x, y) => (y < M.ML[1] ? cima : baixo)(x, y); meio = true; }
  }
  const ret = retificar(img, mapa, 0, 0, 210, 297, PPM);
  return { ret, folhaId, meio };
}

// lê cada linha: quadradinho marcado? tem assinatura?
function analisarFolha(ret, n) {
  const g = geometriaFolha(n), W = ret.w, bin = binarizar(ret, 15 * PPM, 0.78);
  const escuro = (x0, y0, x1, y1) => { let s = 0, t = 0;
    for (let y = Math.max(0, y0); y < Math.min(ret.h, y1); y++) for (let x = Math.max(0, x0); x < Math.min(W, x1); x++) { s += bin[y * W + x]; t++; }
    return t ? s / t : 0; };
  const s = Math.round(g.caixa * PPM), busca = 7;
  let tortas = 0;
  const linhas = g.linhas.map(r => {
    const bx = Math.round(r.caixa[0] * PPM), by = Math.round(r.caixa[1] * PPM);
    // acha a borda impressa do quadradinho perto de onde ele deveria estar (corrige pequenos desvios da foto)
    let m = { dx: 0, dy: 0, v: -1 };
    for (let dy = -busca; dy <= busca; dy++) for (let dx = -busca; dx <= busca; dx++) {
      let v = 0; const x0 = bx + dx, y0 = by + dy;
      for (let k = 0; k <= s; k++) v += bin[y0 * W + x0 + k] + bin[(y0 + s) * W + x0 + k] + bin[(y0 + k) * W + x0] + bin[(y0 + k) * W + x0 + s];
      if (v > m.v || (v === m.v && Math.abs(dx) + Math.abs(dy) < Math.abs(m.dx) + Math.abs(m.dy))) m = { dx, dy, v };
    }
    if (m.v < 2 * s) { tortas++; m = { dx: 0, dy: 0, v: m.v }; }
    const dentro = Math.round(0.8 * PPM), x0 = bx + m.dx, y0 = by + m.dy;
    const marca = escuro(x0 + dentro, y0 + dentro, x0 + s - dentro + 1, y0 + s - dentro + 1);
    const ya = Math.round((r.y + 0.8) * PPM) + m.dy, yb = Math.round((r.y + g.h - 0.8) * PPM) + m.dy;
    const assinatura = escuro(Math.round((FOLHA.x.assin + 1.2) * PPM), ya, Math.round((FOLHA.x.fim - 1.2) * PPM), yb);
    return { marca, assinatura, dx: m.dx, dy: m.dy };
  });
  return { linhas, tortas, g };
}
// decide falta/presença e o que precisa de conferência
function decidirLinha(l) {
  const marcou = l.marca >= 0.12, fraca = !marcou && l.marca >= 0.05, assinou = l.assinatura >= 0.008;
  if (fraca) return { falta: !assinou, conferir: 'marca fraca no quadradinho' };
  if (marcou && assinou) return { falta: true, conferir: 'marcado como falta, mas tem assinatura' };
  if (!marcou && !assinou) return { falta: true, conferir: 'sem X e sem assinatura' };
  return { falta: marcou, conferir: null };
}

async function processarFoto(arquivo, folhaDigitada) {
  const corpo = $('#lf-corpo');
  corpo.innerHTML = '<div class="carregando">Lendo a folha…</div>';
  await new Promise(r => setTimeout(r, 30));
  let loc;
  try { loc = await localizarFolha(arquivo); }
  catch (e) {
    corpo.innerHTML = `<div class="aviso erro">${esc(e.message || 'Não consegui ler a foto.')}</div>
      <p>Tente de novo com a folha inteira aparecendo, os quatro quadrados pretos visíveis e boa luz.</p>
      <div class="fr-camera"><button class="botao" id="lf-de-novo">Tirar outra foto</button></div>`;
    $('#lf-de-novo').onclick = abrirLeituraFolha;
    return;
  }
  const folhaId = folhaDigitada || loc.folhaId;
  if (!folhaId) {
    corpo.innerHTML = `<div class="aviso">Achei a folha, mas não consegui ler o código (o quadrado de pontinhos no alto, à direita).</div>
      <label for="lf-num">Digite o número da folha (está embaixo do código: "Folha nº …")</label>
      <div class="linha-acao"><input type="number" id="lf-num" min="1" style="max-width:180px"><button class="botao" id="lf-continuar">Continuar</button>
        <button class="botao leve" id="lf-de-novo">Tirar outra foto</button></div>`;
    $('#lf-de-novo').onclick = abrirLeituraFolha;
    $('#lf-continuar').onclick = () => { const n = Number($('#lf-num').value); if (n > 0) processarFoto(arquivo, n); };
    return;
  }
  const { data: folha, error } = await db.from('folhas_frequencia').select('*').eq('id', folhaId).maybeSingle();
  if (error || !folha) {
    corpo.innerHTML = `<div class="aviso erro">A folha nº ${esc(folhaId)} não foi encontrada no sistema.</div>
      <div class="fr-camera"><button class="botao" id="lf-de-novo">Tirar outra foto</button></div>`;
    $('#lf-de-novo').onclick = abrirLeituraFolha;
    return;
  }
  const analise = analisarFolha(loc.ret, folha.alunos.length);
  const { data: jaTem } = await db.from('chamadas').select('id, origem, registrado_por, registrado_em').eq('turma_id', folha.turma_id).eq('data', folha.data).maybeSingle();
  mostrarRevisao(folha, loc, analise, jaTem);
}
function desenharRetificada(ret, analise, itens, comMarcas) {
  const cv = document.createElement('canvas'); cv.width = ret.w; cv.height = ret.h;
  const cx = cv.getContext('2d'), im = cx.createImageData(ret.w, ret.h);
  for (let i = 0; i < ret.cinza.length; i++) { im.data[4 * i] = im.data[4 * i + 1] = im.data[4 * i + 2] = ret.cinza[i]; im.data[4 * i + 3] = 255; }
  cx.putImageData(im, 0, 0);

    const g = analise.g;
    itens.forEach((it, i) => {
      const l = analise.linhas[i], y = (g.linhas[i].y) * PPM + l.dy, h = g.h * PPM;
      if (it.conferir && !it.conferido) { cx.fillStyle = 'rgba(245, 180, 0, .28)'; cx.fillRect(FOLHA.x.num * PPM, y, (FOLHA.x.fim - FOLHA.x.num) * PPM, h); }

      const [bx, by] = g.linhas[i].caixa;

}

  // quem tem atestado no dia: a falta é abonada (aparece marcado na revisão)
  atestadosDoDia(folha.data).then(m => { if (!m.size) return; itens.forEach(it => it.atestado = m.has(it.id)); if ($('#lf-salvar') && !$('#lf-salvar').disabled) desenhar(); });
  const salvarLeitura = async (botao) => {
    botao.disabled = true; botao.textContent = 'Salvando…';
    const msg = (m) => { $('#msg-lf').innerHTML = m; $('#msg-lf').classList.remove('escondido'); };
    // guarda a imagem endireitada da folha (com as assinaturas), num espaço que só a coordenação abre
    let foto = null;
    try {
      const blob = await new Promise(ok => desenharRetificada(loc.ret, analise, itens, false).toBlob(ok, 'image/jpeg', 0.72));
      const caminho = `${folha.ano_letivo}/${folha.turma_id}/${folha.data}_folha${folha.id}.jpg`;
      const { error } = await db.storage.from('frequencia').upload(caminho, blob, { upsert: true, contentType: 'image/jpeg' });
      if (!error) foto = caminho;
    } catch (e) { /* segue sem a foto */ }
    const { error } = await db.rpc('salvar_chamada', { p_turma: folha.turma_id, p_data: folha.data, p_ano: folha.ano_letivo,
      p_alunos: folha.alunos, p_faltas: itens.filter(x => x.falta).map(x => x.id), p_origem: 'folha', p_folha: folha.id, p_foto: foto });
    if (error) { botao.disabled = false; botao.textContent = 'Salvar chamada'; return msg('Não foi possível salvar: ' + esc(error.message)); }
    const faltas = itens.filter(x => x.falta);
    corpo.innerHTML = `<div class="aviso">Chamada da <strong>${esc(turma)}</strong> de ${esc(data(folha.data))} salva:
        ${itens.length - faltas.length} presentes e ${faltas.length} ${faltas.length === 1 ? 'falta' : 'faltas'}.${foto ? '' : ' (A imagem da folha não foi guardada.)'}</div>
      ${faltas.length ? `<p><strong>Faltaram:</strong> ${faltas.map(x => esc(x.nome)).join(', ')}</p>` : ''}
      <div class="fr-camera"><button class="botao fr-grande" id="lf-proxima">📷 Ler a próxima folha</button>
        <button class="botao leve" id="lf-fechar">Fechar</button></div>`;
    $('#lf-proxima').onclick = abrirLeituraFolha;
    $('#lf-fechar').onclick = () => { fecharFicha(); if (estado.pagina?.[0] === 'frequencia') paginaFrequencia(); };
  };
  desenhar();
}

// ---------- corrigir ou lançar uma chamada à mão ----------
async function editarChamada(turmaId, dia) {
  $('#fundo-ficha').classList.remove('escondido'); $('#ficha').classList.remove('largo');
  $('#ficha').innerHTML = '<div class="carregando">Carregando chamada…</div>';
  const { data: ch } = await db.from('chamadas').select('*').eq('turma_id', turmaId).eq('data', dia).maybeSingle();
  let lista = [];
  if (ch) {
    const { data: fr } = await db.from('frequencia').select('aluno_id, faltou').eq('chamada_id', ch.id);
    const ordem = alunosAtivosDaTurma(turmaId);
    lista = (fr || []).map(x => ({ id: x.aluno_id, faltou: x.faltou }))
      .sort((a, b) => ((ordem.indexOf(a.id) + 1) || 999) - ((ordem.indexOf(b.id) + 1) || 999) || (estado.alunos.get(a.id)?.nome || '').localeCompare(estado.alunos.get(b.id)?.nome || '', 'pt-BR'));
  } else lista = alunosAtivosDaTurma(turmaId).map(id => ({ id, faltou: false }));
  const atestadosDia = await atestadosDoDia(dia);
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>${esc(nomeTurma(turmaId))} · ${esc(data(dia))}</h2>
      <span class="etiqueta">${ch ? (ch.origem === 'manual' ? 'chamada lançada à mão' : `lida da folha nº ${ch.folha_id ?? '—'}`) : 'sem chamada neste dia'}</span>
      ${ch?.registrado_por ? `<div><small class="vazio">por ${esc(ch.registrado_por)}</small></div>` : ''}</div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <p class="subtitulo" style="margin:0 0 10px">Marque quem <strong>faltou</strong>.</p>
      <div class="fr-lista-manual">${lista.map(x => `<label><input type="checkbox" value="${x.id}" ${x.faltou ? 'checked' : ''}> ${esc(estado.alunos.get(x.id)?.nome || '(aluno apagado)')}${atestadosDia.has(x.id) ? ' <span class="fr-tag-atestado">Atestado</span>' : ''}</label>`).join('')}</div>
      ${atestadosDia.size ? '<p class="subtitulo" style="margin:8px 0 0">Quem está com <strong>Atestado</strong> tem a falta abonada: não conta como falta nem gera alerta.</p>' : ''}
      ${ch?.foto ? '<div class="linha-acao"><button class="botao leve" id="ch-foto">Ver a folha fotografada</button></div>' : ''}
      ${ch ? `<div class="linha-acao"><button class="botao leve" id="ch-apagar">Apagar esta chamada…</button></div>
        <div id="ch-confirmar" class="escondido"><div class="aviso erro">Apaga a chamada inteira deste dia (presenças e faltas).</div>
          <div class="linha-acao"><button class="botao perigo" id="ch-apagar-sim">Sim, apagar</button><button class="botao leve" id="ch-apagar-nao">Cancelar</button></div></div>` : ''}
    </div>
    <div id="msg-ch" class="aviso erro escondido" style="margin:0 24px 14px"></div>
    <div class="rodape-ficha"><button class="botao leve" id="ch-cancelar">Cancelar</button><button class="botao" id="ch-salvar">Salvar</button></div>`;
  $('#ficha .fechar').onclick = fecharFicha; $('#ch-cancelar').onclick = fecharFicha;
  const erro = (m) => { $('#msg-ch').textContent = m; $('#msg-ch').classList.remove('escondido'); };
  const depois = () => { fecharFicha(); paginaFrequencia(); };
  if ($('#ch-foto')) $('#ch-foto').onclick = async () => {
    const { data: u, error } = await db.storage.from('frequencia').createSignedUrl(ch.foto, 600);
    if (error || !u?.signedUrl) return erro('Não consegui abrir a imagem da folha.');
    window.open(u.signedUrl, '_blank', 'noopener');
  };
  if ($('#ch-apagar')) {
    $('#ch-apagar').onclick = () => { $('#ch-confirmar').classList.remove('escondido'); $('#ch-apagar').classList.add('escondido'); };
    $('#ch-apagar-nao').onclick = () => { $('#ch-confirmar').classList.add('escondido'); $('#ch-apagar').classList.remove('escondido'); };
    $('#ch-apagar-sim').onclick = async () => { const { error } = await db.from('chamadas').delete().eq('id', ch.id); if (error) return erro(error.message); depois(); };
  }
  $('#ch-salvar').onclick = async (e) => {
    if (!lista.length) return erro('Esta turma não tem alunos ativos.');
    e.target.disabled = true;
    const faltas = [...document.querySelectorAll('.fr-lista-manual input:checked')].map(c => Number(c.value));
    const { error } = await db.rpc('salvar_chamada', { p_turma: turmaId, p_data: dia, p_ano: ch?.ano_letivo || ANO_LETIVO, p_alunos: lista.map(x => x.id),
      p_faltas: faltas, p_origem: ch?.origem || 'manual', p_folha: ch?.folha_id ?? null, p_foto: null });
    if (error) { e.target.disabled = false; return erro('Não foi possível salvar: ' + error.message); }
    depois();
  };
}

async function relatorioTurma(turmaId, mes) {
  const [ano, m] = mes.split('-').map(Number), ultimo = new Date(ano, m, 0).getDate();
  const { data: linhas, error } = await db.from('frequencia_detalhe').select('*')
    .eq('turma_id', turmaId).gte('data', `${mes}-01`).lte('data', `${mes}-${String(ultimo).padStart(2, '0')}`);
  if (error) return { html: `<div class="aviso erro">${esc(error.message)}</div>`, imp: '' };
  const dias = [...new Set(linhas.map(l => l.data))].sort();
  const ordem = alunosAtivosDaTurma(turmaId);
  const ids = [...new Set([...ordem, ...linhas.map(l => l.aluno_id)])]
    .sort((a, b) => ((ordem.indexOf(a) + 1) || 999) - ((ordem.indexOf(b) + 1) || 999) || (estado.alunos.get(a)?.nome || '').localeCompare(estado.alunos.get(b)?.nome || '', 'pt-BR'));
  if (!dias.length) return { html: '<p class="subtitulo">Nenhuma chamada desta turma neste mês.</p>', imp: '<p>Nenhuma chamada desta turma neste mês.</p>' };
  const mapa = new Map(linhas.map(l => [l.aluno_id + '|' + l.data, l.atestado && l.faltou_folha ? 'A' : l.faltou]));
  const resumo = estado.freqResumo || new Map();
  const corpo = ids.map((id, i) => {
    const marcas = dias.map(d => mapa.get(id + '|' + d));
    const f = marcas.filter(x => x === true).length, total = marcas.filter(x => x !== undefined).length;
    const pMes = total ? Math.round(1000 * (total - f) / total) / 10 : null, r = resumo.get(id), pAno = pctPresenca(r);
    return { id, num: i + 1, nome: estado.alunos.get(id)?.nome || '(aluno apagado)', marcas, f, total, pMes, pAno, alerta: emAlerta(r) };
  });
  const cel = (x) => x === true ? '<td class="fr-f">F</td>' : x === 'A' ? '<td class="fr-a" title="Atestado: falta abonada">A</td>' : x === false ? '<td class="fr-p">•</td>' : '<td></td>';
  const cab = `<tr><th>Nº</th><th>Aluno</th>${dias.map(d => `<th class="n">${d.slice(8)}</th>`).join('')}<th class="n">Faltas no mês</th><th class="n">Presença no mês</th><th class="n">Presença no ano</th></tr>`;
  const html = `<div class="rolavel"><table class="fr-rel">
    <thead>${cab.replace(/class="n"/g, 'class="num"')}</thead>
    <tbody>${corpo.map(l => `<tr class="${l.alerta ? 'alerta' : ''}"><td>${l.num}</td><td><button class="link" data-aluno="${l.id}">${esc(l.nome)}</button></td>
      ${l.marcas.map(cel).join('')}<td class="num">${l.f}</td><td class="num">${l.pMes == null ? '—' : fmt(l.pMes) + '%'}</td>
      <td class="num">${l.pAno == null ? '—' : `<span class="fr-pct ${l.alerta ? 'ruim' : ''}">${fmt(l.pAno)}%</span>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="subtitulo" style="margin:8px 0 0">${dias.length} ${dias.length === 1 ? 'dia' : 'dias'} com chamada no mês · F = falta · A = atestado (falta abonada) · • = presente · linhas em destaque estão em alerta.</p>`;
  const imp = `<table class="imp-tabela fr-rel-imp"><thead>${cab}</thead><tbody>${corpo.map(l => `<tr><td class="n">${l.num}</td><td>${esc(l.nome)}${l.alerta ? ' ⚠' : ''}</td>
    ${l.marcas.map(x => `<td class="n">${x === true ? '<strong>F</strong>' : x === 'A' ? 'A' : x === false ? '•' : ''}</td>`).join('')}
    <td class="n">${l.f}</td><td class="n">${l.pMes == null ? '—' : fmt(l.pMes) + '%'}</td><td class="n">${l.pAno == null ? '—' : fmt(l.pAno) + '%'}</td></tr>`).join('')}</tbody></table>
    <p class="imp-rodape">F = falta · A = atestado (falta abonada) · • = presente · ⚠ = em alerta (presença abaixo de ${FREQ_MINIMA}% ou ${FREQ_SEGUIDAS}+ faltas seguidas).</p>`;
  return { html, imp };
}

// ---------- lista por aula (turma + dia + aula): presença do dia, atestados e saídas ----------
async function aulasDoDia(turmaId, dia) {
  const ds = new Date(dia + 'T12:00').getDay() || 7;
  const { data } = await db.from('horarios').select('inicio, fim, professor').eq('ano_letivo', ANO_LETIVO).eq('turma_id', turmaId).eq('dia', ds).order('inicio');
  return data || [];
}
// situação de cada aluno numa aula: atestado > saída > chamada do dia
function situacaoNaAula(id, aula, ctx) {
  if (ctx.atestados.has(id)) return { cod: 'atestado', texto: 'Atestado' };
  const ini = aula ? hhmm(aula.inicio) : null, fim = aula ? hhmm(aula.fim) : null;
  for (const sd of ctx.saidas.get(id) || []) {
    const sa = hhmm(sd.hora_saida), ret = sd.retorna ? hhmm(sd.hora_retorno) : null;
    if (!aula) return { cod: 'saiu', texto: `Saiu às ${sa}${ret ? `, volta às ${ret}` : ''}` };
    if (sa <= ini && (!ret || ret > ini)) return { cod: 'saiu', texto: `Saiu às ${sa}${ret ? ` (volta às ${ret})` : ''}` };
    if (sa > ini && sa < fim) return { cod: 'saiu', texto: `Sai às ${sa}, durante a aula` };
  }
  if (!ctx.chamada) return { cod: 'sem', texto: 'Chamada do dia não lançada' };
  const f = ctx.freq.get(id);
  if (f === undefined) return { cod: 'sem', texto: 'Fora da chamada do dia' };
  return f ? { cod: 'falta', texto: 'Faltou' } : { cod: 'presente', texto: 'Presente' };
}
async function montarListaPorAula(turmaId, dia, aula) {
  const [ch, atestados, saidas] = await Promise.all([
    db.from('chamadas').select('id').eq('turma_id', turmaId).eq('data', dia).maybeSingle(),
    atestadosDoDia(dia), saidasDoDia(dia)]);
  let freq = new Map();
  if (ch.data) {
    const { data: fr } = await db.from('frequencia').select('aluno_id, faltou').eq('chamada_id', ch.data.id);
    freq = new Map((fr || []).map(x => [x.aluno_id, x.faltou]));
  }
  const ctx = { chamada: ch.data, freq, atestados, saidas };
  const linhas = alunosAtivosDaTurma(turmaId).map((id, i) => ({ id, num: i + 1, nome: estado.alunos.get(id)?.nome || '', ...situacaoNaAula(id, aula, ctx) }));
  const conta = (c) => linhas.filter(l => l.cod === c).length;
  return { linhas, chamada: !!ch.data, conta: { presente: conta('presente'), falta: conta('falta'), atestado: conta('atestado'), saiu: conta('saiu'), sem: conta('sem') },
    geradoEm: new Date() };
}
function ligarListaPorAula(F) {
  let atual = null, aulas = [];
  const rotuloAula = (a, i) => `${i + 1}ª aula · ${hhmm(a.inicio)}–${hhmm(a.fim)} · ${a.professor}`;
  const aulaEscolhida = () => { const v = $('#pa-aula').value; return v === '' ? null : aulas[Number(v)]; };
  const carregarAulas = async () => {
    F.paTurma = $('#pa-turma').value; F.paDia = $('#pa-dia').value;
    aulas = await aulasDoDia(Number(F.paTurma), F.paDia);
    $('#pa-aula').innerHTML = aulas.map((a, i) => `<option value="${i}">${esc(rotuloAula(a, i))}</option>`).join('')
      + '<option value="">Dia todo (sem aula específica)</option>';
    // escolhe a aula que está acontecendo agora, se o dia for hoje
    const agora = new Date().toTimeString().slice(0, 5), k = F.paDia === hojeLocal() ? aulas.findIndex(a => hhmm(a.inicio) <= agora && agora < hhmm(a.fim)) : -1;
    $('#pa-aula').value = k >= 0 ? String(k) : (aulas.length ? '0' : '');
    await desenhar();
  };
  const desenhar = async () => {
    if (!$('#pa-dia').value) return;
    $('#pa-lista').innerHTML = '<div class="carregando">Montando a lista…</div>';
    atual = await montarListaPorAula(Number($('#pa-turma').value), $('#pa-dia').value, aulaEscolhida());
    const c = atual.conta;
    $('#pa-lista').innerHTML = `
      ${atual.chamada ? '' : '<div class="aviso">A chamada deste dia ainda não foi lançada: a lista mostra só atestados e saídas.</div>'}
      <div class="tiles">
        <div class="tile"><span>Presentes</span><strong>${c.presente}</strong></div>
        <div class="tile ${c.falta ? 'ruim' : ''}"><span>Faltaram</span><strong>${c.falta}</strong></div>
        <div class="tile"><span>Atestado</span><strong>${c.atestado}</strong></div>
        <div class="tile"><span>Saíram (autorização)</span><strong>${c.saiu}</strong></div></div>
      <div class="rolavel"><table class="pa-tabela"><thead><tr><th class="num">Nº</th><th>Aluno</th><th>Situação</th></tr></thead>
      <tbody>${atual.linhas.map(l => `<tr class="pa-${l.cod}"><td class="num">${l.num}</td><td>${esc(l.nome)}</td><td><span class="pa-sit pa-${l.cod}">${esc(l.texto)}</span></td></tr>`).join('')}</tbody></table></div>
      <p class="subtitulo" style="margin:8px 0 0">Situação em ${atual.geradoEm.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}. Toque em Atualizar para ver mudanças.</p>`;
  };
  $('#pa-turma').onchange = carregarAulas; $('#pa-dia').onchange = carregarAulas;
  $('#pa-aula').onchange = desenhar; $('#pa-atualizar').onclick = desenhar;
  $('#pa-imprimir').onclick = async () => {
    await desenhar();
    const tid = Number($('#pa-turma').value), dia = $('#pa-dia').value, aula = aulaEscolhida(), i = aulas.indexOf(aula);
    const turma = nomeTurma(tid), rot = aula ? rotuloAula(aula, i) : 'dia todo', c = atual.conta;
    $('#impressao').innerHTML = `<div class="imp-folha imp-pa ${atual.linhas.length > 38 ? 'muitos' : ''}"><div class="imp-pa-conteudo">
        <div class="imp-topo"><h1>LISTA DE FREQUÊNCIA DA AULA</h1><span>impresso em ${atual.geradoEm.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span></div>
        <p class="imp-sub"><strong>Turma:</strong> ${esc(turma)} · <strong>Data:</strong> ${esc(data(dia))} (${esc(diaSemana(dia))}) · <strong>Aula:</strong> ${esc(rot)}</p>
        <p class="imp-sub">Presentes: <strong>${c.presente}</strong> · Faltaram: <strong>${c.falta}</strong> · Atestado: <strong>${c.atestado}</strong> · Saíram: <strong>${c.saiu}</strong>${atual.chamada ? '' : ' · <em>chamada do dia ainda não lançada</em>'}</p>
        <table class="imp-tabela"><thead><tr><th class="n">Nº</th><th>Aluno</th><th>Situação</th><th style="width:30mm">Visto do professor</th></tr></thead>
        <tbody>${atual.linhas.map(l => `<tr><td class="n">${l.num}</td><td>${esc(l.nome)}</td><td class="${['falta', 'atestado', 'saiu'].includes(l.cod) ? 'imp-destaque' : ''}">${esc(l.texto)}</td><td></td></tr>`).join('')}</tbody></table>
        <p class="imp-rodape">Situação no momento da impressão: chamada do dia, atestados vigentes e autorizações de saída registradas pela coordenação.</p></div></div>
      <div class="imp-folha">${svgVerso(turma, dia, aula ? rot.split(' · ').slice(0, 2).join(' · ') : '')}</div>`;
    imprimirSemMargem();
  };
  carregarAulas();
}

const MEIOS_SAIDA = ['Acompanhado pelo responsável', 'Acompanhado por outra pessoa autorizada', 'Uber / aplicativo', 'Táxi', 'A pé', 'Transporte escolar', 'Ônibus', 'Carro da família'];
async function paginaAtestados() {
  if (!permite('atestados')) return irPara(primeiraPagina());
  const A = estado.filtroAt || (estado.filtroAt = { situacao: 'vigentes', turma: '', dia: hojeLocal() });
  $('#conteudo').innerHTML = '<div class="carregando">Carregando atestados e saídas…</div>';
  const [at, sd] = await Promise.all([
    db.from('atestados').select('*').order('data_inicio', { ascending: false }).limit(1000),
    db.from('saidas').select('*').eq('data', A.dia).order('hora_saida'),
  ]);
  if (at.error || sd.error) return erroNaTela(at.error || sd.error);
  const ed = permite('atestados', 'editar'), hoje = hojeLocal();
  const sit = (a) => a.data_fim < hoje ? 'encerrado' : a.data_inicio > hoje ? 'futuro' : 'vigente';
  const turmaDe = (id) => estado.matriculas.find(m => m.aluno_id === id)?.turma_id;
  const filtrarTurma = (x) => !A.turma || String(x.turma_id ?? turmaDe(x.aluno_id)) === A.turma;
  const ats = (at.data || []).filter(a => (A.situacao === 'todos' || sit(a) === 'vigente' || (A.situacao === 'vigentes' && sit(a) === 'futuro')) && filtrarTurma(a));
  const sds = (sd.data || []).filter(filtrarTurma);
  $('#conteudo').innerHTML = `
    <div class="barra"><h1>Atestados e saídas</h1><div class="espaco"></div>
      ${ed ? `<button class="botao leve" id="at-novo-atestado">+ Atestado médico</button>
      <button class="botao" id="at-nova-saida">+ Autorização de saída</button>` : ''}</div>
    <p class="subtitulo">Atestado: nos dias dele, a folha de frequência e a lista por aula mostram "Atestado" e a falta é abonada.
      Autorização de saída: ao salvar, a ocorrência "Autorização de Saída da Escola" é criada sozinha na ficha do aluno.</p>
    <div class="barra"><select id="at-f-turma"><option value="">Todas as turmas</option>${estado.turmas.map(t => `<option value="${t.id}" ${String(t.id) === A.turma ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></div>

    <div class="fr-bloco"><div class="barra" style="margin:0 0 10px"><h2>Atestados médicos</h2>
      <select id="at-f-sit"><option value="vigentes" ${A.situacao === 'vigentes' ? 'selected' : ''}>Valendo hoje e futuros</option>
        <option value="todos" ${A.situacao === 'todos' ? 'selected' : ''}>Todos</option></select></div>
      ${!ats.length ? '<p class="subtitulo">Nenhum atestado com esses filtros.</p>' : `<div class="rolavel"><table>
        <thead><tr><th>Aluno</th><th>Turma</th><th>De</th><th>Até</th><th>Observação</th><th>Situação</th><th></th></tr></thead>
        <tbody>${ats.map(a => `<tr><td><button class="link" data-aluno="${a.aluno_id}">${esc(estado.alunos.get(a.aluno_id)?.nome || 'Aluno ' + a.aluno_id)}</button></td>
          <td>${esc(nomeTurma(a.turma_id ?? turmaDe(a.aluno_id)))}</td><td>${esc(data(a.data_inicio))}</td><td>${esc(data(a.data_fim))}</td>
          <td>${esc(a.observacao || '—')}</td>
          <td><span class="status ${sit(a) === 'vigente' ? 'aberta' : 'fechada'}">${{ vigente: 'valendo', encerrado: 'encerrado', futuro: 'começa depois' }[sit(a)]}</span></td>
          <td>${ed ? `<button class="botao leve pequeno" data-editar-atestado="${a.id}">Editar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`}</div>

    <div class="fr-bloco"><div class="barra" style="margin:0 0 10px"><h2>Autorizações de saída</h2>
      <input type="date" id="at-f-dia" value="${A.dia}" style="max-width:190px"><span class="subtitulo" style="margin:0">${esc(diaSemana(A.dia))} · ${sds.length} ${sds.length === 1 ? 'saída' : 'saídas'}</span></div>
      ${!sds.length ? '<p class="subtitulo">Nenhuma saída registrada neste dia.</p>' : `<div class="rolavel"><table>
        <thead><tr><th>Saída</th><th>Aluno</th><th>Turma</th><th>Autorizado por</th><th>Motivo</th><th>Deslocamento / acompanhante</th><th>Retorno</th><th></th></tr></thead>
        <tbody>${sds.map(x => `<tr><td><strong>${esc(hhmm(x.hora_saida))}</strong></td>
          <td><button class="link" data-aluno="${x.aluno_id}">${esc(estado.alunos.get(x.aluno_id)?.nome || 'Aluno ' + x.aluno_id)}</button></td>
          <td>${esc(nomeTurma(x.turma_id ?? turmaDe(x.aluno_id)))}</td><td>${esc(x.autorizado_por)}</td><td>${esc(x.motivo)}</td><td>${esc(x.deslocamento)}</td>
          <td>${x.retorna ? `volta às ${esc(hhmm(x.hora_retorno))}${x.observacao ? `<small class="vazio" style="display:block">${esc(x.observacao)}</small>` : ''}` : 'não retorna'}</td>
          <td>${ed ? `<button class="botao leve pequeno" data-editar-saida="${x.id}">Editar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
  $('#at-f-turma').onchange = (e) => { A.turma = e.target.value; paginaAtestados(); };
  $('#at-f-sit').onchange = (e) => { A.situacao = e.target.value; paginaAtestados(); };
  $('#at-f-dia').onchange = (e) => { if (e.target.value) { A.dia = e.target.value; paginaAtestados(); } };
  document.querySelectorAll('#conteudo [data-aluno]').forEach(b => b.onclick = () => abrirFicha(Number(b.dataset.aluno)));
  const depois = () => { fecharFicha(); paginaAtestados(); };
  if ($('#at-novo-atestado')) $('#at-novo-atestado').onclick = () => formAtestado(null, depois);
  if ($('#at-nova-saida')) $('#at-nova-saida').onclick = () => formSaida(null, depois);
  document.querySelectorAll('[data-editar-atestado]').forEach(b => b.onclick = () => formAtestado(at.data.find(x => x.id === Number(b.dataset.editarAtestado)), depois));
  document.querySelectorAll('[data-editar-saida]').forEach(b => b.onclick = () => formSaida(sd.data.find(x => x.id === Number(b.dataset.editarSaida)), depois));
}
// campos Turma → Aluno (a lista de alunos acompanha a turma escolhida)
function camposTurmaAluno(turmaId, alunoId) {
  const turmaIni = turmaId || estado.matriculas.find(m => m.aluno_id === alunoId)?.turma_id || '';
  return `<div><label for="ta-turma">Turma</label><select id="ta-turma"><option value="">Escolha…</option>
      ${estado.turmas.filter(t => alunosAtivosDaTurma(t.id).length).map(t => `<option value="${t.id}" ${t.id === turmaIni ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></div>
    <div><label for="ta-aluno">Aluno</label><select id="ta-aluno" data-inicial="${alunoId || ''}"></select></div>`;
}
function ligarTurmaAluno() {
  const encher = () => {
    const tid = Number($('#ta-turma').value), ini = $('#ta-aluno').dataset.inicial;
    const ids = tid ? alunosAtivosDaTurma(tid) : [];
    if (ini && !ids.includes(Number(ini))) ids.push(Number(ini));
    $('#ta-aluno').innerHTML = '<option value="">Escolha…</option>' + ids.map(id => `<option value="${id}" ${String(id) === ini ? 'selected' : ''}>${esc(estado.alunos.get(id)?.nome || '')}</option>`).join('');
  };
  $('#ta-turma').onchange = () => { $('#ta-aluno').dataset.inicial = ''; encher(); };
  encher();
}
function modalForm(titulo, etiqueta, corpo, novo) {
  $('#fundo-ficha').classList.remove('escondido'); $('#ficha').classList.remove('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>${titulo}</h2>${etiqueta ? `<span class="etiqueta">${etiqueta}</span>` : ''}</div><button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao"><div class="form-edicao">${corpo}</div></div>
    <div id="msg-form" class="aviso erro escondido" style="margin:0 24px 14px"></div>
    <div class="rodape-ficha">${novo ? '' : '<button class="botao leve" id="form-apagar" style="margin-right:auto">Apagar…</button>'}
      <button class="botao leve" id="form-cancelar">Cancelar</button><button class="botao" id="form-salvar">${novo ? 'Salvar' : 'Salvar alterações'}</button></div>`;
  $('#ficha .fechar').onclick = fecharFicha; $('#form-cancelar').onclick = fecharFicha;
  return (m) => { $('#msg-form').textContent = m; $('#msg-form').classList.remove('escondido'); $('#form-salvar').disabled = false; };
}
function ligarApagar(tabela, id, depois, erro) {
  if (!$('#form-apagar')) return;
  $('#form-apagar').onclick = async (e) => {
    if (e.target.dataset.confirmar !== '1') { e.target.dataset.confirmar = '1'; e.target.textContent = 'Clique de novo para apagar de vez'; e.target.classList.add('perigo'); return; }
    const { error } = await db.from(tabela).delete().eq('id', id);
    if (error) return erro('Não foi possível apagar: ' + error.message);
    depois();
  };
}
function formAtestado(at, depois) {
  const novo = !at; at = at || { data_inicio: hojeLocal(), data_fim: hojeLocal(), observacao: '' };
  const erro = modalForm(novo ? 'Lançar atestado médico' : 'Editar atestado médico', 'nos dias do atestado a falta é abonada', `
    ${camposTurmaAluno(at.turma_id, at.aluno_id)}
    <div><label for="as-ini">Data de início</label><input type="date" id="as-ini" value="${esc(at.data_inicio)}"></div>
    <div><label for="as-fim">Data final (validade)</label><input type="date" id="as-fim" value="${esc(at.data_fim)}"></div>
    <div class="largo"><label for="as-obs">Observação (opcional)</label><input type="text" id="as-obs" value="${esc(at.observacao || '')}" placeholder="Ex.: CID não informado, atestado entregue pela mãe"></div>`, novo);
  ligarTurmaAluno();
  $('#form-salvar').onclick = async () => {
    const aluno = Number($('#ta-aluno').value), turma = Number($('#ta-turma').value) || null, ini = $('#as-ini').value, fim = $('#as-fim').value;
    if (!aluno) return erro('Escolha a turma e o aluno.');
    if (!ini || !fim) return erro('Informe a data de início e a data final.');
    if (fim < ini) return erro('A data final não pode ser antes da data de início.');
    $('#form-salvar').disabled = true;
    const dados = { aluno_id: aluno, turma_id: turma, data_inicio: ini, data_fim: fim, observacao: $('#as-obs').value.trim() || null };
    const { error } = novo ? await db.from('atestados').insert(dados) : await db.from('atestados').update(dados).eq('id', at.id);
    if (error) return erro('Não foi possível salvar: ' + error.message);
    depois();
  };
  ligarApagar('atestados', at.id, depois, erro);
}
function formSaida(sd, depois) {
  const novo = !sd;
  const agora = new Date().toTimeString().slice(0, 5);
  sd = sd || { data: hojeLocal(), hora_saida: agora, autorizado_por: '', motivo: '', deslocamento: '', retorna: false, hora_retorno: '', observacao: '' };
  const erro = modalForm(novo ? 'Autorização de saída da escola' : 'Editar autorização de saída', 'ao salvar, vira ocorrência na ficha do aluno', `
    ${camposTurmaAluno(sd.turma_id, sd.aluno_id)}
    <div><label for="sd-data">Data</label><input type="date" id="sd-data" value="${esc(sd.data)}"></div>
    <div><label for="sd-hora">Horário de saída</label><input type="time" id="sd-hora" value="${esc(hhmm(sd.hora_saida))}"></div>
    <div class="largo"><label for="sd-autorizado">Autorizado por</label><input type="text" id="sd-autorizado" value="${esc(sd.autorizado_por)}" placeholder="Nome do responsável ou de quem autorizou"></div>
    <div class="largo"><label for="sd-motivo">Motivo da saída</label><input type="text" id="sd-motivo" value="${esc(sd.motivo)}" placeholder="Ex.: consulta médica"></div>
    <div class="largo"><label for="sd-desloc">Meio de deslocamento / acompanhante</label><input type="text" id="sd-desloc" list="sd-meios" value="${esc(sd.deslocamento)}" placeholder="Ex.: Uber, a pé, acompanhado pela mãe">
      <datalist id="sd-meios">${MEIOS_SAIDA.map(m => `<option value="${esc(m)}">`).join('')}</datalist></div>
    <label class="marcar largo"><input type="checkbox" id="sd-retorna" ${sd.retorna ? 'checked' : ''}> O aluno vai retornar à escola no mesmo dia</label>
    <div id="sd-caixa-retorno" class="${sd.retorna ? '' : 'escondido'}"><label for="sd-hora-ret">Horário de retorno</label><input type="time" id="sd-hora-ret" value="${esc(hhmm(sd.hora_retorno))}"></div>
    <div id="sd-caixa-obs" class="largo ${sd.retorna ? '' : 'escondido'}"><label for="sd-obs">Observação</label><input type="text" id="sd-obs" value="${esc(sd.observacao || '')}" placeholder="Ex.: pediu liberação na véspera de feriado"></div>`, novo);
  ligarTurmaAluno();
  $('#sd-retorna').onchange = () => ['#sd-caixa-retorno', '#sd-caixa-obs'].forEach(c => $(c).classList.toggle('escondido', !$('#sd-retorna').checked));
  $('#form-salvar').onclick = async () => {
    const aluno = Number($('#ta-aluno').value), turma = Number($('#ta-turma').value) || null, retorna = $('#sd-retorna').checked;
    const v = (k) => $(k).value.trim();
    if (!aluno) return erro('Escolha a turma e o aluno.');
    if (!v('#sd-data') || !v('#sd-hora')) return erro('Informe a data e o horário de saída.');
    if (!v('#sd-autorizado')) return erro('Informe quem autorizou a saída.');
    if (!v('#sd-motivo')) return erro('Informe o motivo da saída.');
    if (!v('#sd-desloc')) return erro('Informe o meio de deslocamento ou o acompanhante.');
    if (retorna && !v('#sd-hora-ret')) return erro('Informe o horário de retorno.');
    if (retorna && v('#sd-hora-ret') <= v('#sd-hora')) return erro('O horário de retorno precisa ser depois do horário de saída.');
    $('#form-salvar').disabled = true;
    const dados = { aluno_id: aluno, turma_id: turma, data: v('#sd-data'), hora_saida: v('#sd-hora'), autorizado_por: v('#sd-autorizado'), motivo: v('#sd-motivo'),
      deslocamento: v('#sd-desloc'), retorna, hora_retorno: retorna ? v('#sd-hora-ret') : null, observacao: retorna ? (v('#sd-obs') || null) : null };
    const { error } = novo ? await db.from('saidas').insert(dados) : await db.from('saidas').update(dados).eq('id', sd.id);
    if (error) return erro('Não foi possível salvar: ' + error.message);
    if (novo) { estado.contOc.set(aluno, (estado.contOc.get(aluno) || 0) + 1); }
    depois();
    if (novo) setTimeout(() => alert(`Saída registrada. A ocorrência "Autorização de Saída da Escola" foi criada na ficha de ${estado.alunos.get(aluno)?.nome || 'aluno'}.`), 50);
  };
  ligarApagar('saidas', sd.id, depois, erro);
}

// ---------- frequência na ficha e no boletim ----------
function htmlFrequenciaAluno(r, faltas) {
  if (!r || !Number(r.dias)) return '<p class="subtitulo" style="margin:0">Ainda não há chamadas lançadas para este aluno.</p>';
  const p = pctPresenca(r), alerta = emAlerta(r);
  return `<div class="fr-resumo"><span class="fr-pct grande ${alerta ? 'ruim' : 'bom'}">${fmt(p)}%</span>
      <div>de presença em ${ANO_LETIVO} · <strong>${r.faltas}</strong> ${Number(r.faltas) === 1 ? 'falta' : 'faltas'} em ${r.dias} ${Number(r.dias) === 1 ? 'dia' : 'dias'} de aula
      ${Number(r.abonadas) ? `<br><span class="fr-tag-atestado">${r.abonadas} ${Number(r.abonadas) === 1 ? 'falta abonada' : 'faltas abonadas'} por atestado</span>` : ''}
      ${Number(r.faltas_seguidas) >= FREQ_SEGUIDAS ? `<br><strong class="fr-txt-ruim">${r.faltas_seguidas} faltas seguidas</strong>` : ''}
      ${alerta && p < FREQ_MINIMA && Number(r.dias) >= FREQ_DIAS_MIN ? `<br><strong class="fr-txt-ruim">Abaixo de ${FREQ_MINIMA}%</strong>` : ''}</div></div>
    ${faltas?.length ? `<p class="subtitulo" style="margin:8px 0 0">Faltou em: ${faltas.map(d => esc(data(d).slice(0, 5))).join(', ')}</p>` : ''}`;
}
const textoFrequenciaImpressa = (r) => !r || !Number(r.dias) ? '' :
  `Frequência em ${ANO_LETIVO}: ${fmt(pctPresenca(r))}% de presença (${r.faltas} ${Number(r.faltas) === 1 ? 'falta' : 'faltas'} em ${r.dias} ${Number(r.dias) === 1 ? 'dia' : 'dias'} de aula)`;

// Para cada matéria (Física, Matemática, Química, Linguagens e Inglês): média das notas finais

const MATERIAS_BOLSA = ['Física', 'Matemática', 'Química', 'Linguagens', 'Inglês'];
const CURTO_BOLSA = { 'Física': 'Fís', 'Matemática': 'Mat', 'Química': 'Quí', 'Linguagens': 'Ling', 'Inglês': 'Ing' };
const FAIXAS_BOLSA = [
  { id: 'azul', nome: 'Azul', regra: '8 a 10', cor: '#1f63c4', fundo: '#e6effc' },
  { id: 'amarelo', nome: 'Amarela', regra: '6,1 a 7,9', cor: '#9a6a00', fundo: '#fdf1d2' },
  { id: 'vermelho', nome: 'Vermelha', regra: '0 a 6', cor: '#c2271b', fundo: '#fde4e2' },
];
const faixaBolsa = (n) => n == null ? null : n >= 8 ? FAIXAS_BOLSA[0] : n > 6 ? FAIXAS_BOLSA[1] : FAIXAS_BOLSA[2];
const media2 = (xs) => xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length * 100) / 100 : null;

async function paginaBolsas() {
  if (!permite('bolsas')) return irPara('turmas');
  $('#conteudo').innerHTML = '<div class="carregando">Carregando bolsas…</div>';
  const { data: ciclos, error } = await db.from('ciclos').select('*').eq('ano_letivo', ANO_LETIVO).order('criado_em');
  if (error) return erroNaTela(error);
  const B = estado.bolsas || (estado.bolsas = { ciclos: ciclos.slice(-2).map(c => c.id), turma: 'todas' });
  B.ciclos = B.ciclos.filter(id => ciclos.some(c => c.id === id));
  $('#conteudo').innerHTML = `
    <div class="barra"><h1>Bolsas</h1><div class="espaco"></div>
      <button class="botao" id="bo-imprimir">Imprimir classificação</button></div>
    <p class="subtitulo">Em cada matéria (Física, Matemática, Química, Linguagens e Inglês) o sistema tira a média das notas finais de NM1, NM2 e NM3
      dos ciclos marcados. A <strong>nota única</strong> é a média dessas cinco médias. Os alunos são classificados por turma.</p>
    <div class="fr-bloco">
      <div class="bo-filtros">
        <div><strong>Ciclos</strong> <span class="subtitulo" style="margin:0">(um ou dois ciclos)</span>
          <div class="bo-ciclos">${ciclos.length ? ciclos.map(c => `<label><input type="checkbox" value="${c.id}" ${B.ciclos.includes(c.id) ? 'checked' : ''}> ${esc(c.nome)}</label>`).join('')
            : '<span class="subtitulo" style="margin:0">Nenhum ciclo criado em ' + ANO_LETIVO + '.</span>'}</div></div>
        <div><strong>Turma</strong><br><select id="bo-turma"><option value="todas">Todas as turmas</option>
          ${TURMAS_NOTAS.map(t => `<option value="${t}" ${String(t) === String(B.turma) ? 'selected' : ''}>${esc(nomeTurma(t))}</option>`).join('')}</select></div>
        <div class="bo-legenda">${FAIXAS_BOLSA.map(f => `<span class="bo-pill" style="--c:${f.cor};--f:${f.fundo}">${f.nome} · ${f.regra}</span>`).join('')}</div>
      </div>
    </div>
    <div id="bo-resultado"><div class="carregando">Calculando…</div></div>`;
  let ultimo = null;
  const calcular = async () => {
    B.ciclos = [...document.querySelectorAll('.bo-ciclos input:checked')].map(i => Number(i.value));
    B.turma = $('#bo-turma').value;
    if (!B.ciclos.length) { ultimo = null; $('#bo-resultado').innerHTML = '<p class="subtitulo">Marque pelo menos um ciclo.</p>'; return; }
    $('#bo-resultado').innerHTML = '<div class="carregando">Calculando…</div>';
    const { data: notas, error: e2 } = await db.from('historico_notas').select('aluno_id, ciclo_id, nm, materia, nota_multiplicada').in('ciclo_id', B.ciclos);
    if (e2) { $('#bo-resultado').innerHTML = `<div class="aviso erro">${esc(e2.message)}</div>`; return; }
    ultimo = montarBolsas(notas || [], B, ciclos);
    $('#bo-resultado').innerHTML = ultimo.html;
    $('#bo-resultado').querySelectorAll('[data-aluno]').forEach(b => b.onclick = () => abrirFicha(Number(b.dataset.aluno)));
  };
  document.querySelectorAll('.bo-ciclos input').forEach(i => i.onchange = calcular);
  $('#bo-turma').onchange = calcular;
  $('#bo-imprimir').onclick = () => {
    if (!ultimo) return;
    $('#impressao').innerHTML = ultimo.imp;
    setTimeout(() => window.print(), 100);
  };
  await calcular();
}

function montarBolsas(notas, B, ciclos) {
  const esperadas = B.ciclos.length * 3;   // NM1, NM2 e NM3 de cada ciclo
  const porAluno = new Map();
  for (const n of notas) {
    if (n.nota_multiplicada == null || !MATERIAS_BOLSA.includes(n.materia)) continue;
    const m = porAluno.get(n.aluno_id) || porAluno.set(n.aluno_id, {}).get(n.aluno_id);
    (m[n.materia] = m[n.materia] || []).push(Number(n.nota_multiplicada));
  }
  const turmas = B.turma === 'todas' ? TURMAS_NOTAS : [Number(B.turma)];
  const nomesCiclos = ciclos.filter(c => B.ciclos.includes(c.id)).map(c => c.nome).join(' + ');
  const blocos = turmas.map(tid => {
    const linhas = estado.matriculas.filter(m => m.turma_id === tid && m.situacao === 'ativo').map(m => {
      const a = estado.alunos.get(m.aluno_id), notasAl = porAluno.get(m.aluno_id) || {};
      const medias = Object.fromEntries(MATERIAS_BOLSA.map(mt => [mt, media2(notasAl[mt] || [])]));
      const faltam = MATERIAS_BOLSA.reduce((s, mt) => s + Math.max(0, esperadas - (notasAl[mt] || []).length), 0);
      const presentes = MATERIAS_BOLSA.map(mt => medias[mt]).filter(v => v != null);
      const unica = media2(presentes);
      return { id: m.aluno_id, nome: a?.nome || '', medias, unica, faixa: faixaBolsa(unica), faltam };
    }).sort((x, y) => (y.unica ?? -1) - (x.unica ?? -1) || x.nome.localeCompare(y.nome, 'pt-BR'));
    const conta = Object.fromEntries(FAIXAS_BOLSA.map(f => [f.id, linhas.filter(l => l.faixa?.id === f.id).length]));
    return { tid, linhas, conta };
  });
  const pill = (n, f) => n == null ? '<span class="vazio">—</span>' : `<span class="bo-pill forte" style="--c:${f.cor};--f:${f.fundo}">${fmt(n)}</span>`;
  const html = blocos.map(b => `
    <div class="fr-bloco">
      <div class="barra" style="margin:0 0 10px"><h2>${esc(nomeTurma(b.tid))}</h2><div class="espaco"></div>
        ${FAIXAS_BOLSA.map(f => `<span class="bo-pill" style="--c:${f.cor};--f:${f.fundo}">${f.nome}: <strong>${b.conta[f.id]}</strong></span>`).join(' ')}</div>
      ${!b.linhas.length ? '<p class="subtitulo">Nenhum aluno ativo nesta turma.</p>' : `<div class="rolavel"><table class="bo-tabela">
        <thead><tr><th class="num">#</th><th>Aluno</th>${MATERIAS_BOLSA.map(m => `<th class="num" title="${m}">${CURTO_BOLSA[m]}</th>`).join('')}<th class="num">Nota única</th><th>Faixa</th></tr></thead>
        <tbody>${b.linhas.map((l, i) => `<tr style="--c:${l.faixa?.cor || '#c9d1cc'}">
          <td class="num">${l.unica == null ? '' : i + 1}</td>
          <td><button class="link" data-aluno="${l.id}">${esc(l.nome)}</button>${l.faltam ? `<small class="bo-falta" title="Notas que ainda não foram lançadas nos ciclos marcados">faltam ${l.faltam} ${l.faltam === 1 ? 'nota' : 'notas'}</small>` : ''}</td>
          ${MATERIAS_BOLSA.map(m => `<td class="num">${fmt(l.medias[m])}</td>`).join('')}
          <td class="num">${l.faixa ? pill(l.unica, l.faixa) : '—'}</td>
          <td>${l.faixa ? `<span class="bo-faixa" style="--c:${l.faixa.cor}">${l.faixa.nome}</span>` : '<span class="vazio">sem notas</span>'}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`).join('') + `<p class="subtitulo">Ciclos: ${esc(nomesCiclos)} · notas finais (com multiplicador) · "faltam notas" = NM1, NM2 ou NM3 ainda não lançada; a média usa só as notas que existem.</p>`;
  const imp = blocos.map(b => `<div class="imp-paisagem bo-imp">
    <div class="imp-topo"><h1>BOLSAS · ${esc(nomeTurma(b.tid).toUpperCase())}</h1><span>${esc(nomesCiclos)} · impresso em ${new Date().toLocaleDateString('pt-BR')}</span></div>
    <p class="imp-sub">${FAIXAS_BOLSA.map(f => `${f.nome} (${f.regra}): <strong>${b.conta[f.id]}</strong>`).join(' · ')}</p>
    <table class="imp-tabela"><thead><tr><th class="n">#</th><th>Aluno</th>${MATERIAS_BOLSA.map(m => `<th class="n">${m}</th>`).join('')}<th class="n">Nota única</th><th>Faixa</th></tr></thead>
      <tbody>${b.linhas.map((l, i) => `<tr><td class="n">${l.unica == null ? '' : i + 1}</td><td>${esc(l.nome)}${l.faltam ? ` <small>(faltam ${l.faltam})</small>` : ''}</td>
        ${MATERIAS_BOLSA.map(m => `<td class="n">${fmt(l.medias[m])}</td>`).join('')}
        <td class="n bo-imp-nota" style="background:${l.faixa?.fundo || '#fff'};color:${l.faixa?.cor || '#000'}"><strong>${fmt(l.unica)}</strong></td>
        <td style="color:${l.faixa?.cor || '#000'}"><strong>${l.faixa?.nome || 'sem notas'}</strong></td></tr>`).join('')}</tbody></table>
    <p class="imp-rodape">Média de NM1, NM2 e NM3 (notas finais) em cada matéria; nota única = média das cinco matérias. Azul 8 a 10 · Amarela 6,1 a 7,9 · Vermelha 0 a 6.</p></div>`).join('');
  return { html, imp };
}

function carregarScript(url) {
  return new Promise((ok, falha) => {
    if (document.querySelector(`script[src="${url}"]`)) return ok();
    const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = falha; document.head.appendChild(s);
  });
}

    const arq = e.target.files[0]; if (!arq) return;

      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      const pega = (l, ...nomes) => { const k = Object.keys(l).find(k => nomes.includes(semAcento(k).replace(/[^A-Z]/g, ''))); return k ? String(l[k]).trim() : ''; };

      if (r1.error || r2.error) return aviso((r1.error || r2.error).message, true);
      await paginaProfessores();
      aviso(`${lista.length} professores importados.`);
    } catch (err) { aviso('Não consegui ler o arquivo: ' + err.message, true); }
  };
}

// =====================================================================
// COMPARATIVOS E NOTAS DE CORTE
// Cada vestibular tem uma nota de corte por matéria. Comparamos com a nota
// final (com multiplicador) de NM1 e NM2.
// =====================================================================
// 1ª fase = Provão (NM2); 2ª fase = NM1 (ITA) e NM3 (IME). Sempre Matemática, Física, Química e Inglês.
const MATERIAS_CORTE = ['Matemática', 'Física', 'Química', 'Inglês'];
const FASES = { 1: { nome: '1ª fase', prova: 'Provão (NM2)', nms: ['NM2'] }, 2: { nome: '2ª fase', prova: 'NM1 e NM3', nms: ['NM1', 'NM3'] } };
const faseDoNm = (nm) => nm === 'NM2' ? 1 : 2;
async function carregarCortes(forcar) {
  if (estado.cortes && !forcar) return estado.cortes;
  const [v, c] = await Promise.all([
    db.from('vestibulares').select('*').order('ordem').order('nome'),
    db.from('notas_corte').select('*'),
  ]);
  estado.cortes = { vestibulares: v.data || [], nota: new Map((c.data || []).map(x => [x.vestibular_id + '|' + x.fase + '|' + x.materia, Number(x.nota)])) };
  if (estado.vestibular && !estado.cortes.vestibulares.some(x => x.id === estado.vestibular)) estado.vestibular = null;
  if (!estado.vestibular && estado.cortes.vestibulares.length) estado.vestibular = estado.cortes.vestibulares[0].id;
  return estado.cortes;
}
const corteDe = (vestId, fase, materia) => estado.cortes?.nota.get(vestId + '|' + fase + '|' + materia) ?? null;
const nomeVestibular = (id) => estado.cortes?.vestibulares.find(v => v.id === id)?.nome || '';
function seletorVestibular(idCampo) {
  const vs = estado.cortes?.vestibulares || [];
  if (!vs.length) return '<span class="subtitulo" style="margin:0">Nenhum vestibular cadastrado (página Comparativos).</span>';
  return `<label for="${idCampo}" style="margin:0">Comparar com</label>
    <select id="${idCampo}" style="max-width:200px">${vs.map(v => `<option value="${v.id}" ${v.id === estado.vestibular ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select>`;
}
// classe da célula: verde se alcançou o corte, vermelho se ficou abaixo, nada se não há corte ou nota
function classeCorte(nota, corte) {
  if (nota == null || corte == null) return '';
  return Number(nota) >= corte ? 'ok-corte' : 'sob-corte';
}
const legendaCorte = (vest) => `<div class="legenda-corte">
  <span><i class="ok-corte"></i> alcançou o corte${vest ? ' do ' + esc(nomeVestibular(vest)) : ''}</span>
  <span><i class="sob-corte"></i> abaixo do corte</span><span>— sem nota ou sem corte cadastrado</span></div>`;

// Gráfico pequeno de uma matéria: NM1 e NM2 ciclo a ciclo, com a linha tracejada do corte
function graficoMateria(materia, ciclos, corte, nms) {
  const L = 270, A = 160, esq = 40, dir = 26, topo = 20, base = 32;
  const n = ciclos.length, larg = L - esq - dir, alt = A - topo - base;
  const x = (i) => esq + (n === 1 ? larg / 2 : (larg * i) / (n - 1));
  const y = (v) => topo + alt - (alt * Math.max(0, Math.min(10, v))) / 10;
  const cores = { NM1: '#1f6f43', NM2: '#2f6fb5', NM3: '#8e44ad' };
  const valor = (c, nm) => { const v = c.linhas.find(l => l.materia === materia)?.nm[nm]?.nota_multiplicada; return v == null ? null : Number(v); };
  const linhas = nms.map(nm => {
    const outro = nms.find(x => x !== nm);
    // o número fica acima do ponto mais alto e abaixo do mais baixo, para não encavalar
    const pts = ciclos.map((c, i) => { const v = valor(c, nm); if (v == null) return null; const o = outro ? valor(c, outro) : null;
      const embaixo = o != null && (v < o || (v === o && nm === nms[1])); return [x(i), y(v), v, embaixo]; });
    const seg = []; let atual = [];
    pts.forEach(p => { if (p) atual.push(p); else if (atual.length) { seg.push(atual); atual = []; } });
    if (atual.length) seg.push(atual);
    return seg.map(sg => `<polyline fill="none" stroke="${cores[nm]}" stroke-width="2" points="${sg.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`).join('')
      + pts.filter(Boolean).map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${corte != null && p[2] < corte ? '#c0392b' : cores[nm]}"/>`
        + `<text x="${p[0].toFixed(1)}" y="${(p[3] ? p[1] + 14 : p[1] - 7).toFixed(1)}" font-size="9" text-anchor="middle" fill="${cores[nm]}">${fmt(p[2])}</text>`).join('');
  }).join('');
  const grade = [0, 5, 10].map(v => `<line x1="${esq - 14}" x2="${L - 2}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7e4"/><text x="${esq - 18}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="#7a857e">${v}</text>`).join('');
  const linhaCorte = corte == null ? '' : `<line x1="${esq - 14}" x2="${L - 2}" y1="${y(corte)}" y2="${y(corte)}" stroke="#c0392b" stroke-dasharray="5 4" stroke-width="1.4"/>
    <text x="${L - 2}" y="${y(corte) - 3}" font-size="9" text-anchor="end" fill="#c0392b">corte ${fmt(corte)}</text>`;
  const rotulos = ciclos.map((c, i) => `<text x="${x(i).toFixed(1)}" y="${A - base + 14}" font-size="9" text-anchor="middle" fill="#5b6660">${esc(c.nome.length > 12 ? c.nome.slice(0, 11) + '…' : c.nome)}</text>`).join('');
  return `<div class="grafico"><h4>${esc(materia)}</h4><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Evolução em ${esc(materia)}">${grade}${linhaCorte}${linhas}${rotulos}
     <g font-size="9">${nms.map((nm, k) => `<rect x="${esq - 14 + k * 44}" y="${A - 11}" width="10" height="3" fill="${cores[nm]}"/><text x="${esq + k * 44}" y="${A - 8}" fill="#5b6660">${nm}</text>`).join('')}</g></svg></div>`;
}
// Evolução do aluno no Boletim: 1ª fase (Provão) e 2ª fase (NM1 e NM3), um gráfico por matéria
function htmlEvolucao(ciclos, vest, impressao) {
  const blocos = [1, 2].map(fase => {
    const nms = FASES[fase].nms;
    const materias = MATERIAS_CORTE.filter(m => ciclos.some(c => c.linhas.some(l => l.materia === m && nms.some(nm => l.nm[nm]?.nota_multiplicada != null))));
    if (!materias.length) return '';
    return `<h4 style="margin:${impressao ? '6px 0 4px' : '14px 0 8px'}">Comparativo da ${FASES[fase].nome} · ${FASES[fase].prova}</h4>
      <div class="${impressao ? 'imp-graficos' : 'graficos'}">${materias.map(m => graficoMateria(m, ciclos, vest ? corteDe(vest, fase, m) : null, nms)).join('')}</div>`;
  }).join('');
  if (!blocos) return '<p class="subtitulo" style="margin:0">Ainda não há notas de Provão, NM1 ou NM3 em Matemática, Física, Química ou Inglês.</p>';
  return `${impressao ? '' : legendaCorte(vest)}${blocos}

}

// =====================================================================
// DESEMPENHO: visão geral (turmas, matérias, faixas de nota, provas),
// destaques, quem precisa de auxílio e o desempenho individual.
// Média = nota final (com multiplicador) das provas escolhidas (NM1, NM2, NM3).
// =====================================================================
const CORES_TURMA = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100']; // uma cor fixa por turma, na ordem de TURMAS_NOTAS
const COR_REF = '#8a918d'; // cinza da referência (média da turma)
const corTurma = (t) => CORES_TURMA[TURMAS_NOTAS.indexOf(t)] || COR_REF;
const media = (vs) => { const v = vs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const r2 = (n) => n == null ? null : Math.round(n * 100) / 100;

async function buscarTudo(fazer) { // passa de 1000 em 1000 (limite do Supabase)
  const todos = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await fazer().range(de, de + 999);
    if (error) throw error;
    todos.push(...(data || []));
    if (!data || data.length < 1000) return todos;
  }
}
async function carregarDesempenho(forcar) {
  if (estado.desemp && !forcar && Date.now() - estado.desemp.quando < 120000) return estado.desemp;
  const [ciclos, linhas, questoes] = await Promise.all([
    db.from('ciclos').select('*').eq('ano_letivo', ANO_LETIVO).order('criado_em').then(r => { if (r.error) throw r.error; return r.data || []; }),
    buscarTudo(() => db.from('historico_notas').select('aluno_id, planilha_id, ciclo_id, nm, materia, turma_id, nota_multiplicada')
      .eq('ano_letivo', ANO_LETIVO).order('planilha_id').order('aluno_id')),
    buscarTudo(() => db.from('questoes').select('planilha_id, professor').order('id')),
    carregarCortes(),
  ]);
  const profs = new Map();
  questoes.forEach(q => { const n = q.professor.replace(/ \(PDF\)$/, ''); if (/^(Documento|Provão|Qualitativa|2ª chamada|Redação)/.test(n)) return;
    if (!profs.has(q.planilha_id)) profs.set(q.planilha_id, new Set()); profs.get(q.planilha_id).add(n); });
  estado.desemp = { quando: Date.now(), ciclos, linhas: linhas.filter(l => l.nota_multiplicada != null).map(l => ({ ...l, nota: Number(l.nota_multiplicada) })), profs };
  return estado.desemp;
}

// Resumo de cada aluno num ciclo: média por matéria, média geral, turma e comparação com o corte
function resumoCiclo(d, cicloId, nms, vest) {
  const porAluno = new Map();
  d.linhas.forEach(l => {
    if (l.ciclo_id !== cicloId || !nms.includes(l.nm)) return;
    if (!porAluno.has(l.aluno_id)) porAluno.set(l.aluno_id, []);
    porAluno.get(l.aluno_id).push(l);
  });
  const res = new Map();
  porAluno.forEach((ls, id) => {
    const porMateria = {};
    MATERIAS.forEach(m => { const v = media(ls.filter(l => l.materia === m).map(l => l.nota)); if (v != null) porMateria[m] = v; });
    const contagem = {}; ls.forEach(l => contagem[l.turma_id] = (contagem[l.turma_id] || 0) + 1);
    const turma = Number(Object.entries(contagem).sort((a, b) => b[1] - a[1])[0][0]);
    const abaixo = new Set(); let comparados = 0;
    if (vest) ls.forEach(l => { if (!MATERIAS_CORTE.includes(l.materia)) return; const c = corteDe(vest, faseDoNm(l.nm), l.materia);
      if (c == null) return; comparados++; if (l.nota < c) abaixo.add(l.materia); });
    res.set(id, { id, turma, porMateria, media: media(Object.values(porMateria)), abaixo, comparados });
  });
  // posição dentro da turma
  TURMAS_NOTAS.forEach(t => {
    const lista = [...res.values()].filter(r => r.turma === t && r.media != null).sort((a, b) => b.media - a.media);
    lista.forEach((r, i) => { r.pos = i + 1; r.total = lista.length; });
  });
  return res;
}
const nomeAluno = (id) => estado.alunos.get(id)?.nome || 'Aluno ' + id;

// Destaques e auxílio, com os motivos de cada aluno
function classificar(atual, anterior) {
  const destaques = [], auxilio = [];
  const deltas = new Map();
  if (anterior) atual.forEach((r, id) => { const a = anterior.get(id); if (r.media != null && a?.media != null) deltas.set(id, r.media - a.media); });
  const topEvolucao = new Set();
  TURMAS_NOTAS.forEach(t => [...deltas].filter(([id, dl]) => atual.get(id).turma === t && dl > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).forEach(([id]) => topEvolucao.add(id)));
  atual.forEach(r => {
    if (r.media == null) return;
    const bons = [], ruins = [];
    if (r.pos <= 5) bons.push(`${r.pos}º da turma`);
    if (r.comparados && !r.abaixo.size) bons.push('Alcançou o corte');
    if (topEvolucao.has(r.id)) bons.push(`Subiu ${fmt(r2(deltas.get(r.id)))}`);
    const fortes = Object.entries(r.porMateria).filter(([, v]) => v >= 8);
    if (fortes.length > 2) bons.push(`8 ou mais em ${fortes.length} matérias`);
    else fortes.forEach(([m, v]) => bons.push(`${m} ${fmt(r2(v))}`));
    if (r.media < 5) ruins.push(`Média ${fmt(r2(r.media))}`);
    const fracas = Object.entries(r.porMateria).filter(([, v]) => v < 5);
    if (fracas.length > 2) ruins.push(`Abaixo de 5 em ${fracas.length} matérias`);
    else fracas.forEach(([m, v]) => ruins.push(`${m} ${fmt(r2(v))}`));
    if (deltas.has(r.id) && deltas.get(r.id) <= -1) ruins.push(`Caiu ${fmt(r2(-deltas.get(r.id)))}`);
    if (r.abaixo.size >= 2) ruins.push(`Abaixo do corte em ${r.abaixo.size}`);
    if (r.total >= 10 && r.pos > r.total - 5) ruins.push(`${r.pos}º de ${r.total}`);
    if (bons.length) destaques.push({ ...r, motivos: bons, delta: deltas.get(r.id) });
    if (ruins.length) auxilio.push({ ...r, motivos: ruins, delta: deltas.get(r.id) });
  });
  destaques.sort((a, b) => b.motivos.length - a.motivos.length || b.media - a.media);
  auxilio.sort((a, b) => b.motivos.length - a.motivos.length || a.media - b.media);
  return { destaques, auxilio, deltas };
}

// ---------- gráficos (SVG desenhado à mão, com dica ao passar o mouse) ----------
function graficoLinhas({ series, rotulos, alt = 230, larg = 620, legenda = true }) {
  const esq = 34, dir = 96, topo = 14, base = 30, W = larg - esq - dir, H = alt - topo - base, n = rotulos.length;
  const x = (i) => esq + (n === 1 ? W / 2 : (W * i) / (n - 1));
  const y = (v) => topo + H - (H * v) / 10;
  const grade = [0, 2.5, 5, 7.5, 10].map(v => `<line x1="${esq}" x2="${esq + W}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe8"/>
    <text x="${esq - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5f6b64">${fmt(v)}</text>`).join('');
  const eixo = rotulos.map((r, i) => `<text x="${x(i)}" y="${alt - 10}" font-size="11" text-anchor="middle" fill="#5f6b64">${esc(r)}</text>`).join('');
  const linhas = series.map(s => {
    const pts = s.valores.map((v, i) => v == null ? null : [x(i), y(v), v, i]);
    let d = '', ini = true;
    pts.forEach(p => { if (!p) { ini = true; return; } d += (ini ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); ini = false; });
    const ult = pts.filter(Boolean).at(-1);
    return `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" ${s.tracejado ? 'stroke-dasharray="5 4"' : ''}/>
      ${pts.filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${s.cor}" stroke="#fff" stroke-width="2"><title>${esc(s.nome)} · ${esc(rotulos[p[3]])}: ${fmt(r2(p[2]))}</title></circle>`).join('')}
      ${ult ? `<text x="${ult[0] + 9}" y="${ult[1] + 4}" font-size="11" fill="#1d2420">${esc(s.nome)} ${fmt(r2(ult[2]))}</text>` : ''}`;
  }).join('');
  const leg = legenda ? `<div class="legenda-graf">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '';
  return `${leg}<svg viewBox="0 0 ${larg} ${alt}" class="graf" role="img">${grade}${eixo}${linhas}</svg>`;
}
function graficoBarras({ categorias, series, alt = 230, larg = 620, maxY = 10, rotular = [0], formato = fmt, legenda = true, eixoY = true }) {
  const esq = eixoY ? 34 : 8, dir = 8, topo = 18, base = 30, W = larg - esq - dir, H = alt - topo - base;
  const nG = categorias.length, nS = series.length, larG = W / nG, larB = Math.min(34, (larG * 0.7) / nS);
  const y = (v) => topo + H - (H * Math.min(v, maxY)) / maxY;
  const passos = maxY === 10 ? [0, 2.5, 5, 7.5, 10] : [0, maxY / 2, maxY].map(Math.round);
  const grade = passos.map(v => `<line x1="${esq}" x2="${esq + W}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe8"/>${eixoY ? `<text x="${esq - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5f6b64">${fmt(v)}</text>` : ''}`).join('');
  const barras = categorias.map((c, g) => {
    const x0 = esq + g * larG + (larG - nS * larB - (nS - 1) * 2) / 2;
    return series.map((s, k) => {
      const v = s.valores[g]; if (v == null) return '';
      const bx = x0 + k * (larB + 2), by = y(v), bh = topo + H - by, rr = Math.min(4, bh, larB / 2);
      const d = `M${bx},${topo + H}V${by + rr}Q${bx},${by} ${bx + rr},${by}H${bx + larB - rr}Q${bx + larB},${by} ${bx + larB},${by + rr}V${topo + H}Z`;
      return `<path d="${d}" fill="${s.cor}"><title>${esc(s.nome)} · ${esc(c)}: ${formato(v)}</title></path>
        ${rotular.includes(k) ? `<text x="${bx + larB / 2}" y="${by - 5}" font-size="11" text-anchor="middle" fill="#1d2420">${formato(v)}</text>` : ''}`;
    }).join('') + `<text x="${esq + g * larG + larG / 2}" y="${alt - 10}" font-size="11" text-anchor="middle" fill="#5f6b64">${esc(c)}</text>`;
  }).join('');
  const leg = legenda && nS > 1 ? `<div class="legenda-graf">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '';
  return `${leg}<svg viewBox="0 0 ${larg} ${alt}" class="graf" role="img">${grade}<line x1="${esq}" x2="${esq + W}" y1="${topo + H}" y2="${topo + H}" stroke="#b9c2bc"/>${barras}</svg>`;
}
// cor do mapa de calor: verde claro (nota baixa) até verde escuro (nota alta)
function corCalor(v) {

  return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * t)).join(',')})`;
}

        <span>${esc(ciclo?.nome || '')} · ${nms.join(' + ')} · impresso em ${new Date().toLocaleDateString('pt-BR')}</span></div>
        <table class="imp-tabela"><thead><tr><th class="n">Nº</th><th>Aluno</th>${mats.map(m => `<th class="n">${m}</th>`).join('')}<th class="n">Média</th></tr></thead>
        <tbody>${linhas.map((l, i) => `<tr><td class="n">${i + 1}</td><td>${esc(l.nome)}</td>${mats.map(m => { const v = l.r?.porMateria[m]; return `<td class="n${v != null && r2(v) < 5 ? ' rel-baixa' : ''}">${v == null ? '—' : fmt(r2(v))}</td>`; }).join('')}
          <td class="n"><strong>${l.r?.media == null ? '—' : fmt(r2(l.r.media))}</strong></td></tr>`).join('')}
          <tr><td></td><td><strong>Média da turma</strong></td>${mats.map(m => `<td class="n"><strong>${mediaMat[m] == null ? '—' : fmt(r2(mediaMat[m]))}</strong></td>`).join('')}<td class="n"><strong>${mediaTurma == null ? '—' : fmt(r2(mediaTurma))}</strong></td></tr></tbody></table>
        <p class="imp-rodape">Nota final (com multiplicador) de ${nms.join(' + ')}; com mais de uma NM, a nota da matéria é a média delas. Em vermelho: abaixo de 5.</p></div>`;
      setTimeout(() => window.print(), 100);
    };
  }

  $('#de-ciclo').onchange = () => { f.ciclo = Number($('#de-ciclo').value); desenhar(); };
  $('#de-turma').onchange = () => { f.turma = Number($('#de-turma').value); desenhar(); };
  $('#de-provas').onchange = () => { f.provas = $('#de-provas').value; desenhar(); };
  if ($('#de-vest')) $('#de-vest').onchange = () => { estado.vestibular = vest(); desenhar(); };
  $('#de-busca').onchange = () => { const a = [...estado.alunos.values()].find(x => x.nome === $('#de-busca').value); if (a) { $('#de-busca').value = ''; mostrarIndividual(a.id); } };
  $('#de-atualizar').onclick = async () => { await carregarDesempenho(true); paginaDesempenho(); };
  $('#de-imprimir').onclick = () => {
    const { dest, aux } = estado.desempAtual, ciclo = ciclosCom.find(c => c.id === f.ciclo);
    const tab = (lista) => lista.length ? `<table class="imp-tabela"><thead><tr><th>Aluno</th><th>Turma</th><th class="n">Média</th><th>Por quê</th></tr></thead>
      <tbody>${lista.map(r => `<tr><td>${esc(nomeAluno(r.id))}</td><td>${esc(nomeTurma(r.turma))}</td><td class="n">${fmt(r2(r.media))}</td><td>${esc(r.motivos.join(' · '))}</td></tr>`).join('')}</tbody></table>` : '<p>Ninguém.</p>';
    $('#impressao').innerHTML = `<div class="imp-boletim"><div class="imp-topo"><h1>DESEMPENHO · ${esc((ciclo?.nome || '').toUpperCase())}</h1>
      <span>${f.turma ? esc(nomeTurma(f.turma)) : 'Todas as turmas'} · ${f.provas === 'todas' ? 'NM1 + NM2 + NM3' : f.provas}${vest() ? ' · corte ' + esc(nomeVestibular(vest())) : ''} · impresso em ${new Date().toLocaleDateString('pt-BR')}</span></div>
      <h2>Destaques (${dest.length})</h2>${tab(dest)}<h2>Precisam de auxílio (${aux.length})</h2>${tab(aux)}</div>`;
    setTimeout(() => window.print(), 100);
  };
  desenhar();
  if (alunoInicial) mostrarIndividual(Number(alunoInicial));
}

// =====================================================================
// INÍCIO DA PÁGINA
// =====================================================================
const linkLancamento = location.hash.match(/^#lancar-([0-9a-f-]{36})$/);
if (linkLancamento) paginaPublica(linkLancamento[1]);
else if (!location.hash.includes('type=recovery')) iniciar();
</script>
</body>
</html>
