async function paginaPlanilha(planilhaId) {
  $('#conteudo').innerHTML = '<div class="carregando">Carregando planilha…</div>';
  const { data: p, error } = await db.from('planilhas').select('*').eq('id', planilhaId).single();
  if (error) return erroNaTela(error);
  const [{ data: ciclo }, { data: questoesBrutas }, { data: segundas }, { data: pendencias }, { data: semMult }] = await Promise.all([
    db.from('ciclos').select('*').eq('id', p.ciclo_id).single(),
    db.from('questoes').select('*').eq('planilha_id', p.id).order('numero'),
    db.from('segunda_chamada').select('*').eq('planilha_id', p.id),
    db.from('pendencias_notas').select('*').eq('planilha_id', p.id).order('id'),
    db.from('sem_multiplicador').select('aluno_id').eq('planilha_id', p.id),
  ]);
  const questoes = ordenarColunas(questoesBrutas || []);
  const { data: notas } = questoes.length
    ? await db.from('notas_questao').select('aluno_id, questao_id, nota').in('questao_id', questoes.map(q => q.id))
    : { data: [] };
  const valor = new Map((notas || []).map(n => [`${n.aluno_id}-${n.questao_id}`, Number(n.nota)]));
  const seg = new Map((segundas || []).map(s => [s.aluno_id, Number(s.nota)]));
  const semM = new Set((semMult || []).map(x => x.aluno_id));
  const pend = pendencias || [];
  const alunos = estado.matriculas.filter(m => m.turma_id === p.turma_id && m.situacao === 'ativo')
    .sort((a, b) => (a.ordem ?? 999) - (b.ordem ?? 999)).map(m => estado.alunos.get(m.aluno_id)).filter(Boolean);
  const editar = veTudo();
  const temMult = MULT[p.nm] !== 1;
  // sem multiplicador (NM2) só existe a visão das notas dos professores
  const vista = temMult ? (estado.vistaPlanilha || 'prof') : 'prof';
  const cx = (v, attrs) => editar
    ? `<input class="nota" inputmode="decimal" ${attrs} value="${v == null ? '' : String(v).replace('.', ',')}">`
    : (v == null ? '—' : fmt(v));
  const doc = eDocumento(p.nm, p.materia);
  const misto = eMisto(p.nm, p.materia);
  const emails = questoes.map(q => q.professor_email).filter(Boolean);
  const titulo = `${p.materia} · ${p.nm} · ${nomeTurma(p.turma_id)} · ${ciclo.nome}`;
  const mensagem = `Olá! A planilha de notas de ${titulo} está aberta.\nLance as notas ${misto ? 'de Redação' : 'da sua questão'} neste link (salva automaticamente):\n${linkPublico(p.token)}`;
  // valor de cada coluna original; se houver 2ª chamada daquela prova, ela substitui
  const valoresDe = (a) => questoes.filter(q => !q.substitui_id).map(b => {
    const sub = questoes.find(x => x.substitui_id === b.id);
    return (sub ? valor.get(`${a}-${sub.id}`) : null) ?? valor.get(`${a}-${b.id}`) ?? null;
  });
  const temSegunda = p.nm !== 'NM2';   // na NM2 a 2ª chamada é por prova (colunas próprias)
  const linhaDe = (a) => calcularLinha(valoresDe(a), temSegunda ? seg.get(a) ?? null : null, p.nm, !semM.has(a), p.materia);

  // Pendências ligadas a um aluno da turma (aparecem na linha dele) e as soltas (nome do documento que não está na turma)
  const pendDoAluno = (id) => pend.filter(x => x.aluno_id === id);
  const soltas = pend.filter(x => !x.aluno_id || !alunos.some(a => a.id === x.aluno_id));
  const acoes = (x) => !editar ? '' : (x.aluno_id && x.nota != null && x.tipo !== 'fora_do_documento'
    ? `<button class="botao pequeno" data-usar="${x.id}">${x.tipo === 'nome_diferente' ? 'É o mesmo aluno: lançar' : 'Lançar esta nota:'} ${fmt(x.nota)}</button>` : '')
    + `<button class="botao leve pequeno" data-descartar="${x.id}">${x.tipo === 'fora_do_documento' ? 'Dispensar aviso' : 'Descartar'}</button>`;
  const motivos = (id) => pendDoAluno(id).map(x => `<span class="motivo">⚠ ${esc(x.motivo)}${acoes(x) ? '<br>' + acoes(x) : ''}</span>`).join('');
  const opcoesAlunos = `<option value="">Escolha o aluno da turma…</option>` + [...alunos].sort((a, b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('');

  $('#conteudo').innerHTML = `
    <div class="barra"><button class="botao leve" id="voltar">← ${esc(ciclo.nome)}</button>
      <div><h1>${esc(p.materia)} · ${p.nm} · ${esc(nomeTurma(p.turma_id))}</h1></div>
      ${doc ? '<span class="status fechada">notas vindas de PDF</span>' : `<span class="status ${p.aberta ? 'aberta' : 'fechada'}">${p.aberta ? 'aberta para os professores' : 'fechada'}</span>`}
      ${pend.length ? `<span class="status vermelho">${pend.length} ${pend.length === 1 ? 'pendência' : 'pendências'}</span>` : ''}
      <button class="botao" id="imprimir-relatorio" style="margin-left:auto">Imprimir relatório</button></div>
    ${doc ? `<div class="caixa-link"><strong>Notas importadas de PDF.</strong>
      ${editar ? questoes.map(q => `<button class="botao leve pequeno" data-reimportar="${q.numero}">Importar ${esc(nomeColuna(q))}</button>`).join('') : ''}
      <span class="subtitulo" style="margin:0">${p.nm === 'NM2' ? 'Nota real = (Provão + Qualitativa) ÷ 2, quando as duas estiverem lançadas. A 2ª chamada de uma prova substitui a nota daquela prova. ' : ''}Importar de novo atualiza as notas e refaz as pendências daquela prova.</span></div>` : `
    <div class="caixa-link">
      <strong>Link dos professores:</strong>
      <input type="text" readonly value="${esc(linkPublico(p.token))}" id="link-publico">
      <button class="botao leve pequeno" id="copiar-link">Copiar link</button>
      <button class="botao leve pequeno" id="copiar-msg">Copiar mensagem (WhatsApp)</button>
      ${emails.length ? `<a class="botao leve pequeno" id="avisar" href="mailto:?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent('Notas - ' + titulo)}&body=${encodeURIComponent(mensagem)}">Avisar por e-mail (${emails.length})</a>` : ''}
      ${editar ? `<button class="botao leve pequeno" id="abrir-fechar">${p.aberta ? 'Fechar lançamento' : 'Reabrir lançamento'}</button>` : ''}
    </div>
    ${misto ? `<div class="caixa-link"><strong>Nota da prova (PDF):</strong>
      ${editar ? questoes.filter(colunaPdf).map(q => `<button class="botao leve pequeno" data-reimportar="${q.numero}">Importar PDF da prova</button>`).join('') : ''}
      <span class="subtitulo" style="margin:0">Nota real = (PDF + Redação) ÷ 2, quando as duas estiverem lançadas. Depois × ${fmt(MULT[p.nm])}, no máximo 10. O professor de Redação não vê nem altera a coluna do PDF.</span></div>` : ''}`}
    ${soltas.length ? `<div class="caixa-erros"><h3>No documento, mas fora desta turma (${soltas.length}) — nota NÃO lançada</h3>
      ${soltas.map(x => `<div class="item"><strong>${esc(x.nome_documento || '')}</strong>${x.nota != null ? ` · nota ${fmt(x.nota)}` : ''}<br>${esc(x.motivo)}
        ${editar ? `<br><select data-destino="${x.id}">${opcoesAlunos}</select><button class="botao pequeno" data-lancar="${x.id}">Lançar para este aluno</button>${acoes(x)}` : ''}</div>`).join('')}</div>` : ''}
    <div class="aviso erro escondido alerta-notas"></div>
    ${temMult ? `<div class="abas abas-planilha">
      <button data-vista="prof" class="${vista === 'prof' ? 'ativa' : ''}">Notas dos professores</button>
      <button data-vista="mult" class="${vista === 'mult' ? 'ativa' : ''}">Com multiplicador (× ${fmt(MULT[p.nm])})</button></div>` : ''}
    <div class="rolavel"><table id="tabela-notas" class="vista-${vista}">
      <thead><tr><th>Nº</th><th>Aluno</th>
        ${questoes.map(q => `<th class="num col-prof">${doc || colunaPdf(q) ? `${esc(misto ? 'Prova' : nomeColuna(q))}<br><small>PDF</small>` : `${misto ? 'Redação' : 'Q' + q.numero}<br><small>${esc(q.professor)}</small>`}</th>`).join('')}
        ${doc || misto ? '' : '<th class="num col-prof">Soma</th>'}${temSegunda ? '<th class="num col-prof">2ª chamada</th>' : ''}<th class="num">Nota real</th>
        ${temMult ? `<th class="mult col-mult">Usar × ${fmt(MULT[p.nm])}?</th>` : ''}<th class="num col-mult">Nota final<br><small>máx. 10</small></th></tr></thead>
      <tbody>${alunos.map((a, i) => {
        const c = linhaDe(a.id);
        return `<tr data-linha="${a.id}" class="${pendDoAluno(a.id).length ? 'com-erro' : ''}"><td>${i + 1}</td><td>${esc(a.nome)}${motivos(a.id)}</td>
          ${questoes.map(q => `<td class="num col-prof">${cx(valor.get(`${a.id}-${q.id}`), `data-aluno="${a.id}" data-questao="${q.id}"`)}</td>`).join('')}
          <td class="num col-prof ${c.soma > 10 && !misto ? 'acima' : ''} ${doc || misto ? 'escondido' : ''}" data-soma>${fmt(c.soma)}</td>
          ${temSegunda ? `<td class="num col-prof">${cx(seg.get(a.id), `data-aluno="${a.id}" data-segunda="1"`)}</td>` : ''}
          <td class="num forte" data-real>${fmt(c.real)}</td>
          ${temMult ? `<td class="mult col-mult"><input type="checkbox" data-mult="${a.id}" ${semM.has(a.id) ? '' : 'checked'} ${editar ? '' : 'disabled'} title="Marcado = aplica o multiplicador"></td>` : ''}
          <td class="num forte col-mult" data-final>${fmt(c.final)}</td></tr>`;
      }).join('')}</tbody></table></div>
    ${editar ? `<p class="subtitulo" style="margin-top:14px">${doc ? 'Linhas em vermelho têm pendência: corrija e a marca some. Digitar a nota do aluno também resolve a pendência dele.'
      : 'A coordenação também pode corrigir qualquer nota aqui. Soma em vermelho = passou de 10.'}
      ${temMult ? ' Desmarque "Usar ×" para o aluno ficar com a nota real. A nota final nunca passa de 10.' : ''}
      ${doc || misto ? '' : '<button class="botao leve pequeno" id="mais-questao">+ Adicionar professor/questão</button>'}</p>` : ''}`;

  $('#voltar').onclick = () => irPara('ciclo', p.ciclo_id);
  document.querySelectorAll('.abas-planilha button').forEach(b => b.onclick = () => {
    estado.vistaPlanilha = b.dataset.vista;
    $('#tabela-notas').className = 'vista-' + b.dataset.vista;
    document.querySelectorAll('.abas-planilha button').forEach(x => x.classList.toggle('ativa', x === b));
  });
  $('#imprimir-relatorio').onclick = () => {
    const dados = { p, ciclo, questoes, alunos, valor, seg, semM, doc, linhaDe, temSegunda, misto };
    if (!temMult) return imprimirRelatorio(dados, false);
    $('#fundo-ficha').classList.remove('escondido');
    $('#ficha').innerHTML = `
      <div class="modal-topo"><div><h2>Imprimir relatório</h2>
        <span class="etiqueta">${esc(p.materia)} · ${p.nm} · ${esc(nomeTurma(p.turma_id))} · ${esc(ciclo.nome)}</span></div>
        <button class="fechar" aria-label="Fechar">×</button></div>
      <div class="secao escolha-impressao">
        <button class="botao leve" data-imp="sem">Sem multiplicador<small>Notas de cada professor, soma, 2ª chamada e nota real</small></button>
        <button class="botao" data-imp="com">Com multiplicador<small>Nota real, se o × ${fmt(MULT[p.nm])} foi aplicado e nota final (máx. 10)</small></button>
      </div>`;
    $('#ficha .fechar').onclick = fecharFicha;
    document.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => { fecharFicha(); imprimirRelatorio(dados, b.dataset.imp === 'com'); });
  };
  document.querySelectorAll('[data-reimportar]').forEach(b => b.onclick = () => importarPdf(ciclo, p.nm, p.materia, p.turma_id, p.id, Number(b.dataset.reimportar)));
  const copiar = async (txt, botao) => { try { await navigator.clipboard.writeText(txt); botao.textContent = 'Copiado!'; } catch { $('#link-publico').select(); } };
  if ($('#copiar-link')) $('#copiar-link').onclick = (e) => copiar(linkPublico(p.token), e.target);
  if ($('#copiar-msg')) $('#copiar-msg').onclick = (e) => copiar(mensagem, e.target);
  if ($('#abrir-fechar')) $('#abrir-fechar').onclick = async () => {
    await db.from('planilhas').update({ aberta: !p.aberta }).eq('id', p.id); paginaPlanilha(p.id);
  };
  if ($('#mais-questao')) $('#mais-questao').onclick = async () => {
    const nome = window.prompt ? prompt('Nome do professor da nova questão:') : null;
    if (!nome) return;
    await db.from('questoes').insert({ planilha_id: p.id, numero: questoes.length + 1, professor: nome.trim() });
    paginaPlanilha(p.id);
  };

  // ----- Resolver pendências -----
  const falhou = (e) => { alertaNotas('Não foi possível salvar: ' + e.message); };
  const lancarNota = async (aluno_id, nota, pendId, questaoId) => {
    const q = questoes.find(x => x.id === questaoId) || questoes[0];
    if (!q) return falhou({ message: 'planilha sem coluna de nota' });
    const { error: e1 } = await db.from('notas_questao').upsert({ aluno_id, questao_id: q.id, nota, atualizado_em: new Date().toISOString() });
    if (e1) return falhou(e1);
    await db.from('pendencias_notas').delete().eq('planilha_id', p.id).eq('aluno_id', aluno_id).eq('questao_id', q.id);
    if (pendId) await db.from('pendencias_notas').delete().eq('id', pendId);
    paginaPlanilha(p.id);
  };
  document.querySelectorAll('[data-usar]').forEach(b => b.onclick = () => {
    const x = pend.find(y => y.id === Number(b.dataset.usar));
    lancarNota(x.aluno_id, Number(x.nota), x.id, x.questao_id);
  });
  document.querySelectorAll('[data-lancar]').forEach(b => b.onclick = () => {
    const x = pend.find(y => y.id === Number(b.dataset.lancar));
    const destino = Number($(`[data-destino="${x.id}"]`).value);
    if (!destino) return alertaNotas('Escolha primeiro o aluno da turma que deve receber esta nota.');
    if (x.nota == null) return alertaNotas('Este item não tem nota válida no documento. Digite a nota direto na linha do aluno.');
    lancarNota(destino, Number(x.nota), x.id, x.questao_id);
  });
  document.querySelectorAll('[data-descartar]').forEach(b => b.onclick = async () => {
    const { error: e } = await db.from('pendencias_notas').delete().eq('id', Number(b.dataset.descartar));
    if (e) return falhou(e);
    paginaPlanilha(p.id);
  });

  // ----- Multiplicador por aluno -----
  const atualizarLinha = (aluno) => {
    const c = linhaDe(aluno);
    const tr = $('#tabela-notas').querySelector(`tr[data-linha="${aluno}"]`);
    tr.querySelector('[data-soma]').textContent = fmt(c.soma);
    tr.querySelector('[data-soma]').classList.toggle('acima', c.soma > 10 && !misto);
    tr.querySelector('[data-real]').textContent = fmt(c.real);
    tr.querySelector('[data-final]').textContent = fmt(c.final);
  };
  document.querySelectorAll('[data-mult]').forEach(ch => ch.onchange = async () => {
    const aluno_id = Number(ch.dataset.mult);
    ch.disabled = true;
    const { error: e } = ch.checked
      ? await db.from('sem_multiplicador').delete().eq('planilha_id', p.id).eq('aluno_id', aluno_id)
      : await db.from('sem_multiplicador').insert({ planilha_id: p.id, aluno_id });
    ch.disabled = false;
    if (e) { ch.checked = !ch.checked; return falhou(e); }
    ch.checked ? semM.delete(aluno_id) : semM.add(aluno_id);
    atualizarLinha(aluno_id);
  });

  // ----- Salvar nota digitada pela coordenação -----
  ligarNotas($('#tabela-notas'), (d, v) => {
    const aluno_id = Number(d.aluno);
    if (d.segunda) return v == null
      ? db.from('segunda_chamada').delete().eq('aluno_id', aluno_id).eq('planilha_id', p.id)
      : db.from('segunda_chamada').upsert({ aluno_id, planilha_id: p.id, nota: v });
    const questao_id = Number(d.questao);
    return v == null
      ? db.from('notas_questao').delete().eq('aluno_id', aluno_id).eq('questao_id', questao_id)
      : db.from('notas_questao').upsert({ aluno_id, questao_id, nota: v, atualizado_em: new Date().toISOString() });
  }, async (d, v) => {
    const aluno = Number(d.aluno);
    if (d.segunda) { v == null ? seg.delete(aluno) : seg.set(aluno, v); } else { valor.set(`${aluno}-${d.questao}`, v); }
    atualizarLinha(aluno);
    // nota digitada para um aluno com pendência = pendência resolvida
    const daColuna = pendDoAluno(aluno).filter(x => d.segunda || x.questao_id === Number(d.questao) || !x.questao_id);
    if (v != null && daColuna.length) {
      for (const x of daColuna) await db.from('pendencias_notas').delete().eq('id', x.id);
      paginaPlanilha(p.id);
    }
  });
}

// Relatório de notas para imprimir: sem multiplicador (notas dos professores) ou com multiplicador
function imprimirRelatorio({ p, ciclo, questoes, alunos, valor, seg, semM, doc, linhaDe, temSegunda = true, misto = false }, comMult) {
  const hoje = new Date().toLocaleDateString('pt-BR');
  const linhas = alunos.map((a, i) => ({ a, i, c: linhaDe(a.id) }));
  const media = (k) => {
    const v = linhas.map(l => l.c[k]).filter(x => x != null);
    return v.length ? fmt(Math.round(v.reduce((s, x) => s + x, 0) / v.length * 100) / 100) : '—';
  };
  const semNota = linhas.filter(l => l.c.real == null).length;
  const cab = comMult
    ? `<th class="n">Nº</th><th>Aluno</th><th class="n">Nota real</th><th class="n">Multiplicador</th><th class="n">Nota final</th>`
    : `<th class="n">Nº</th><th>Aluno</th>${questoes.map(q => `<th class="n">${doc ? esc(nomeColuna(q)) : misto ? (colunaPdf(q) ? 'Prova (PDF)' : `Redação<br>${esc(q.professor)}`) : `Q${q.numero}<br>${esc(q.professor)}`}</th>`).join('')}
       ${doc || misto ? '' : '<th class="n">Soma</th>'}${temSegunda ? '<th class="n">2ª chamada</th>' : ''}<th class="n">Nota real</th>`;
  const corpo = linhas.map(({ a, i, c }) => comMult
    ? `<tr><td class="n">${i + 1}</td><td>${esc(a.nome)}</td><td class="n">${fmt(c.real)}</td>
        <td class="n">${semM.has(a.id) ? 'não aplicado' : '× ' + fmt(MULT[p.nm])}</td><td class="n forte">${fmt(c.final)}</td></tr>`
    : `<tr><td class="n">${i + 1}</td><td>${esc(a.nome)}</td>${questoes.map(q => `<td class="n">${fmt(valor.get(`${a.id}-${q.id}`))}</td>`).join('')}
        ${doc || misto ? '' : `<td class="n">${fmt(c.soma)}</td>`}${temSegunda ? `<td class="n">${fmt(seg.get(a.id))}</td>` : ''}<td class="n forte">${fmt(c.real)}</td></tr>`).join('');
  $('#impressao').innerHTML = `
    <div class="imp-topo"><h1>NOTAS · ${esc(p.materia.toUpperCase())} · ${p.nm} · ${esc(nomeTurma(p.turma_id).toUpperCase())}</h1>
      <span>${esc(ciclo.nome)} · impresso em ${hoje}</span></div>
    <p class="imp-sub"><strong>${comMult ? `Com multiplicador (× ${fmt(MULT[p.nm])}, nota final no máximo 10)` : (MULT[p.nm] !== 1 ? 'Sem multiplicador — notas lançadas pelos professores' : 'Notas lançadas')}</strong>
      · ${alunos.length} alunos</p>
    <table class="imp-tabela"><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table>
    <p class="imp-rodape">Média da turma: nota real ${media('real')}${comMult ? ` · nota final ${media('final')}` : ''}
      ${semNota ? ` · ${semNota} ${semNota === 1 ? 'aluno sem nota' : 'alunos sem nota'}` : ''}</p>`;
  setTimeout(() => window.print(), 100);
}

// ---------- Página PÚBLICA de lançamento (professores, sem login) ----------
async function paginaPublica(token) {
  mostrar('#tela-publica');
  const alvo = $('#conteudo-publico');
  alvo.innerHTML = '<div class="carregando">Abrindo planilha…</div>';
  const { data: pl, error } = await db.rpc('planilha_publica', { p_token: token });
  if (error || !pl) { alvo.innerHTML = '<div class="aviso erro">Link inválido ou planilha removida. Confira o link com a coordenação.</div>'; return; }
  const valor = new Map(pl.notas.map(n => [`${n.aluno_id}-${n.questao_id}`, Number(n.nota)]));
  let escolhido = null;
  try { escolhido = Number(localStorage.getItem('professor-' + token)) || null; } catch {}
  if (!pl.questoes.some(q => q.id === escolhido)) escolhido = null;

  const desenhar = () => {
    alvo.innerHTML = `
      <h1>${esc(pl.materia)} · ${esc(pl.nm)} · ${esc(pl.turma)}</h1>
      <p class="subtitulo">${esc(pl.ciclo)} · ${pl.alunos.length} alunos</p>
      ${pl.aberta ? '' : '<div class="aviso erro">Esta planilha foi fechada pela coordenação. As notas não podem mais ser alteradas.</div>'}
      <div class="caixa-link"><strong>Quem é você?</strong>
        <select id="quem"><option value="">Escolha o seu nome…</option>
          ${pl.questoes.map(q => `<option value="${q.id}" ${q.id === escolhido ? 'selected' : ''}>Q${q.numero} · ${esc(q.professor)}</option>`).join('')}</select>
        <span class="subtitulo" style="margin:0">Digite as notas da sua questão (0 a 10, vírgula ou ponto). Salva sozinho ao sair da caixa. Enter desce para o próximo aluno.</span>
      </div>
      <div class="aviso erro escondido alerta-notas"></div>
      <div class="rolavel"><table id="tabela-publica">
        <thead><tr><th>Nº</th><th>Aluno</th>${pl.questoes.map(q => `<th class="num">${eMisto(pl.nm, pl.materia) ? 'Redação' : 'Q' + q.numero}<br><small>${esc(q.professor)}</small></th>`).join('')}<th class="num ${eMisto(pl.nm, pl.materia) ? 'escondido' : ''}">Soma</th></tr></thead>
        <tbody>${pl.alunos.map((a, i) => {
          const vals = pl.questoes.map(q => valor.get(`${a.id}-${q.id}`) ?? null);
          const soma = calcularLinha(vals, null, pl.nm).soma;
          return `<tr data-linha="${a.id}"><td>${i + 1}</td><td>${esc(a.nome)}</td>
            ${pl.questoes.map((q, j) => `<td class="num"><input class="nota" inputmode="decimal" data-aluno="${a.id}" data-questao="${q.id}"
               value="${vals[j] == null ? '' : String(vals[j]).replace('.', ',')}" ${pl.aberta && q.id === escolhido ? '' : 'disabled'}></td>`).join('')}
            <td class="num ${soma > 10 ? 'acima' : ''} ${eMisto(pl.nm, pl.materia) ? 'escondido' : ''}" data-soma>${fmt(soma)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    $('#quem').onchange = () => {
      escolhido = Number($('#quem').value) || null;
      try { localStorage.setItem('professor-' + token, escolhido || ''); } catch {}
      desenhar();
    };
    ligarNotas($('#tabela-publica'),
      (d, v) => db.rpc('salvar_nota_publica', { p_token: token, p_aluno: Number(d.aluno), p_questao: Number(d.questao), p_nota: v }),
      (d, v) => {
        valor.set(`${d.aluno}-${d.questao}`, v);
        const soma = calcularLinha(pl.questoes.map(q => valor.get(`${d.aluno}-${q.id}`) ?? null), null, pl.nm).soma;
        const td = $('#tabela-publica').querySelector(`tr[data-linha="${d.aluno}"] [data-soma]`);
        td.textContent = fmt(soma); td.classList.toggle('acima', soma > 10);
      });
  };
  desenhar();
}

// ---------- Importar notas de um PDF (nome do aluno + nota) ----------
// Usado para Inglês (NM1, NM2, NM3) e para as matérias do NM2.
// O sistema lê o PDF no próprio navegador (o arquivo não é enviado a lugar nenhum),
// encontra cada aluno pelo nome e mostra uma prévia antes de salvar.
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const eDocumento = (nm, materia) => nm === 'NM2' || materia === 'Inglês';
// Linguagens NM1/NM3: uma coluna vem do PDF (coordenação importa) e a Redação vem do link do professor
const eMisto = (nm, materia) => materia === 'Linguagens' && nm !== 'NM2';
const colunaPdf = (q) => / \(PDF\)$/.test(q.professor);

// Lê o texto do PDF e monta as linhas (juntando os pedaços que estão na mesma altura da página)
async function lerLinhasPdf(arquivo) {
  await carregarScript(PDFJS_URL);
  if (!window.__pdfWorker) {
    const codigo = await (await fetch(PDFJS_WORKER)).text();
    window.__pdfWorker = URL.createObjectURL(new Blob([codigo], { type: 'text/javascript' }));
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = window.__pdfWorker;
  const pdf = await pdfjsLib.getDocument({ data: await arquivo.arrayBuffer() }).promise;
  const linhas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const conteudo = await (await pdf.getPage(n)).getTextContent();
    const grupos = [];
    for (const item of conteudo.items) {
      if (!item.str || !item.str.trim()) continue;
      const y = item.transform[5], x = item.transform[4];
      let g = grupos.find(g => Math.abs(g.y - y) <= 3);
      if (!g) { g = { y, itens: [] }; grupos.push(g); }
      g.itens.push({ x, s: item.str });
    }
    grupos.sort((a, b) => b.y - a.y)
      .forEach(g => linhas.push(g.itens.sort((a, b) => a.x - b.x).map(i => i.s).join('  ').replace(/\s+/g, ' ').trim()));
  }
  return linhas;
}

// Entende o PDF: cabeçalho (simulado, turma, disciplina) + uma linha por aluno: NOME  TURMA  NOTA  ACERTOS
function interpretarPdf(linhas) {
  const campo = (rotulo) => {
    const l = linhas.find(l => semAcento(l).startsWith(rotulo));
    return l ? l.slice(l.indexOf(':') + 1).trim() : '';
  };
  const re = /^(.*\S)\s+(\S+)\s+(\d{1,2}(?:[.,]\d{1,2})?)\s+(\d+\s*\/\s*\d+)$/;
  return {
    titulo: linhas[0] || '',
    disciplina: campo('DISCIPLINA'),
    turma: campo('TURMA'),
    alunos: linhas.map(l => l.match(re)).filter(Boolean)
      .map(m => ({ nome: m[1].trim(), nota: lerNota(m[3]), acertos: m[4].replace(/\s/g, '') })),
  };
}

// Semelhança entre dois nomes (0 a 1), para achar pequenas diferenças de grafia (GIOVANNA x GYOVANNA)
function semelhanca(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return 0;
  let ant = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const atual = [i];
    for (let j = 1; j <= n; j++) atual[j] = Math.min(ant[j] + 1, atual[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    ant = atual;
  }
  return 1 - ant[n] / Math.max(m, n);
}
function casarAluno(nomePdf, alunos) {
  const alvo = semAcento(nomePdf).replace(/\s+/g, ' ');
  const exato = alunos.find(a => semAcento(a.nome).replace(/\s+/g, ' ') === alvo);
  if (exato) return { aluno: exato, tipo: 'exato' };
  let melhor = null, nota = 0;
  for (const a of alunos) { const s = semelhanca(alvo, semAcento(a.nome)); if (s > nota) { nota = s; melhor = a; } }
  return nota >= 0.88 ? { aluno: melhor, tipo: 'parecido' } : { aluno: null, tipo: 'nao' };
}

// Regras da importação (definidas pela coordenação):
//  * a nota só entra sozinha quando o nome do documento é IGUAL ao do sistema (acentos e espaços não contam);
//  * nome parecido, aluno fora da turma, aluno da turma que não está no documento e nota ilegível
//    NÃO recebem nota: ficam marcados em vermelho na planilha, com o motivo, para a coordenação corrigir.
// parcial = lista de 2ª chamada: só vêm os alunos que faltaram, então quem não está nela não é pendência
function analisarImportacao(info, alunos, turmaId, parcial = false) {
  const norm = (s) => semAcento(s).replace(/\s+/g, ' ').trim();
  const linhas = info.alunos.map(l => ({ ...l, exato: alunos.find(a => norm(a.nome) === norm(l.nome)) || null }));
  // aluno que aparece duas vezes com nome igual: nenhuma das duas entra
  const contagem = new Map();
  linhas.forEach(l => l.exato && contagem.set(l.exato.id, (contagem.get(l.exato.id) || 0) + 1));
  const casados = new Set(linhas.filter(l => l.exato).map(l => l.exato.id));
  const livres = alunos.filter(a => !casados.has(a.id));
  const outraTurma = (nome) => {
    const m = estado.matriculas.find(m => m.turma_id !== turmaId && m.situacao === 'ativo' && norm(estado.alunos.get(m.aluno_id)?.nome || '') === norm(nome));
    return m ? nomeTurma(m.turma_id) : null;
  };
  const turma = nomeTurma(turmaId);
  const lancar = [], pendencias = [];
  for (const l of linhas) {
    const notaOk = l.nota != null && !Number.isNaN(l.nota);
    if (l.exato && contagem.get(l.exato.id) > 1) {
      pendencias.push({ tipo: 'nota_invalida', aluno_id: l.exato.id, nome_documento: l.nome, nota: notaOk ? l.nota : null,
        motivo: `Aparece mais de uma vez no documento (esta linha: nota ${notaOk ? fmt(l.nota) : 'ilegível'}). Confira qual nota é a certa e digite-a.` });
    } else if (l.exato && !notaOk) {
      pendencias.push({ tipo: 'nota_invalida', aluno_id: l.exato.id, nome_documento: l.nome, nota: null,
        motivo: 'O nome bate, mas a nota do documento não pôde ser lida. Digite a nota manualmente.' });
    } else if (l.exato) {
      lancar.push({ aluno_id: l.exato.id, nota: l.nota, nome: l.nome });
    } else {
      const c = casarAluno(l.nome, livres);
      if (c.aluno) {
        pendencias.push({ tipo: 'nome_diferente', aluno_id: c.aluno.id, nome_documento: l.nome, nota: notaOk ? l.nota : null,
          motivo: `Nome escrito diferente. No documento: "${l.nome}"${notaOk ? ` (nota ${fmt(l.nota)})` : ''}. No sistema: "${c.aluno.nome}". Corrija a grafia no cadastro ou confirme que é o mesmo aluno.` });
      } else {
        const outra = outraTurma(l.nome);
        pendencias.push({ tipo: 'fora_da_turma', aluno_id: null, nome_documento: l.nome, nota: notaOk ? l.nota : null,
          motivo: outra ? `Está no documento, mas no sistema está matriculado na ${outra}, não na ${turma}.`
                        : `Está no documento, mas não está matriculado na ${turma} (nem foi encontrado em outra turma).` });
      }
    }
  }
  const comAviso = new Set(pendencias.filter(x => x.aluno_id).map(x => x.aluno_id));
  for (const a of (parcial ? [] : alunos)) {
    if (!casados.has(a.id) && !comAviso.has(a.id)) pendencias.push({ tipo: 'fora_do_documento', aluno_id: a.id, nome_documento: null, nota: null,
      motivo: 'Está na turma, mas não aparece no documento. Confira o documento ou digite a nota.' });
  }
  return { linhas, lancar, pendencias };
}

// Colunas das planilhas de documento. NM2 tem duas provas; as outras, uma.
// NM2: 1 Provão, 2 Qualitativa, 3 2ª chamada do Provão (substitui a 1), 4 2ª chamada da Qualitativa (substitui a 2)
const COLUNAS_NM2 = ['Provão (PDF)', 'Qualitativa (PDF)', '2ª chamada Provão (PDF)', '2ª chamada Qualitativa (PDF)'];
const SUBSTITUI_NM2 = { 3: 1, 4: 2 };
const nomeColuna = (q) => q.professor === 'Documento (PDF)' ? 'Nota do documento' : q.professor.replace(' (PDF)', '');
// ordem de exibição: cada coluna original seguida da sua 2ª chamada
const ordenarColunas = (qs) => {
  const base = qs.filter(q => !q.substitui_id).sort((a, b) => a.numero - b.numero);
  return [...base.flatMap(b => [b, ...qs.filter(x => x.substitui_id === b.id)]), ...qs.filter(x => x.substitui_id && !base.some(b => b.id === x.substitui_id))];
};

async function importarPdf(ciclo, nm, materia, turmaId, planilhaId = null, coluna = null) {
  const alunos = estado.matriculas.filter(m => m.turma_id === turmaId && m.situacao === 'ativo')
    .map(m => estado.alunos.get(m.aluno_id)).filter(Boolean).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').classList.add('largo');
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Importar notas do PDF</h2>
      <span class="etiqueta">${esc(materia)} · ${nm} · ${esc(nomeTurma(turmaId))} · ${esc(ciclo.nome)}</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <label for="arquivo-pdf">Escolha o PDF com o nome dos alunos e as notas</label>
      ${nm === 'NM2' ? `<label for="qual-prova">Este PDF é</label>
        <select id="qual-prova">${COLUNAS_NM2.map((c, i) => `<option value="${i + 1}" ${(coluna || 1) === i + 1 ? 'selected' : ''}>${c.replace(' (PDF)', '')}</option>`).join('')}</select>` : ''}
      <input type="file" id="arquivo-pdf" accept="application/pdf,.pdf">
      <p class="subtitulo" style="margin:8px 0 0">O arquivo é lido aqui no seu navegador. Só entra nota de aluno com o nome <strong>igual</strong> ao do sistema;
        os outros casos ficam em vermelho na planilha, com o motivo, para você corrigir.</p>
    </div>
    <div id="previa"></div>`;
  $('#ficha .fechar').onclick = fecharFicha;
  // se a pessoa trocar "Este PDF é" depois de escolher o arquivo, a prévia é refeita com a nova escolha
  let escolhaManual = false;
  if ($('#qual-prova')) $('#qual-prova').onchange = () => {
    escolhaManual = true;
    if ($('#arquivo-pdf').files[0]) $('#arquivo-pdf').onchange({ target: $('#arquivo-pdf') });
  };

  $('#arquivo-pdf').onchange = async (e) => {
    const arq = e.target.files[0]; if (!arq) return;
    $('#previa').innerHTML = '<div class="carregando">Lendo o PDF…</div>';
    let info;
    try { info = interpretarPdf(await lerLinhasPdf(arq)); }
    catch (err) { $('#previa').innerHTML = `<div class="secao"><div class="aviso erro">Não consegui ler o PDF: ${esc(err.message)}</div></div>`; return; }
    if (!info.alunos.length) { $('#previa').innerHTML = '<div class="secao"><div class="aviso erro">Não encontrei linhas de alunos com nota neste PDF.</div></div>'; return; }

    // Avisos: disciplina, turma e tipo de simulado diferentes do que foi escolhido
    const avisos = [];
    if (info.disciplina && !semAcento(info.disciplina).includes(semAcento(materia))) avisos.push(`O PDF é de <strong>${esc(info.disciplina)}</strong>, mas você está importando para ${esc(materia)}.`);
    const codPdf = (semAcento(info.turma).match(/(\d)([AB])I?$/) || []).slice(1).join('');
    if (codPdf && codPdf !== codigoTurma(nomeTurma(turmaId))) avisos.push(`O PDF é da turma <strong>${esc(info.turma)}</strong>, que parece ser a ${codPdf[0]}ª Série ${codPdf[1]}, não a ${esc(nomeTurma(turmaId))}.`);
    const tituloSA = semAcento(info.titulo);
    const segundaCh = /CHAMADA/.test(tituloSA);
    const provaPdf = /QUALITATIVA/.test(tituloSA) ? (segundaCh ? 4 : 2) : /PROVAO/.test(tituloSA) ? (segundaCh ? 3 : 1) : null;
    const nmPdf = provaPdf ? 'NM2' : /\bIME\b/.test(tituloSA) ? 'NM3' : /\bITA\b/.test(tituloSA) ? 'NM1' : null;
    const rotulo = { NM1: 'ITA (NM1)', NM2: 'Provão/Qualitativa (NM2)', NM3: 'IME (NM3)' };
    if (nmPdf && nmPdf !== nm) avisos.push(`O título do PDF fala em <strong>${rotulo[nmPdf]}</strong>, mas você está importando para ${nm}.`);
    if (nm === 'NM2' && provaPdf) {
      // o título diz qual é a prova: se veio de um botão de outra prova, avisa; senão, já escolhe
      const escolhida = escolhaManual ? Number($('#qual-prova').value) : coluna;
      if (escolhida && escolhida !== provaPdf) avisos.push(`O título do PDF indica <strong>${COLUNAS_NM2[provaPdf - 1].replace(' (PDF)', '')}</strong>, mas foi escolhido ${COLUNAS_NM2[escolhida - 1].replace(' (PDF)', '')}. Confira o campo "Este PDF é".`);
      else $('#qual-prova').value = String(provaPdf);
    }

    const colunaEscolhida = nm === 'NM2' ? Number($('#qual-prova').value) : 1;
    const parcial = nm === 'NM2' && !!SUBSTITUI_NM2[colunaEscolhida];
    if (parcial) avisos.push(`Importando como <strong>${COLUNAS_NM2[colunaEscolhida - 1].replace(' (PDF)', '')}</strong>: só entram os alunos da lista, e a nota deles substitui a da prova original. Quem não está na lista não fica pendente.`);
    const r = analisarImportacao(info, alunos, turmaId, parcial);
    const vermelhas = r.pendencias;
    $('#previa').innerHTML = `
      <div class="secao">
        <h3>${esc(info.titulo)}</h3>
        ${avisos.map(a => `<div class="pendencia">${a}</div>`).join('')}
        <p style="margin:6px 0 12px">${info.alunos.length} alunos no documento ·
          <strong>${r.lancar.length} notas serão lançadas</strong> (nome igual) ·
          <strong style="color:var(--erro)">${vermelhas.length} ${vermelhas.length === 1 ? 'pendência' : 'pendências'}</strong> (ficam sem nota, em vermelho)</p>
        ${vermelhas.length ? `<div class="caixa-erros"><h3>Ficarão em vermelho para você corrigir</h3>
          ${vermelhas.map(x => `<div class="item"><strong>${esc(x.aluno_id ? estado.alunos.get(x.aluno_id).nome : x.nome_documento)}</strong><br>${esc(x.motivo)}</div>`).join('')}</div>` : ''}
        <div class="rolavel"><table id="tabela-importacao"><thead><tr><th>Nome no documento</th><th class="num">Nota</th><th>Situação</th></tr></thead>
          <tbody>${r.linhas.map(l => {
            const vai = r.lancar.some(x => x.nome === l.nome);
            return `<tr class="${vai ? '' : 'com-erro'}"><td>${esc(l.nome)}</td>
              <td class="num">${l.nota == null || Number.isNaN(l.nota) ? 'ilegível' : fmt(l.nota)}</td>
              <td>${vai ? '<span class="status aberta">nome igual · será lançada</span>' : '<span class="status vermelho">não será lançada</span>'}</td></tr>`;
          }).join('')}</tbody></table></div>
      </div>
      <div class="secao"><button class="botao" id="salvar-importacao">Salvar ${r.lancar.length} notas${vermelhas.length ? ` e marcar ${vermelhas.length} pendências` : ''}</button>
        <div id="msg-importacao" class="aviso escondido"></div></div>`;

    $('#salvar-importacao').onclick = async () => {
      const msg = $('#msg-importacao');
      $('#salvar-importacao').disabled = true;
      try {
        // cria a planilha na primeira importação: NM2 com as colunas Provão e Qualitativa; as outras com uma coluna
        const numero = nm === 'NM2' ? Number($('#qual-prova').value) : 1;
        const nomes = nm === 'NM2' ? COLUNAS_NM2 : ['Documento (PDF)'];
        let pid = planilhaId;
        if (!pid) {
          const { data: p, error } = await db.from('planilhas').insert({ ciclo_id: ciclo.id, nm, materia, turma_id: turmaId, aberta: false }).select().single();
          if (error) throw error;
          pid = p.id;
        }
        const { data: qs, error: eq } = await db.from('questoes').select('id, numero').eq('planilha_id', pid).order('numero');
        if (eq) throw eq;
        // cria as colunas que faltam (as originais antes das de 2ª chamada, que apontam para elas)
        for (const [i, professor] of nomes.entries()) {
          if (qs.some(q => q.numero === i + 1)) continue;
          const base = nm === 'NM2' ? SUBSTITUI_NM2[i + 1] : null;
          const nova = { planilha_id: pid, numero: i + 1, professor };
          if (base) nova.substitui_id = qs.find(q => q.numero === base).id;
          const { data: criada, error: e2 } = await db.from('questoes').insert(nova).select().single();
          if (e2) throw e2;
          qs.push(criada);
        }
        const questaoId = qs.find(q => q.numero === numero).id;
        const prefixo = nm === 'NM2' ? `[${nomes[numero - 1].replace(' (PDF)', '')}] ` : '';
        if (r.lancar.length) {
          const { error: e3 } = await db.from('notas_questao').upsert(
            r.lancar.map(x => ({ aluno_id: x.aluno_id, questao_id: questaoId, nota: x.nota, atualizado_em: new Date().toISOString() })));
          if (e3) throw e3;
        }
        // a lista de pendências desta prova é refeita a cada importação (as da outra prova ficam)
        const { error: e4 } = await db.from('pendencias_notas').delete().eq('planilha_id', pid).eq('questao_id', questaoId);
        if (e4) throw e4;
        if (vermelhas.length) {
          const { error: e5 } = await db.from('pendencias_notas').insert(vermelhas.map(x => ({ planilha_id: pid, questao_id: questaoId, ...x, motivo: prefixo + x.motivo })));
          if (e5) throw e5;
        }
        fecharFicha();
        irPara('planilha', pid);
      } catch (err) {
        msg.textContent = 'Não foi possível salvar: ' + err.message; msg.classList.add('erro'); msg.classList.remove('escondido');
        $('#salvar-importacao').disabled = false;
      }
    };
  };
}

const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function carregarScript(url) {
  return new Promise((ok, falha) => {
    if (document.querySelector(`script[src="${url}"]`)) return ok();
    const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = falha; document.head.appendChild(s);
  });
}

  $('#arquivo-prof').onchange = async (e) => {
    const arq = e.target.files[0]; if (!arq) return;
    try {
      await carregarScript(XLSX_URL);
      const wb = XLSX.read(await arq.arrayBuffer());
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      const pega = (l, ...nomes) => { const k = Object.keys(l).find(k => nomes.includes(semAcento(k).replace(/[^A-Z]/g, ''))); return k ? String(l[k]).trim() : ''; };
      const lista = linhas.map(l => ({
        nome: pega(l, 'NOME', 'PROFESSOR'), email: pega(l, 'EMAIL').toLowerCase() || null,
        materia: pega(l, 'MATERIA', 'DISCIPLINA') || null, turmas: pega(l, 'TURMAS', 'TURMA') || null,
      })).filter(x => x.nome && x.nome !== 'Exemplo da Silva');
      if (!lista.length) return aviso('Não encontrei professores no arquivo. Confira se a primeira linha tem: Nome, E-mail, Matéria, Turmas.', true);
      const comEmail = lista.filter(x => x.email), semEmail = lista.filter(x => !x.email);
      const r1 = comEmail.length ? await db.from('professores').upsert(comEmail, { onConflict: 'email' }) : { error: null };
      const r2 = semEmail.length ? await db.from('professores').insert(semEmail) : { error: null };
      if (r1.error || r2.error) return aviso((r1.error || r2.error).message, true);
      await paginaProfessores();
      aviso(`${lista.length} professores importados.`);
    } catch (err) { aviso('Não consegui ler o arquivo: ' + err.message, true); }
  };
}

// =====================================================================
// COMPARATIVOS E NOTAS DE CORTE
// Cada vestibular tem uma nota de corte por matéria. Comparamos com a nota
// final (com multiplicador) de NM1 e NM2.
// =====================================================================
// 1ª fase = Provão (NM2); 2ª fase = NM1 (ITA) e NM3 (IME). Sempre Matemática, Física, Química e Inglês.
const MATERIAS_CORTE = ['Matemática', 'Física', 'Química', 'Inglês'];
const FASES = { 1: { nome: '1ª fase', prova: 'Provão (NM2)', nms: ['NM2'] }, 2: { nome: '2ª fase', prova: 'NM1 e NM3', nms: ['NM1', 'NM3'] } };
const faseDoNm = (nm) => nm === 'NM2' ? 1 : 2;
async function carregarCortes(forcar) {
  if (estado.cortes && !forcar) return estado.cortes;
  const [v, c] = await Promise.all([
    db.from('vestibulares').select('*').order('ordem').order('nome'),
    db.from('notas_corte').select('*'),
  ]);
  estado.cortes = { vestibulares: v.data || [], nota: new Map((c.data || []).map(x => [x.vestibular_id + '|' + x.fase + '|' + x.materia, Number(x.nota)])) };
  if (estado.vestibular && !estado.cortes.vestibulares.some(x => x.id === estado.vestibular)) estado.vestibular = null;
  if (!estado.vestibular && estado.cortes.vestibulares.length) estado.vestibular = estado.cortes.vestibulares[0].id;
  return estado.cortes;
}
const corteDe = (vestId, fase, materia) => estado.cortes?.nota.get(vestId + '|' + fase + '|' + materia) ?? null;
const nomeVestibular = (id) => estado.cortes?.vestibulares.find(v => v.id === id)?.nome || '';
function seletorVestibular(idCampo) {
  const vs = estado.cortes?.vestibulares || [];
  if (!vs.length) return '<span class="subtitulo" style="margin:0">Nenhum vestibular cadastrado (página Comparativos).</span>';
  return `<label for="${idCampo}" style="margin:0">Comparar com</label>
    <select id="${idCampo}" style="max-width:200px">${vs.map(v => `<option value="${v.id}" ${v.id === estado.vestibular ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select>`;
}
// classe da célula: verde se alcançou o corte, vermelho se ficou abaixo, nada se não há corte ou nota
function classeCorte(nota, corte) {
  if (nota == null || corte == null) return '';
  return Number(nota) >= corte ? 'ok-corte' : 'sob-corte';
}
const legendaCorte = (vest) => `<div class="legenda-corte">
  <span><i class="ok-corte"></i> alcançou o corte${vest ? ' do ' + esc(nomeVestibular(vest)) : ''}</span>
  <span><i class="sob-corte"></i> abaixo do corte</span><span>— sem nota ou sem corte cadastrado</span></div>`;

// Gráfico pequeno de uma matéria: NM1 e NM2 ciclo a ciclo, com a linha tracejada do corte
function graficoMateria(materia, ciclos, corte, nms) {
  const L = 270, A = 160, esq = 40, dir = 26, topo = 20, base = 32;
  const n = ciclos.length, larg = L - esq - dir, alt = A - topo - base;
  const x = (i) => esq + (n === 1 ? larg / 2 : (larg * i) / (n - 1));
  const y = (v) => topo + alt - (alt * Math.max(0, Math.min(10, v))) / 10;
  const cores = { NM1: '#1f6f43', NM2: '#2f6fb5', NM3: '#8e44ad' };
  const valor = (c, nm) => { const v = c.linhas.find(l => l.materia === materia)?.nm[nm]?.nota_multiplicada; return v == null ? null : Number(v); };
  const linhas = nms.map(nm => {
    const outro = nms.find(x => x !== nm);
    // o número fica acima do ponto mais alto e abaixo do mais baixo, para não encavalar
    const pts = ciclos.map((c, i) => { const v = valor(c, nm); if (v == null) return null; const o = outro ? valor(c, outro) : null;
      const embaixo = o != null && (v < o || (v === o && nm === nms[1])); return [x(i), y(v), v, embaixo]; });
    const seg = []; let atual = [];
    pts.forEach(p => { if (p) atual.push(p); else if (atual.length) { seg.push(atual); atual = []; } });
    if (atual.length) seg.push(atual);
    return seg.map(sg => `<polyline fill="none" stroke="${cores[nm]}" stroke-width="2" points="${sg.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`).join('')
      + pts.filter(Boolean).map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${corte != null && p[2] < corte ? '#c0392b' : cores[nm]}"/>`
        + `<text x="${p[0].toFixed(1)}" y="${(p[3] ? p[1] + 14 : p[1] - 7).toFixed(1)}" font-size="9" text-anchor="middle" fill="${cores[nm]}">${fmt(p[2])}</text>`).join('');
  }).join('');
  const grade = [0, 5, 10].map(v => `<line x1="${esq - 14}" x2="${L - 2}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e7e4"/><text x="${esq - 18}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="#7a857e">${v}</text>`).join('');
  const linhaCorte = corte == null ? '' : `<line x1="${esq - 14}" x2="${L - 2}" y1="${y(corte)}" y2="${y(corte)}" stroke="#c0392b" stroke-dasharray="5 4" stroke-width="1.4"/>
    <text x="${L - 2}" y="${y(corte) - 3}" font-size="9" text-anchor="end" fill="#c0392b">corte ${fmt(corte)}</text>`;
  const rotulos = ciclos.map((c, i) => `<text x="${x(i).toFixed(1)}" y="${A - base + 14}" font-size="9" text-anchor="middle" fill="#5b6660">${esc(c.nome.length > 12 ? c.nome.slice(0, 11) + '…' : c.nome)}</text>`).join('');
  return `<div class="grafico"><h4>${esc(materia)}</h4><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Evolução em ${esc(materia)}">${grade}${linhaCorte}${linhas}${rotulos}
     <g font-size="9">${nms.map((nm, k) => `<rect x="${esq - 14 + k * 44}" y="${A - 11}" width="10" height="3" fill="${cores[nm]}"/><text x="${esq + k * 44}" y="${A - 8}" fill="#5b6660">${nm}</text>`).join('')}</g></svg></div>`;
}
// Evolução do aluno no Boletim: 1ª fase (Provão) e 2ª fase (NM1 e NM3), um gráfico por matéria
function htmlEvolucao(ciclos, vest, impressao) {
  const blocos = [1, 2].map(fase => {
    const nms = FASES[fase].nms;
    const materias = MATERIAS_CORTE.filter(m => ciclos.some(c => c.linhas.some(l => l.materia === m && nms.some(nm => l.nm[nm]?.nota_multiplicada != null))));
    if (!materias.length) return '';
    return `<h4 style="margin:${impressao ? '6px 0 4px' : '14px 0 8px'}">Comparativo da ${FASES[fase].nome} · ${FASES[fase].prova}</h4>
      <div class="${impressao ? 'imp-graficos' : 'graficos'}">${materias.map(m => graficoMateria(m, ciclos, vest ? corteDe(vest, fase, m) : null, nms)).join('')}</div>`;
  }).join('');
  if (!blocos) return '<p class="subtitulo" style="margin:0">Ainda não há notas de Provão, NM1 ou NM3 em Matemática, Física, Química ou Inglês.</p>';
  return `${impressao ? '' : legendaCorte(vest)}${blocos}
    ${impressao ? '' : '<p class="subtitulo" style="margin:10px 0 0">Bolinha vermelha = nota abaixo do corte. A linha tracejada é o corte do vestibular escolhido naquela fase.</p>'}`;
}

// =====================================================================
// DESEMPENHO: visão geral (turmas, matérias, faixas de nota, provas),
// destaques, quem precisa de auxílio e o desempenho individual.
// Média = nota final (com multiplicador) das provas escolhidas (NM1, NM2, NM3).
// =====================================================================
const CORES_TURMA = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100']; // uma cor fixa por turma, na ordem de TURMAS_NOTAS
const COR_REF = '#8a918d'; // cinza da referência (média da turma)
const corTurma = (t) => CORES_TURMA[TURMAS_NOTAS.indexOf(t)] || COR_REF;
const media = (vs) => { const v = vs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const r2 = (n) => n == null ? null : Math.round(n * 100) / 100;

async function buscarTudo(fazer) { // passa de 1000 em 1000 (limite do Supabase)
  const todos = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await fazer().range(de, de + 999);
    if (error) throw error;
    todos.push(...(data || []));
    if (!data || data.length < 1000) return todos;
  }
}
async function carregarDesempenho(forcar) {
  if (estado.desemp && !forcar && Date.now() - estado.desemp.quando < 120000) return estado.desemp;
  const [ciclos, linhas, questoes] = await Promise.all([
    db.from('ciclos').select('*').eq('ano_letivo', ANO_LETIVO).order('criado_em').then(r => { if (r.error) throw r.error; return r.data || []; }),
    buscarTudo(() => db.from('historico_notas').select('aluno_id, planilha_id, ciclo_id, nm, materia, turma_id, nota_multiplicada')
      .eq('ano_letivo', ANO_LETIVO).order('planilha_id').order('aluno_id')),
    buscarTudo(() => db.from('questoes').select('planilha_id, professor').order('id')),
    carregarCortes(),
  ]);
  const profs = new Map();
  questoes.forEach(q => { const n = q.professor.replace(/ \(PDF\)$/, ''); if (/^(Documento|Provão|Qualitativa|2ª chamada|Redação)/.test(n)) return;
    if (!profs.has(q.planilha_id)) profs.set(q.planilha_id, new Set()); profs.get(q.planilha_id).add(n); });
  estado.desemp = { quando: Date.now(), ciclos, linhas: linhas.filter(l => l.nota_multiplicada != null).map(l => ({ ...l, nota: Number(l.nota_multiplicada) })), profs };
  return estado.desemp;
}

// Resumo de cada aluno num ciclo: média por matéria, média geral, turma e comparação com o corte
function resumoCiclo(d, cicloId, nms, vest) {
  const porAluno = new Map();
  d.linhas.forEach(l => {
    if (l.ciclo_id !== cicloId || !nms.includes(l.nm)) return;
    if (!porAluno.has(l.aluno_id)) porAluno.set(l.aluno_id, []);
    porAluno.get(l.aluno_id).push(l);
  });
  const res = new Map();
  porAluno.forEach((ls, id) => {
    const porMateria = {};
    MATERIAS.forEach(m => { const v = media(ls.filter(l => l.materia === m).map(l => l.nota)); if (v != null) porMateria[m] = v; });
    const contagem = {}; ls.forEach(l => contagem[l.turma_id] = (contagem[l.turma_id] || 0) + 1);
    const turma = Number(Object.entries(contagem).sort((a, b) => b[1] - a[1])[0][0]);
    const abaixo = new Set(); let comparados = 0;
    if (vest) ls.forEach(l => { if (!MATERIAS_CORTE.includes(l.materia)) return; const c = corteDe(vest, faseDoNm(l.nm), l.materia);
      if (c == null) return; comparados++; if (l.nota < c) abaixo.add(l.materia); });
    res.set(id, { id, turma, porMateria, media: media(Object.values(porMateria)), abaixo, comparados });
  });
  // posição dentro da turma
  TURMAS_NOTAS.forEach(t => {
    const lista = [...res.values()].filter(r => r.turma === t && r.media != null).sort((a, b) => b.media - a.media);
    lista.forEach((r, i) => { r.pos = i + 1; r.total = lista.length; });
  });
  return res;
}
const nomeAluno = (id) => estado.alunos.get(id)?.nome || 'Aluno ' + id;

// Destaques e auxílio, com os motivos de cada aluno
function classificar(atual, anterior) {
  const destaques = [], auxilio = [];
  const deltas = new Map();
  if (anterior) atual.forEach((r, id) => { const a = anterior.get(id); if (r.media != null && a?.media != null) deltas.set(id, r.media - a.media); });
  const topEvolucao = new Set();
  TURMAS_NOTAS.forEach(t => [...deltas].filter(([id, dl]) => atual.get(id).turma === t && dl > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).forEach(([id]) => topEvolucao.add(id)));
  atual.forEach(r => {
    if (r.media == null) return;
    const bons = [], ruins = [];
    if (r.pos <= 5) bons.push(`${r.pos}º da turma`);
    if (r.comparados && !r.abaixo.size) bons.push('Alcançou o corte');
    if (topEvolucao.has(r.id)) bons.push(`Subiu ${fmt(r2(deltas.get(r.id)))}`);
    const fortes = Object.entries(r.porMateria).filter(([, v]) => v >= 8);
    if (fortes.length > 2) bons.push(`8 ou mais em ${fortes.length} matérias`);
    else fortes.forEach(([m, v]) => bons.push(`${m} ${fmt(r2(v))}`));
    if (r.media < 5) ruins.push(`Média ${fmt(r2(r.media))}`);
    const fracas = Object.entries(r.porMateria).filter(([, v]) => v < 5);
    if (fracas.length > 2) ruins.push(`Abaixo de 5 em ${fracas.length} matérias`);
    else fracas.forEach(([m, v]) => ruins.push(`${m} ${fmt(r2(v))}`));
    if (deltas.has(r.id) && deltas.get(r.id) <= -1) ruins.push(`Caiu ${fmt(r2(-deltas.get(r.id)))}`);
    if (r.abaixo.size >= 2) ruins.push(`Abaixo do corte em ${r.abaixo.size}`);
    if (r.total >= 10 && r.pos > r.total - 5) ruins.push(`${r.pos}º de ${r.total}`);
    if (bons.length) destaques.push({ ...r, motivos: bons, delta: deltas.get(r.id) });
    if (ruins.length) auxilio.push({ ...r, motivos: ruins, delta: deltas.get(r.id) });
  });
  destaques.sort((a, b) => b.motivos.length - a.motivos.length || b.media - a.media);
  auxilio.sort((a, b) => b.motivos.length - a.motivos.length || a.media - b.media);
  return { destaques, auxilio, deltas };
}

// ---------- gráficos (SVG desenhado à mão, com dica ao passar o mouse) ----------
function graficoLinhas({ series, rotulos, alt = 230, larg = 620, legenda = true }) {
  const esq = 34, dir = 96, topo = 14, base = 30, W = larg - esq - dir, H = alt - topo - base, n = rotulos.length;
  const x = (i) => esq + (n === 1 ? W / 2 : (W * i) / (n - 1));
  const y = (v) => topo + H - (H * v) / 10;
  const grade = [0, 2.5, 5, 7.5, 10].map(v => `<line x1="${esq}" x2="${esq + W}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe8"/>
    <text x="${esq - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5f6b64">${fmt(v)}</text>`).join('');
  const eixo = rotulos.map((r, i) => `<text x="${x(i)}" y="${alt - 10}" font-size="11" text-anchor="middle" fill="#5f6b64">${esc(r)}</text>`).join('');
  const linhas = series.map(s => {
    const pts = s.valores.map((v, i) => v == null ? null : [x(i), y(v), v, i]);
    let d = '', ini = true;
    pts.forEach(p => { if (!p) { ini = true; return; } d += (ini ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); ini = false; });
    const ult = pts.filter(Boolean).at(-1);
    return `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" ${s.tracejado ? 'stroke-dasharray="5 4"' : ''}/>
      ${pts.filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${s.cor}" stroke="#fff" stroke-width="2"><title>${esc(s.nome)} · ${esc(rotulos[p[3]])}: ${fmt(r2(p[2]))}</title></circle>`).join('')}
      ${ult ? `<text x="${ult[0] + 9}" y="${ult[1] + 4}" font-size="11" fill="#1d2420">${esc(s.nome)} ${fmt(r2(ult[2]))}</text>` : ''}`;
  }).join('');
  const leg = legenda ? `<div class="legenda-graf">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '';
  return `${leg}<svg viewBox="0 0 ${larg} ${alt}" class="graf" role="img">${grade}${eixo}${linhas}</svg>`;
}
function graficoBarras({ categorias, series, alt = 230, larg = 620, maxY = 10, rotular = [0], formato = fmt, legenda = true, eixoY = true }) {
  const esq = eixoY ? 34 : 8, dir = 8, topo = 18, base = 30, W = larg - esq - dir, H = alt - topo - base;
  const nG = categorias.length, nS = series.length, larG = W / nG, larB = Math.min(34, (larG * 0.7) / nS);
  const y = (v) => topo + H - (H * Math.min(v, maxY)) / maxY;
  const passos = maxY === 10 ? [0, 2.5, 5, 7.5, 10] : [0, maxY / 2, maxY].map(Math.round);
  const grade = passos.map(v => `<line x1="${esq}" x2="${esq + W}" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe8"/>${eixoY ? `<text x="${esq - 8}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5f6b64">${fmt(v)}</text>` : ''}`).join('');
  const barras = categorias.map((c, g) => {
    const x0 = esq + g * larG + (larG - nS * larB - (nS - 1) * 2) / 2;
    return series.map((s, k) => {
      const v = s.valores[g]; if (v == null) return '';
      const bx = x0 + k * (larB + 2), by = y(v), bh = topo + H - by, rr = Math.min(4, bh, larB / 2);
      const d = `M${bx},${topo + H}V${by + rr}Q${bx},${by} ${bx + rr},${by}H${bx + larB - rr}Q${bx + larB},${by} ${bx + larB},${by + rr}V${topo + H}Z`;
      return `<path d="${d}" fill="${s.cor}"><title>${esc(s.nome)} · ${esc(c)}: ${formato(v)}</title></path>
        ${rotular.includes(k) ? `<text x="${bx + larB / 2}" y="${by - 5}" font-size="11" text-anchor="middle" fill="#1d2420">${formato(v)}</text>` : ''}`;
    }).join('') + `<text x="${esq + g * larG + larG / 2}" y="${alt - 10}" font-size="11" text-anchor="middle" fill="#5f6b64">${esc(c)}</text>`;
  }).join('');
  const leg = legenda && nS > 1 ? `<div class="legenda-graf">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '';
  return `${leg}<svg viewBox="0 0 ${larg} ${alt}" class="graf" role="img">${grade}<line x1="${esq}" x2="${esq + W}" y1="${topo + H}" y2="${topo + H}" stroke="#b9c2bc"/>${barras}</svg>`;
}
// cor do mapa de calor: verde claro (nota baixa) até verde escuro (nota alta)
function corCalor(v) {
  const a = [232, 243, 236], b = [21, 77, 41], t = Math.max(0, Math.min(1, v / 10));
  return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * t)).join(',')})`;
}

        <div class="tile"><span>Posição na turma</span><strong>${r.pos ? r.pos + 'º de ' + r.total : '—'}</strong></div>
        <div class="tile"><span>Desde o ciclo anterior</span><strong>${delta == null ? '—' : (delta > 0 ? '▲ +' : delta < 0 ? '▼ ' : '') + fmt(r2(delta))}</strong></div>
        <div class="tile"><span>Média da turma</span><strong>${fmt(r2(media([...atual.values()].filter(x => x.turma === r.turma).map(x => x.media))))}</strong></div>
      </div>
      ${bons.length || ruins.length ? `<p style="margin:4px 0 12px">${etiquetasMotivos(bons, 'bom')} ${etiquetasMotivos(ruins, 'ruim')}</p>` : ''}
      <div class="grade-paineis">
        <div><h4>Média ciclo a ciclo</h4>${graficoLinhas({ series: [{ nome: 'Aluno', cor: '#2a78d6', valores: doAluno }, { nome: 'Turma', cor: COR_REF, valores: daTurma, tracejado: true }], rotulos: ciclosCom.map(c => c.nome) })}</div>
        <div><h4>Por matéria neste ciclo</h4>${graficoBarras({ categorias: mats, series: [{ nome: 'Aluno', cor: '#2a78d6', valores: mats.map(m => r.porMateria[m]) }, { nome: 'Média da turma', cor: COR_REF, valores: turmaMat }], formato: (n) => fmt(r2(n)) })}</div>
      </div></div>`;
    $('#de-fechar').onclick = () => { estado.desempAluno = null; box.innerHTML = ''; };
    $('#de-ficha').onclick = () => abrirFicha(id);
    if (!semRolar) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('#de-ciclo').onchange = () => { f.ciclo = Number($('#de-ciclo').value); desenhar(); };
  $('#de-turma').onchange = () => { f.turma = Number($('#de-turma').value); desenhar(); };
  $('#de-provas').onchange = () => { f.provas = $('#de-provas').value; desenhar(); };
  if ($('#de-vest')) $('#de-vest').onchange = () => { estado.vestibular = vest(); desenhar(); };
  $('#de-busca').onchange = () => { const a = [...estado.alunos.values()].find(x => x.nome === $('#de-busca').value); if (a) { $('#de-busca').value = ''; mostrarIndividual(a.id); } };
  $('#de-atualizar').onclick = async () => { await carregarDesempenho(true); paginaDesempenho(); };
  $('#de-imprimir').onclick = () => {
    const { dest, aux } = estado.desempAtual, ciclo = ciclosCom.find(c => c.id === f.ciclo);
    const tab = (lista) => lista.length ? `<table class="imp-tabela"><thead><tr><th>Aluno</th><th>Turma</th><th class="n">Média</th><th>Por quê</th></tr></thead>
      <tbody>${lista.map(r => `<tr><td>${esc(nomeAluno(r.id))}</td><td>${esc(nomeTurma(r.turma))}</td><td class="n">${fmt(r2(r.media))}</td><td>${esc(r.motivos.join(' · '))}</td></tr>`).join('')}</tbody></table>` : '<p>Ninguém.</p>';
    $('#impressao').innerHTML = `<div class="imp-boletim"><div class="imp-topo"><h1>DESEMPENHO · ${esc((ciclo?.nome || '').toUpperCase())}</h1>
      <span>${f.turma ? esc(nomeTurma(f.turma)) : 'Todas as turmas'} · ${f.provas === 'todas' ? 'NM1 + NM2 + NM3' : f.provas}${vest() ? ' · corte ' + esc(nomeVestibular(vest())) : ''} · impresso em ${new Date().toLocaleDateString('pt-BR')}</span></div>
      <h2>Destaques (${dest.length})</h2>${tab(dest)}<h2>Precisam de auxílio (${aux.length})</h2>${tab(aux)}</div>`;
    setTimeout(() => window.print(), 100);
  };
  desenhar();
  if (alunoInicial) mostrarIndividual(Number(alunoInicial));
}

// =====================================================================
// INÍCIO DA PÁGINA
// =====================================================================
const linkLancamento = location.hash.match(/^#lancar-([0-9a-f-]{36})$/);
if (linkLancamento) paginaPublica(linkLancamento[1]);
else if (!location.hash.includes('type=recovery')) iniciar();
</script>
</body>
</html>
