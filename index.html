<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema ITA-IME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ---------- Aparência geral ---------- */
  :root {
    --verde: #1f6b3a; --verde-escuro: #154d29; --verde-claro: #e8f3ec;
    --texto: #1d2420; --suave: #5f6b64; --borda: #dfe5e1; --fundo: #f5f7f6;
    --branco: #fff; --alerta: #b54708; --alerta-fundo: #fff4e5; --erro: #b42318;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--texto); background: var(--fundo); font-size: 15px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .escondido { display: none !important; }

  /* ---------- Tela de login ---------- */
  #tela-login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .cartao-login { background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 32px; width: 100%; max-width: 380px; }
  .marca { font-weight: 700; font-size: 22px; color: var(--verde); letter-spacing: -.3px; }
  .marca small { display: block; font-weight: 500; font-size: 13px; color: var(--suave); letter-spacing: 0; margin-top: 2px; }
  .abas { display: flex; gap: 4px; background: var(--fundo); border-radius: 8px; padding: 4px; margin: 24px 0 16px; }
  .abas button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 6px; color: var(--suave); font-weight: 500; }
  .abas button.ativa { background: var(--branco); color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; }
  input[type=email], input[type=password], input[type=search], input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--branco); }
  input:focus, select:focus { outline: 2px solid var(--verde); outline-offset: -1px; }
  .botao { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--verde); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; }
  .botao:hover { background: var(--verde-escuro); }
  .botao.cheio { width: 100%; justify-content: center; margin-top: 20px; }
  .botao.leve { background: var(--branco); color: var(--texto); border: 1px solid var(--borda); font-weight: 500; }
  .botao.leve:hover { background: var(--fundo); }
  .aviso { margin-top: 14px; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--verde-claro); color: var(--verde-escuro); }
  .aviso.erro { background: #fdecea; color: var(--erro); }

  /* ---------- Topo e navegação ---------- */
  header { background: var(--branco); border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5; }
  .topo { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 24px; }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; color: var(--suave); font-weight: 500; }
  nav button.ativa { background: var(--verde-claro); color: var(--verde-escuro); }
  .usuario { font-size: 13px; color: var(--suave); text-align: right; }
  .usuario strong { color: var(--texto); display: block; font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
  .subtitulo { color: var(--suave); margin: 0 0 20px; }

  /* ---------- Turmas ---------- */
  .grade-turmas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .turma { background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; padding: 18px; text-align: left; transition: border-color .15s; }
  .turma:hover { border-color: var(--verde); }
  .turma .nome { font-weight: 600; font-size: 16px; }
  .turma .qtd { font-size: 28px; font-weight: 700; color: var(--verde); margin-top: 10px; }
  .turma .qtd span { font-size: 13px; font-weight: 500; color: var(--suave); margin-left: 4px; }
  .turma.vazia .qtd { color: var(--suave); }

  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .barra .espaco { flex: 1; }
  .barra input[type=search] { max-width: 280px; }
  .alternar { display: flex; border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; }
  .alternar button { border: 0; background: var(--branco); padding: 8px 14px; color: var(--suave); }
  .alternar button.ativa { background: var(--verde); color: #fff; }

  /* ---------- Carômetro ---------- */
  .carometro { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .pessoa { background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; overflow: hidden; text-align: left; padding: 0; }
  .pessoa:hover { border-color: var(--verde); }
  .foto { aspect-ratio: 1 / 1; width: 100%; object-fit: cover; display: block; background: var(--verde-claro); }
  .sem-foto { aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--verde-claro); color: var(--verde); font-weight: 700; font-size: 34px; }
  .pessoa .legenda { padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.3; }
  .pessoa .legenda span { display: block; font-weight: 400; color: var(--suave); font-size: 12px; margin-top: 2px; }

  /* ---------- Tabelas ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--borda); font-size: 14px; }
  th { background: var(--fundo); font-weight: 600; font-size: 13px; color: var(--suave); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.clicavel:hover { background: var(--verde-claro); cursor: pointer; }
  select { padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--branco); }

  /* ---------- Ficha do aluno ---------- */
  .fundo-modal { position: fixed; inset: 0; background: rgba(16, 24, 20, .45); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .modal { background: var(--branco); border-radius: 14px; width: 100%; max-width: 720px; max-height: 90vh; overflow: auto; }
  .modal.largo { max-width: 1000px; }
  #tabela-importacao td:first-child { min-width: 260px; }
  #tabela-importacao select { width: 100%; max-width: 380px; }
  #tabela-importacao td:last-child { white-space: nowrap; }
  .modal-topo { display: flex; gap: 20px; padding: 24px; border-bottom: 1px solid var(--borda); align-items: center; }
  .modal-topo .foto, .modal-topo .sem-foto { width: 120px; border-radius: 10px; flex-shrink: 0; }
  .modal-topo h2 { margin: 0 0 4px; font-size: 20px; }
  .fechar { margin-left: auto; align-self: flex-start; border: 0; background: transparent; font-size: 22px; color: var(--suave); }
  .secao { padding: 20px 24px; border-bottom: 1px solid var(--borda); }
  .secao:last-child { border-bottom: 0; }
  .secao h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--suave); }
  .campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 20px; }
  .campo small { display: block; font-size: 12px; color: var(--suave); }
  .campo div { font-weight: 500; word-break: break-word; }
  .vazio { color: var(--suave); font-weight: 400 !important; font-style: italic; }
  .pendencia { background: var(--alerta-fundo); color: var(--alerta); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 6px; }
  .etiqueta { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--verde-claro); color: var(--verde-escuro); font-weight: 600; }
  .carregando { color: var(--suave); padding: 40px 0; text-align: center; }

  .link { background: none; border: 0; color: var(--verde); padding: 0; margin-top: 14px; font-size: 14px; text-decoration: underline; }

  /* ---------- Notas ---------- */
  h2 { font-size: 17px; margin: 28px 0 10px; display: flex; align-items: center; gap: 10px; }
  .rolavel { overflow-x: auto; border-radius: 12px; }
  .nota { width: 64px; padding: 6px 4px; text-align: center; border: 1px solid var(--borda); border-radius: 6px; background: var(--branco); }
  .nota:disabled { background: var(--fundo); color: var(--texto); border-color: transparent; }
  .nota.salvo { border-color: var(--verde); background: var(--verde-claro); }
  .nota.invalido { border-color: var(--erro); background: #fdecea; }
  .acima { color: var(--erro); font-weight: 700; }
  td.num, th.num { text-align: center; }
  td.forte { font-weight: 700; }
  .pendente { color: var(--suave); font-size: 13px; font-style: italic; }
  .botao.pequeno { padding: 6px 10px; font-size: 13px; }
  .botao.perigo { background: var(--erro); }
  .botao.perigo:hover { background: #8f1c13; }
  .linha-acao { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .linha-acao select, .linha-acao input { flex: 1 1 160px; min-width: 140px; }
  .campo-foto { display: flex; gap: 16px; align-items: center; }
  .campo-foto .foto, .campo-foto .sem-foto { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; flex-shrink: 0; font-size: 26px; }
  .acoes-ficha { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .form-edicao { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 16px; }
  .form-edicao label { margin: 8px 0 4px; font-size: 12.5px; color: var(--suave); }
  .form-edicao input, .form-edicao select, .form-edicao textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; background: var(--branco); font: inherit; }
  .form-edicao .largo { grid-column: 1 / -1; }
  .rodape-ficha { position: sticky; bottom: 0; background: var(--branco); border-top: 1px solid var(--borda); padding: 14px 24px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .boletim td.num small { display: block; color: var(--suave); font-weight: 400; font-size: 11.5px; }
  .mov { font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--borda); }
  .mov:first-child { border-top: 0; }
  .mov small { color: var(--suave); }
  .lista-desistentes { display: grid; gap: 6px; margin-top: 10px; }
  .lista-desistentes button { text-align: left; }
  .caixa-link { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .caixa-link input { flex: 1; min-width: 260px; }
  .linha-prof { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; }
  .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .status.aberta { background: var(--verde-claro); color: var(--verde-escuro); }
  .status.fechada { background: #eceff1; color: var(--suave); }
  .status.vermelho { background: #fdecea; color: var(--erro); }
  tr.com-erro td { background: #fdecea; }
  tr.com-erro td:nth-child(2) { color: var(--erro); font-weight: 600; }
  .motivo { display: block; font-size: 12.5px; font-weight: 400; color: var(--erro); margin-top: 3px; }
  .motivo .botao { margin: 4px 6px 0 0; }
  .caixa-erros { border: 1px solid #f3b8b2; background: #fdecea; border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
  .caixa-erros h3 { color: var(--erro); margin: 0 0 8px; font-size: 15px; }
  .caixa-erros .item { padding: 8px 0; border-top: 1px solid #f3b8b2; color: var(--erro); font-size: 14px; }
  .caixa-erros .item:first-of-type { border-top: 0; }
  .caixa-erros select { max-width: 320px; margin: 4px 6px 0 0; }
  td.mult { text-align: center; }
  /* Abas da planilha: "Notas dos professores" esconde as colunas do multiplicador e vice-versa */
  .abas.abas-planilha { margin: 0 0 14px; max-width: 520px; }
  #tabela-notas.vista-prof .col-mult, #tabela-notas.vista-mult .col-prof { display: none; }
  .escolha-impressao { display: grid; gap: 10px; }
  .escolha-impressao button { display: block; width: 100%; text-align: left; padding: 14px 16px; }
  .escolha-impressao small { display: block; font-weight: 400; opacity: .8; margin-top: 3px; }
  #tela-publica main { max-width: 1100px; }

  /* ---------- Impressão do carômetro ---------- */
  #impressao { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; }
    #tela-sistema, #tela-login, #fundo-ficha { display: none !important; }
    #impressao { display: block; font-family: Inter, Arial, sans-serif; color: #000; }
    .imp-topo { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--verde); padding-bottom: 6px; margin-bottom: 10px; }
    .imp-topo h1 { font-size: 16pt; margin: 0; color: var(--verde); }
    .imp-topo span { font-size: 9pt; color: #444; }
    .imp-boletim h2 { font-size: 11pt; margin: 14px 0 6px; }
    .imp-grade { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .imp-aluno { border: 1px solid #bbb; border-radius: 6px; overflow: hidden; break-inside: avoid; }
    .imp-aluno .foto, .imp-aluno .sem-foto { aspect-ratio: 1 / 1; width: 100%; font-size: 22pt; }
    .imp-dados { padding: 5px 6px; font-size: 7.5pt; line-height: 1.35; }
    .imp-dados strong { display: block; font-size: 8pt; margin-bottom: 2px; }
    /* relatório de notas */
    .imp-sub { font-size: 9.5pt; margin: 0 0 8px; color: #222; }
    .imp-tabela { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
    .imp-tabela th, .imp-tabela td { border: 1px solid #999; padding: 3px 5px; }
    .imp-tabela th { background: #eef3ef !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 8pt; }
    .imp-tabela td.n, .imp-tabela th.n { text-align: center; white-space: nowrap; }
    .imp-tabela tr { break-inside: avoid; }
    .imp-tabela td.forte { font-weight: 700; }
    .imp-rodape { margin-top: 8px; font-size: 8.5pt; color: #333; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="tela-login" class="escondido">
  <form class="cartao-login" id="form-login">
    <div class="marca">Sistema ITA-IME<small>Turmas ITA-IME · uso interno da equipe</small></div>
    <div class="abas">
      <button type="button" class="ativa" data-aba="entrar">Entrar</button>
      <button type="button" data-aba="criar">Primeiro acesso</button>
    </div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" minlength="8" required>
    <button class="botao cheio" id="botao-login" type="submit">Entrar</button>
    <button type="button" class="link" id="esqueci">Esqueci minha senha</button>
    <div id="msg-login" class="aviso escondido"></div>
  </form>
</section>

<!-- ================= SISTEMA ================= -->
<section id="tela-sistema" class="escondido">
  <header>
    <div class="topo">
      <div class="marca" style="font-size:18px">ITA-IME</div>
      <nav>
        <button data-pagina="turmas" class="ativa">Turmas</button>
        <button data-pagina="notas">Notas</button>
        <button data-pagina="busca">Buscar aluno</button>
        <button data-pagina="professores" id="nav-professores" class="escondido">Professores</button>
        <button data-pagina="equipe" id="nav-equipe" class="escondido">Equipe</button>
      </nav>
      <div class="usuario"><strong id="nome-usuario"></strong><span id="papel-usuario"></span></div>
      <button class="botao leve" id="sair">Sair</button>
    </div>
  </header>
  <main id="conteudo"></main>
</section>

<!-- ================= LANÇAMENTO PÚBLICO (professores, sem login) ================= -->
<section id="tela-publica" class="escondido">
  <header><div class="topo"><div class="marca" style="font-size:18px">ITA-IME</div><div style="flex:1"></div><span class="usuario">Lançamento de notas</span></div></header>
  <main id="conteudo-publico"></main>
</section>

<!-- ================= CARÔMETRO PARA IMPRESSÃO (só aparece no papel) ================= -->
<section id="impressao"></section>

<!-- ================= FICHA (janela) ================= -->
<div id="fundo-ficha" class="fundo-modal escondido"><div class="modal" id="ficha"></div></div>

<script>
// =====================================================================
// CONFIGURAÇÃO — endereço do projeto no Supabase e a chave PÚBLICA.
// A chave pública pode ficar aqui: quem protege os dados são as regras
// (Row Level Security) do banco. NUNCA coloque aqui a chave "secret".
// =====================================================================
const SUPABASE_URL = 'https://xryueflxtsmphqevdoir.supabase.co';
const SUPABASE_CHAVE_PUBLICA = 'sb_publishable_tMp35-YZV9F0KmQnd_DVQg_P2tHLJGU';
const ANO_LETIVO = 2026;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_CHAVE_PUBLICA);

// Estado do sistema (o que já foi carregado)
const estado = { papel: null, nome: '', turmas: [], matriculas: [], alunos: new Map(), fotos: new Map(), visao: 'carometro' };
const NOMES_PAPEL = { admin: 'Administrador', coordenacao: 'Coordenação', professor: 'Professor', consulta: 'Consulta', pendente: 'Sem acesso' };

// ---------- utilidades ----------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iniciais = (nome) => nome.split(' ').filter(p => p.length > 2).slice(0, 2).map(p => p[0]).join('');
const telefone = (t) => !t ? '' : t.length === 11 ? `(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}` : t.length === 10 ? `(${t.slice(0,2)}) ${t.slice(2,6)}-${t.slice(6)}` : t;
const cpf = (c) => c && c.length === 11 ? `${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}` : (c || '');
const cep = (c) => c && c.length === 8 ? `${c.slice(0,5)}-${c.slice(5)}` : (c || '');
const data = (d) => d ? d.split('-').reverse().join('/') : '';
const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const veTudo = () => ['admin', 'coordenacao'].includes(estado.papel);

function mostrar(idTela) {
  ['#tela-login', '#tela-sistema', '#tela-publica'].forEach(t => $(t).classList.toggle('escondido', t !== idTela));
}
function mensagem(texto, erro = false) {
  const m = $('#msg-login');
  m.textContent = texto; m.classList.toggle('erro', erro); m.classList.remove('escondido');
}

// =====================================================================
// LOGIN
// =====================================================================
// Modos da tela de login: entrar | criar (primeiro acesso) | recuperar (esqueci) | nova (definir nova senha)
let modoLogin = 'entrar';
const TEXTO_BOTAO = { entrar: 'Entrar', criar: 'Criar minha senha', recuperar: 'Enviar link de recuperação', nova: 'Salvar nova senha' };
function mudarModo(modo) {
  modoLogin = modo;
  document.querySelectorAll('.abas button').forEach(x => x.classList.toggle('ativa', x.dataset.aba === modo));
  $('#botao-login').textContent = TEXTO_BOTAO[modo];
  $('#senha').autocomplete = modo === 'entrar' ? 'current-password' : 'new-password';
  // no modo "recuperar" só o e-mail aparece; no modo "nova" só a senha
  $('#senha').closest('form').querySelector('label[for=senha]').classList.toggle('escondido', modo === 'recuperar');
  $('#senha').classList.toggle('escondido', modo === 'recuperar');
  $('#senha').required = modo !== 'recuperar';
  $('label[for=email]').classList.toggle('escondido', modo === 'nova');
  $('#email').classList.toggle('escondido', modo === 'nova');
  $('#email').required = modo !== 'nova';
  $('label[for=senha]').textContent = modo === 'nova' ? 'Nova senha (mínimo 8 caracteres)' : 'Senha';
  $('#esqueci').textContent = modo === 'recuperar' ? 'Voltar para entrar' : 'Esqueci minha senha';
  $('#msg-login').classList.add('escondido');
}
document.querySelectorAll('.abas button').forEach(b => b.onclick = () => mudarModo(b.dataset.aba));
$('#esqueci').onclick = () => mudarModo(modoLogin === 'recuperar' ? 'entrar' : 'recuperar');

// Quando a pessoa chega pelo link do e-mail de recuperação, o Supabase avisa com este evento
db.auth.onAuthStateChange((evento) => {
  if (evento === 'PASSWORD_RECOVERY') {
    mostrar('#tela-login'); mudarModo('nova');
    mensagem('Digite a sua nova senha.');
  }
});

$('#form-login').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase();
  const password = $('#senha').value;
  $('#botao-login').disabled = true;
  try {
    if (modoLogin === 'recuperar') {
      if (location.protocol === 'file:') {
        mensagem('A recuperação de senha funciona na versão online do sistema. Por enquanto, peça ajuda ao administrador.', true);
        return;
      }
      const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) throw error;
      mensagem('Se este e-mail estiver cadastrado, você vai receber um link para criar uma nova senha. Veja também a caixa de spam.');
      return;
    }
    if (modoLogin === 'nova') {
      const { error } = await db.auth.updateUser({ password });
      if (error) throw error;
      history.replaceState(null, '', location.pathname);
      mudarModo('entrar');
      return iniciar();
    }
    if (modoLogin === 'criar') {
      const { data: r, error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      if (r.session) return iniciar();
      mensagem('Pronto! Enviamos um e-mail de confirmação. Clique no link do e-mail e depois volte aqui e use "Entrar".');
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await iniciar();
    }
  } catch (err) {
    const t = String(err.message || err);
    mensagem(
      /Invalid login/i.test(t) ? 'E-mail ou senha incorretos.' :
      /not confirmed/i.test(t) ? 'Seu e-mail ainda não foi confirmado. Procure o e-mail de confirmação (veja também o spam).' :
      /already registered/i.test(t) ? 'Este e-mail já tem senha. Use a aba "Entrar".' :
      /at least|password/i.test(t) ? 'A senha precisa ter pelo menos 8 caracteres.' :
      /rate limit/i.test(t) ? 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.' :
      'Não foi possível entrar: ' + t, true);
  } finally {
    $('#botao-login').disabled = false;
  }
};

$('#sair').onclick = async () => { await db.auth.signOut(); location.reload(); };

// =====================================================================
// INÍCIO: descobre o papel e carrega os dados
// =====================================================================
async function iniciar() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { mostrar('#tela-login'); return; }

  const { data: papel } = await db.rpc('meu_papel');
  const { data: eu } = await db.from('equipe').select('nome').eq('email', session.user.email).maybeSingle();
  estado.papel = papel;
  estado.nome = eu?.nome || session.user.email;

  if (!papel || papel === 'pendente') {
    mostrar('#tela-login');
    mensagem(`Você entrou como ${session.user.email}, mas seu acesso ainda não foi liberado. Peça ao administrador (Wallison).`, true);
    await db.auth.signOut();
    return;
  }

  $('#nome-usuario').textContent = estado.nome;
  $('#papel-usuario').textContent = NOMES_PAPEL[papel];
  $('#nav-equipe').classList.toggle('escondido', papel !== 'admin');
  $('#nav-professores').classList.toggle('escondido', !veTudo());
  mostrar('#tela-sistema');
  $('#conteudo').innerHTML = '<div class="carregando">Carregando turmas…</div>';

  const [t, m, a] = await Promise.all([
    db.from('turmas').select('*').order('id'),
    db.from('matriculas').select('aluno_id, turma_id, ordem, situacao, data_saida, motivo_saida').eq('ano_letivo', ANO_LETIVO),
    db.from('alunos_basico').select('*').order('nome'),
  ]);
  const erro = t.error || m.error || a.error;
  if (erro) { $('#conteudo').innerHTML = `<div class="aviso erro">Erro ao carregar: ${esc(erro.message)}</div>`; return; }
  estado.turmas = t.data;
  estado.matriculas = m.data;
  estado.alunos = new Map(a.data.map(x => [x.id, x]));
  irPara('turmas', undefined, 'replace');
}

// depois de mudar turma / desistente: recarrega as matrículas e redesenha a página aberta
async function recarregarMatriculas() {
  const { data } = await db.from('matriculas').select('aluno_id, turma_id, ordem, situacao, data_saida, motivo_saida').eq('ano_letivo', ANO_LETIVO);
  if (data) estado.matriculas = data;
  if (estado.pagina) irPara(estado.pagina[0], estado.pagina[1], 'nada');
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => irPara(b.dataset.pagina));
// cada tela fica guardada no histórico do navegador: o botão "Voltar" do navegador volta para a tela anterior do sistema
function irPara(pagina, extra, modo) {
  const mesma = estado.pagina && estado.pagina[0] === pagina && estado.pagina[1] === extra;
  modo = modo || (mesma ? 'replace' : 'push');
  try {
    if (modo === 'push') history.pushState({ pagina, extra }, '');
    else if (modo === 'replace') history.replaceState({ pagina, extra }, '');
  } catch (e) { /* navegador sem histórico: segue normal */ }
  estado.pagina = [pagina, extra];
  const menu = { turma: 'turmas', ciclo: 'notas', planilha: 'notas' }[pagina] || pagina;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('ativa', b.dataset.pagina === menu));
  ({ turmas: paginaTurmas, turma: paginaTurma, busca: paginaBusca, equipe: paginaEquipe,
     notas: paginaNotas, ciclo: paginaCiclo, planilha: paginaPlanilha, professores: paginaProfessores })[pagina](extra);
}

window.addEventListener('popstate', (e) => {
  if (!e.state || !e.state.pagina || !estado.turmas.length) return;
  fecharFicha();
  irPara(e.state.pagina, e.state.extra, 'nada');
});

// =====================================================================
// FOTOS: ficam num espaço privado; pedimos links temporários (1 hora)
// =====================================================================
async function carregarFotos(ids) {
  const faltando = ids.map(id => estado.alunos.get(id)).filter(a => a?.foto && !estado.fotos.has(a.id));
  if (!faltando.length) return;
  const caminhos = faltando.map(a => a.foto.replace(/^fotos\//, ''));
  const { data } = await db.storage.from('fotos').createSignedUrls(caminhos, 3600);
  (data || []).forEach((r, i) => estado.fotos.set(faltando[i].id, r.signedUrl || null));
}
// se a foto ainda não foi enviada ao Supabase, mostra as iniciais
function semFoto(img) {
  const d = document.createElement('div'); d.className = 'sem-foto'; d.textContent = img.dataset.ini; img.replaceWith(d);
}
function htmlFoto(aluno, preguicoso = true) {
  const url = estado.fotos.get(aluno.id);
  return url
    ? `<img class="foto" src="${esc(url)}" alt="" ${preguicoso ? 'loading="lazy"' : ''} data-ini="${esc(iniciais(aluno.nome))}" onerror="semFoto(this)">`
    : `<div class="sem-foto">${esc(iniciais(aluno.nome))}</div>`;
}

// =====================================================================
function paginaTurmas() {
  const cont = (id) => estado.matriculas.filter(m => m.turma_id === id && m.situacao === 'ativo').length;
  const ativos = estado.matriculas.filter(m => m.situacao === 'ativo').length;
  const desistentes = estado.matriculas.filter(m => m.situacao === 'desistente')
    .map(m => ({ m, a: estado.alunos.get(m.aluno_id) })).filter(x => x.a).sort((x, y) => x.a.nome.localeCompare(y.a.nome));
  $('#conteudo').innerHTML = `
    <div class="barra"><h1>Turmas ${ANO_LETIVO}</h1><div class="espaco"></div>
      ${veTudo() ? `<button class="botao leve" id="importar-alunos">Importar alunos (Excel)</button>
      <button class="botao" id="novo-aluno">+ Novo aluno</button>` : ''}</div>
    <p class="subtitulo">${ativos} alunos matriculados. Clique numa turma para ver o carômetro.</p>
    <div class="grade-turmas">
      ${estado.turmas.map(t => `
        <button class="turma ${cont(t.id) ? '' : 'vazia'}" data-turma="${t.id}">
          <div class="nome">${esc(t.nome)}</div>
          <div class="qtd">${cont(t.id)}<span>${cont(t.id) ? 'alunos' : 'sem alunos ainda'}</span></div>
        </button>`).join('')}
    </div>
    ${desistentes.length ? `<h2 style="margin-top:32px">Desistentes (${desistentes.length})</h2>
      <p class="subtitulo">Saíram das turmas, mas o cadastro e as notas continuam guardados. Clique para ver a ficha, reativar ou apagar.</p>
      <div class="lista-desistentes">${desistentes.map(({ m, a }) => `
        <button class="botao leve" data-aluno="${a.id}"><strong>${esc(a.nome)}</strong>&nbsp;·&nbsp;${esc(nomeTurma(m.turma_id))}${m.data_saida ? ` · desde ${esc(data(m.data_saida))}` : ''}</button>`).join('')}
      </div>` : ''}`;
  document.querySelectorAll('[data-turma]').forEach(b => b.onclick = () => irPara('turma', Number(b.dataset.turma)));
  document.querySelectorAll('.lista-desistentes [data-aluno]').forEach(b => b.onclick = () => abrirFicha(Number(b.dataset.aluno)));
  if ($('#novo-aluno')) $('#novo-aluno').onclick = () => novoAluno();
  if ($('#importar-alunos')) $('#importar-alunos').onclick = importarAlunos;
}

async function paginaTurma(turmaId) {
  const turma = estado.turmas.find(t => t.id === turmaId);
  const lista = estado.matriculas
    .filter(m => m.turma_id === turmaId && m.situacao === 'ativo')
    .sort((a, b) => (a.ordem ?? 999) - (b.ordem ?? 999))
    .map(m => estado.alunos.get(m.aluno_id)).filter(Boolean);
  $('#conteudo').innerHTML = `<div class="carregando">Carregando fotos…</div>`;
  await carregarFotos(lista.map(a => a.id));

  $('#conteudo').innerHTML = `
    <div class="barra">
      <button class="botao leve" id="voltar">← Turmas</button>
      <div><h1>${esc(turma.nome)}</h1></div>
      <div class="espaco"></div>
      <input type="search" id="filtro" placeholder="Filtrar por nome">
      <div class="alternar">
        <button data-visao="carometro" class="${estado.visao === 'carometro' ? 'ativa' : ''}">Carômetro</button>
        <button data-visao="lista" class="${estado.visao === 'lista' ? 'ativa' : ''}">Lista</button>
      </div>
      <button class="botao leve" id="imprimir">Imprimir</button>
      ${veTudo() ? '<button class="botao" id="novo-aluno">+ Novo aluno</button>' : ''}
    </div>
    <div id="alunos-turma"></div>`;
  if ($('#novo-aluno')) $('#novo-aluno').onclick = () => novoAluno(turmaId);
  $('#voltar').onclick = () => irPara('turmas');
  $('#imprimir').onclick = () => imprimirCarometro(turma, lista);
  document.querySelectorAll('[data-visao]').forEach(b => b.onclick = () => { estado.visao = b.dataset.visao; paginaTurma(turmaId); });
  const desenhar = () => {
    const f = semAcento($('#filtro').value.trim());
    desenharAlunos(lista.filter(a => !f || semAcento(a.nome).includes(f)), '#alunos-turma');
  };
  $('#filtro').oninput = desenhar;
  desenhar();
}

// Monta a folha do carômetro (foto, nome, nascimento e telefone) e abre a janela de impressão
function imprimirCarometro(turma, lista) {
  const hoje = new Date().toLocaleDateString('pt-BR');
  $('#impressao').innerHTML = `
    <div class="imp-topo"><h1>TURMA ITA-IME · ${esc(turma.nome.toUpperCase())}</h1>
      <span>${lista.length} alunos · ano letivo ${ANO_LETIVO} · impresso em ${hoje}</span></div>
    <div class="imp-grade">${lista.map(a => `
      <div class="imp-aluno">${htmlFoto(a, false)}
        <div class="imp-dados"><strong>${esc(a.nome)}</strong>
          Nasc.: ${esc(data(a.data_nascimento)) || '—'}<br>
          Tel.: ${esc(telefone(a.telefone)) || '—'}
        </div>
      </div>`).join('')}</div>`;
  // espera as fotos carregarem antes de abrir a impressão
  const imgs = [...document.querySelectorAll('#impressao img')];
  const carregadas = Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); })));
  const limite = new Promise(r => setTimeout(r, 4000)); // no máximo 4 segundos de espera
  Promise.race([carregadas, limite]).then(() => window.print());
}

function desenharAlunos(alunos, onde, mostrarTurma = false) {
  const turmaDe = (id) => {
    const m = estado.matriculas.find(m => m.aluno_id === id);
    const nome = estado.turmas.find(t => t.id === m?.turma_id)?.nome || '';
    return m?.situacao === 'desistente' ? `Desistente (era ${nome})` : nome;
  };
  if (!alunos.length) { $(onde).innerHTML = '<p class="subtitulo">Nenhum aluno encontrado.</p>'; return; }
  $(onde).innerHTML = estado.visao === 'carometro'
    ? `<div class="carometro">${alunos.map(a => `
        <button class="pessoa" data-aluno="${a.id}">${htmlFoto(a)}
          <div class="legenda">${esc(a.nome)}${mostrarTurma ? `<span>${esc(turmaDe(a.id))}</span>` : ''}</div>
        </button>`).join('')}</div>`
    : `<table><thead><tr><th>Nome</th>${mostrarTurma ? '<th>Turma</th>' : ''}<th>Telefone</th><th>E-mail</th></tr></thead><tbody>
        ${alunos.map(a => `<tr class="clicavel" data-aluno="${a.id}"><td>${esc(a.nome)}</td>${mostrarTurma ? `<td>${esc(turmaDe(a.id))}</td>` : ''}
          <td>${esc(telefone(a.telefone))}</td><td>${esc(a.email || '')}</td></tr>`).join('')}
       </tbody></table>`;
  document.querySelectorAll(`${onde} [data-aluno]`).forEach(el => el.onclick = () => abrirFicha(Number(el.dataset.aluno)));
}

function paginaBusca() {
  $('#conteudo').innerHTML = `
    <h1>Buscar aluno</h1>
    <p class="subtitulo">Digite parte do nome. Acentos não importam.</p>
    <div class="barra"><input type="search" id="busca" placeholder="Ex.: joao eduardo" autofocus></div>
    <div id="resultado"></div>`;
  const todos = [...estado.alunos.values()];
  $('#busca').oninput = async () => {
    const f = semAcento($('#busca').value.trim());
    if (f.length < 2) { $('#resultado').innerHTML = ''; return; }
    const achados = todos.filter(a => semAcento(a.nome).includes(f)).slice(0, 60);
    await carregarFotos(achados.map(a => a.id));
    desenharAlunos(achados, '#resultado', true);
  };
}

// ---------- Ficha do aluno ----------
async function abrirFicha(id) {
  const basico = estado.alunos.get(id);
  const matricula = estado.matriculas.find(m => m.aluno_id === id);
  const turma = estado.turmas.find(t => t.id === matricula?.turma_id);
  const desistente = matricula?.situacao === 'desistente';
  const campo = (rotulo, valor) => `<div class="campo"><small>${rotulo}</small><div>${valor ? esc(valor) : '<span class="vazio">não informado</span>'}</div></div>`;
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').innerHTML = '<div class="carregando">Carregando ficha…</div>';

  let completo = null, responsaveis = [], pendencias = [];
  if (veTudo()) {
    const [a, r, p] = await Promise.all([
      db.from('alunos').select('*').eq('id', id).single(),
      db.from('aluno_responsavel').select('responsaveis(*)').eq('aluno_id', id),
      db.from('pendencias').select('campo, problema, valor').eq('aluno_id', id).eq('resolvida', false),
    ]);
    completo = a.data; responsaveis = (r.data || []).map(x => x.responsaveis).filter(Boolean); pendencias = p.data || [];
  }
  const a = completo || basico;
  // notas em qualquer turma (continuam aparecendo depois de mudar de turma ou desistir)
  const [{ data: notasAluno }, { data: movs }] = await Promise.all([
    db.from('historico_notas').select('ciclo_id, ciclo, nm, materia, turma_id, nota_real, nota_multiplicada').eq('aluno_id', id).order('ciclo_id').order('nm'),
    db.from('movimentacoes').select('*').eq('aluno_id', id).order('feito_em'),
  ]);
  const textoMov = (x) => ({
    mudou_turma: `Mudou da ${esc(nomeTurma(x.de_turma))} para a ${esc(nomeTurma(x.para_turma))}`,
    desistente: `Marcado como desistente (estava na ${esc(nomeTurma(x.de_turma))})`,
    reativado: `Reativado na ${esc(nomeTurma(x.para_turma))}`,
    matriculado: `Matriculado na ${esc(nomeTurma(x.para_turma))}`,
  })[x.tipo] + (x.motivo ? ` — ${esc(x.motivo)}` : '');
  const opcoesTurma = (marcada) => estado.turmas.map(t => `<option value="${t.id}" ${t.id === marcada ? 'selected' : ''}>${esc(t.nome)}</option>`).join('');
  // data de hoje no fuso do computador (toISOString daria a data em UTC, que vira o dia às 21h)
  const hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const matriculaHtml = !matricula ? '' : `
    <div class="secao"><h3>Matrícula ${ANO_LETIVO}</h3>
      ${desistente ? `
        <div class="pendencia"><strong>Desistente</strong>${matricula.data_saida ? ` desde ${esc(data(matricula.data_saida))}` : ''}${matricula.motivo_saida ? ` — ${esc(matricula.motivo_saida)}` : ''}.
          Saiu da ${esc(turma?.nome || '')}; cadastro e notas continuam guardados.</div>
        ${veTudo() ? `<div class="linha-acao"><select id="reativar-turma">${opcoesTurma(matricula.turma_id)}</select>
          <button class="botao" id="reativar">Reativar nesta turma</button></div>` : ''}
        ${estado.papel === 'admin' ? `<div class="linha-acao" style="margin-top:14px">
          <button class="botao leve" id="apagar">Apagar aluno definitivamente…</button></div>
          <div id="confirmar-apagar" class="escondido"><div class="aviso erro" style="margin-top:10px">Isso apaga <strong>${esc(a.nome)}</strong>,
            todas as notas, a matrícula e o histórico. <strong>Não dá para desfazer.</strong></div>
            <div class="linha-acao"><button class="botao perigo" id="apagar-sim">Sim, apagar para sempre</button>
            <button class="botao leve" id="apagar-nao">Cancelar</button></div></div>` : ''}`
      : `<div>Turma atual: <strong>${esc(turma?.nome || '')}</strong></div>
        ${veTudo() ? `
          <div class="linha-acao"><button class="botao leve" id="abrir-desistente">Marcar como desistente…</button></div>
          <div id="form-desistente" class="escondido">
            <div class="linha-acao"><input type="date" id="data-saida" value="${hoje}">
              <input type="text" id="motivo-saida" placeholder="Motivo (opcional)">
              <button class="botao perigo" id="confirmar-desistente">Confirmar desistência</button>
              <button class="botao leve" id="cancelar-desistente">Cancelar</button></div>
            <p class="subtitulo" style="margin:6px 0 0">O aluno sai da turma e das planilhas. As notas e o cadastro ficam guardados; dá para reativar depois.</p>
          </div>` : ''}`}
      <div id="msg-matricula" class="aviso erro escondido"></div>
      ${(movs || []).length ? `<div style="margin-top:14px">${movs.map(x => `<div class="mov">${textoMov(x)}
        <br><small>${esc(data(x.data))}${x.feito_por ? ` · por ${esc(x.feito_por)}` : ''}</small></div>`).join('')}</div>` : ''}
    </div>`;
  const topo = (extra = '') => `
    <div class="modal-topo">
      ${htmlFoto(basico)}
      <div><h2>${esc(a.nome)}</h2><span class="etiqueta">${desistente ? 'Desistente · era da ' : ''}${esc(turma?.nome || '')}</span>${extra}</div>
      <button class="fechar" aria-label="Fechar">×</button>
    </div>`;
  $('#ficha').innerHTML = `
    ${topo(`<div class="acoes-ficha"><button class="botao" id="ver-boletim">Boletim</button>
      ${veTudo() ? '<button class="botao leve" id="editar-aluno">Editar</button>' : ''}</div>`)}
    ${matriculaHtml}
    <div class="secao"><h3>Contato</h3><div class="campos">
      ${campo('Telefone', telefone(a.telefone))}${campo('E-mail', a.email)}
      ${a.data_nascimento !== undefined ? campo('Data de nascimento', data(a.data_nascimento)) : ''}
    </div></div>
    ${completo ? `
      <div class="secao"><h3>Documentos e endereço</h3><div class="campos">
        ${campo('RG', a.rg)}${campo('CPF', cpf(a.cpf))}
        ${campo('Endereço', a.endereco)}${campo('Bairro', a.bairro)}${campo('CEP', cep(a.cep))}${campo('Cidade', a.cidade)}
      </div></div>
      ${responsaveis.map(r => `
        <div class="secao"><h3>Responsável</h3><div class="campos">
          ${campo('Nome', r.nome)}${campo('Telefone', telefone(r.telefone))}
          ${campo('Endereço', r.endereco)}${campo('Bairro', r.bairro)}${campo('CEP', cep(r.cep))}
        </div></div>`).join('')}
      ${pendencias.length ? `<div class="secao"><h3>Pendências no cadastro</h3>
        ${pendencias.map(p => `<div class="pendencia">${esc(p.problema)}${p.valor ? ` — <em>${esc(p.valor)}</em>` : ''}</div>`).join('')}</div>` : ''}
      ${a.observacao ? `<div class="secao"><h3>Observação</h3><div>${esc(a.observacao)}</div></div>` : ''}
    ` : `<div class="secao"><p class="subtitulo" style="margin:0">Documentos, endereço e responsável ficam visíveis só para a coordenação.</p></div>`}`;
  $('#ficha .fechar').onclick = fecharFicha;
  $('#ver-boletim').onclick = () => mostrarBoletim(a, notasAluno || [], topo, id);
  if ($('#editar-aluno')) $('#editar-aluno').onclick = () => mostrarEdicao(id, a, responsaveis, matricula, topo);

  // ----- ações da matrícula -----
  const acao = async (botao, chamada) => {
    botao.disabled = true;
    const { error } = await chamada();
    if (error) {
      botao.disabled = false;
      $('#msg-matricula').textContent = 'Não foi possível: ' + error.message; $('#msg-matricula').classList.remove('escondido');
      return false;
    }
    return true;
  };

// Boletim: um quadro por ciclo, matérias nas linhas e NM1/NM2/NM3 nas colunas
function montarBoletim(notas) {
  const ciclos = [];
  for (const n of notas) {
    let c = ciclos.find(x => x.id === n.ciclo_id);
    if (!c) ciclos.push(c = { id: n.ciclo_id, nome: n.ciclo, linhas: new Map(), nms: new Set() });
    c.nms.add(n.nm);
    const chave = n.materia;
    if (!c.linhas.has(chave)) c.linhas.set(chave, { materia: n.materia, turmas: new Set(), nm: {} });
    const l = c.linhas.get(chave); l.turmas.add(n.turma_id); l.nm[n.nm] = n;
  }
  ciclos.forEach(c => { c.nms = [...c.nms].sort(); c.linhas = [...c.linhas.values()].sort((x, y) => x.materia.localeCompare(y.materia, 'pt-BR')); });
  return ciclos;
}
function mostrarBoletim(a, notas, topo, id) {
  const ciclos = montarBoletim(notas.filter(n => n.nota_real != null || n.nota_multiplicada != null));
  const celula = (n) => !n || n.nota_multiplicada == null ? '—'
    : `<strong>${fmt(n.nota_multiplicada)}</strong>${n.nota_real != null && Number(n.nota_real) !== Number(n.nota_multiplicada) ? `<small>real ${fmt(n.nota_real)}</small>` : ''}`;
  $('#ficha').innerHTML = `
    ${topo()}
    <div class="secao"><h3>Boletim</h3>
      ${!ciclos.length ? '<p class="subtitulo" style="margin:0">Ainda não há notas lançadas para este aluno.</p>' : ciclos.map(c => `
        <h4 style="margin:14px 0 8px">${esc(c.nome)}</h4>
        <div class="rolavel"><table class="boletim">
          <thead><tr><th>Matéria</th>${c.nms.map(nm => `<th class="num">${nm}</th>`).join('')}</tr></thead>
          <tbody>${c.linhas.map(l => `<tr><td>${esc(l.materia)}${l.turmas.size > 1 || ![...l.turmas].includes(estado.matriculas.find(m => m.aluno_id === id)?.turma_id)
              ? `<br><small class="vazio">${[...l.turmas].map(t => esc(nomeTurma(t))).join(', ')}</small>` : ''}</td>
            ${c.nms.map(nm => `<td class="num">${celula(l.nm[nm])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>`).join('')}
      <p class="subtitulo" style="margin:12px 0 0">Nota em destaque = nota final (com multiplicador, no máximo 10). Quando é diferente, a nota real aparece embaixo.</p>
    </div>
    <div class="rodape-ficha">
      ${ciclos.length ? '<button class="botao leve" id="imprimir-boletim">Imprimir boletim</button>' : ''}
      <button class="botao" id="voltar-ficha">Voltar à ficha</button>

    $('#impressao').innerHTML = `<div class="imp-boletim">

      ${ciclos.map(c => `<h2>${esc(c.nome)}</h2>
        <table class="imp-tabela"><thead><tr><th>Matéria</th>${c.nms.map(nm => `<th class="n">${nm}</th>`).join('')}</tr></thead>
        <tbody>${c.linhas.map(l => `<tr><td>${esc(l.materia)}</td>${c.nms.map(nm => {
          const n = l.nm[nm]; return `<td class="n">${!n || n.nota_multiplicada == null ? '—' : `<strong>${fmt(n.nota_multiplicada)}</strong>${n.nota_real != null && Number(n.nota_real) !== Number(n.nota_multiplicada) ? ` <small>(real ${fmt(n.nota_real)})</small>` : ''}`}</td>`;
        }).join('')}</tr>`).join('')}</tbody></table>`).join('')}
      <p class="imp-rodape">Nota final com multiplicador (no máximo 10); entre parênteses, a nota real quando diferente.</p></div>`;
    setTimeout(() => window.print(), 100);
  };
}

// ---------- Fotos: reduz no próprio navegador e envia para o espaço de fotos ----------
const nomeArquivo = (nome) => semAcento(nome).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
async function reduzirFoto(arquivo, lado = 800) {
  const img = await createImageBitmap(arquivo);
  const escala = Math.min(1, lado / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
}
// devolve null se deu certo, ou o texto do problema
async function enviarFoto(alunoId, nome, arquivo) {
  let blob;
  try { blob = await reduzirFoto(arquivo); }
  catch { return `Não consegui abrir a foto "${arquivo.name}". Use uma foto JPG ou PNG.`; }
  const caminho = `${nomeArquivo(nome)}_${alunoId}.jpg`;
  const { error } = await db.storage.from('fotos').upload(caminho, blob, { upsert: true, contentType: 'image/jpeg' });
  if (error) return 'O cadastro foi salvo, mas a foto não foi enviada: ' + error.message;
  const { error: e2 } = await db.from('alunos').update({ foto: 'fotos/' + caminho }).eq('id', alunoId);
  if (e2) return 'A foto foi enviada, mas não consegui ligá-la ao aluno: ' + e2.message;
  estado.fotos.delete(alunoId);
  const b = estado.alunos.get(alunoId); if (b) b.foto = 'fotos/' + caminho;
  await carregarFotos([alunoId]);
  return null;
}

// ---------- Cadastro pela planilha (Excel) ----------
const COLUNAS_ALUNOS = ['NOME', 'TURMA', 'DATA DE NASCIMENTO', 'TELEFONE', 'EMAIL', 'RG', 'CPF', 'ENDEREÇO', 'BAIRRO', 'CEP', 'CIDADE',
  'RESPONSÁVEL', 'TELEFONE DO RESPONSÁVEL', 'OBSERVAÇÃO', 'FOTO'];
const chaveTurma = (t) => semAcento(String(t || '')).replace(/SERIE|ANO/g, '').replace(/[^A-Z0-9]/g, '');
function dataDaPlanilha(v) {
  if (v === '' || v == null) return { ok: '' };
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  if (v instanceof Date && !isNaN(v)) return { ok: iso(new Date(v.getTime() + 12 * 3600000)) };
  if (typeof v === 'number') return { ok: iso(new Date(Math.round((v - 25569) * 86400000) + 12 * 3600000)) };
  const t = String(v).trim();
  let m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) { const ano = m[3].length === 2 ? (Number(m[3]) > 30 ? '19' : '20') + m[3] : m[3];
    return { ok: `${ano}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` }; }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { ok: `${m[1]}-${m[2]}-${m[3]}` };
  return { erro: `data de nascimento "${t}" não reconhecida (use dd/mm/aaaa)` };
}
function dataDaPlanilhaValida(v) {
  const r = dataDaPlanilha(v);
  if (!r.ok) return r;
  const [a, m, d] = r.ok.split('-').map(Number), dt = new Date(a, m - 1, d);
  if (dt.getFullYear() !== a || dt.getMonth() !== m - 1 || dt.getDate() !== d || a < 1950 || a > new Date().getFullYear())
    return { erro: `data de nascimento "${String(v).trim()}" não existe (use dd/mm/aaaa)` };
  return r;
}

      // aceita os títulos com ou sem acento / maiúsculas

          o[certo] = v;

// Se a pessoa veio pelo link de recuperação de senha, não entra direto: primeiro define a nova senha
// =====================================================================
// NOTAS — ciclos, planilhas dos professores e cálculo
// =====================================================================
const MATERIAS = ['Matemática', 'Física', 'Química', 'Inglês', 'Linguagens'];
const EXATAS = ['Matemática', 'Física', 'Química'];
const NMS = { NM1: 'NM1 · ITA', NM2: 'NM2 · Provão + Qualitativa', NM3: 'NM3 · IME' };
const MULT = { NM1: 1.5, NM2: 1, NM3: 1.5 };
const TURMAS_NOTAS = [1, 2, 3, 4]; // 1ª A, 1ª B, 2ª A, 2ª B (3ª série e Cursinho entram depois)

const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const nomeTurma = (id) => estado.turmas.find(t => t.id === id)?.nome || '';
const codigoTurma = (txt) => semAcento(txt || '').replace(/SERIE/g, '').replace(/[^0-9A-Z]/g, '');
const linkPublico = (token) => location.origin + location.pathname + '#lancar-' + token;
const erroNaTela = (e) => { $('#conteudo').innerHTML = `<div class="aviso erro">Erro: ${esc(e.message || e)}</div>`; };

// Lê o que foi digitado: aceita vírgula ou ponto. Vazio = apagar. NaN = inválido.
function lerNota(txt) {
  const t = String(txt).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  const n = Number(t);
  return n >= 0 && n <= 10 ? Math.round(n * 100) / 100 : NaN;
}

// Liga as caixas de nota: valida, salva ao sair da caixa e mostra verde (salvo) ou vermelho (erro)
function ligarNotas(container, salvar, aoSalvar) {
  container.querySelectorAll('input.nota').forEach(inp => {
    inp.onchange = async () => {
      const v = lerNota(inp.value);
      inp.classList.remove('salvo', 'invalido');
      if (Number.isNaN(v)) { inp.classList.add('invalido'); inp.title = 'Digite um número de 0 a 10 (ex.: 1,5)'; alertaNotas(`"${inp.value}" não é uma nota válida. Digite um número de 0 a 10 (ex.: 1,5).`); return; }
      inp.disabled = true;
      const { error } = await salvar(inp.dataset, v);
      inp.disabled = false;
      if (error) { inp.classList.add('invalido'); inp.title = error.message; alertaNotas(error.message); return; }
      inp.value = v == null ? '' : String(v).replace('.', ',');
      inp.classList.add('salvo'); inp.title = 'Salvo';
      aoSalvar && aoSalvar(inp.dataset, v);
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); proximaCaixa(inp); } };
  });
}
// Enter desce para o próximo aluno na mesma coluna (como numa planilha)
function proximaCaixa(inp) {
  const col = inp.dataset.questao || 'segunda';
  const todas = [...inp.closest('table').querySelectorAll(`input.nota:not(:disabled)`)].filter(i => (i.dataset.questao || 'segunda') === col);
  const prox = todas[todas.indexOf(inp) + 1];
  inp.blur(); prox && prox.focus();
}
function alertaNotas(msg) {
  const a = document.querySelector('.alerta-notas');
  if (a) { a.textContent = msg; a.classList.remove('escondido'); setTimeout(() => a.classList.add('escondido'), 6000); }
}

// Calcula a linha de um aluno: soma das questões, 2ª chamada, nota real e com multiplicador
// aplica = false quando a coordenação desmarcou o multiplicador daquele aluno. A nota final nunca passa de 10.
// NM2 e Linguagens (NM1/NM3): nota real = média simples das colunas, só quando todas estão lançadas.
function calcularLinha(valores, segunda, nm, aplica = true, materia = '') {
  const presentes = valores.filter(v => v != null);
  const soma = presentes.length ? Math.round(presentes.reduce((a, b) => a + b, 0) * 100) / 100 : null;
  const media = valores.length && presentes.length === valores.length ? Math.round(soma / valores.length * 100) / 100 : null;
  const real = segunda != null ? segunda : (nm === 'NM2' || materia === 'Linguagens' ? media : soma);
  const final = real == null ? null : Math.min(10, Math.round(real * (aplica ? MULT[nm] : 1) * 100) / 100);
  return { soma, real, final };
}

async function paginaCiclo(cicloId) {
  $('#conteudo').innerHTML = '<div class="carregando">Carregando ciclo…</div>';
  const [{ data: ciclo, error: e1 }, { data: planilhas, error: e2 }, { data: linhas, error: e3 }] = await Promise.all([
    db.from('ciclos').select('*').eq('id', cicloId).single(),
    db.from('planilhas').select('*').eq('ciclo_id', cicloId),
    db.from('notas_planilha').select('planilha_id, nota_real').eq('ciclo_id', cicloId),
  ]);
  if (e1 || e2 || e3) return erroNaTela(e1 || e2 || e3);
  const { data: pends } = planilhas.length
    ? await db.from('pendencias_notas').select('planilha_id').in('planilha_id', planilhas.map(p => p.id))
    : { data: [] };
  const resumo = (pid) => {
    const l = linhas.filter(x => x.planilha_id === pid);
    return `${l.filter(x => x.nota_real != null).length} de ${l.length} com nota`;
  };
  const selo = (pid) => {
    const np = (pends || []).filter(x => x.planilha_id === pid).length;
    return np ? ` <span class="status vermelho">${np} ${np === 1 ? 'pendência' : 'pendências'}</span>` : '';
  };
  const celula = (nm, materia, turmaId) => {
    const doc = eDocumento(nm, materia);
    const p = planilhas.find(x => x.nm === nm && x.materia === materia && x.turma_id === turmaId);
    if (p) return `<td><button class="botao leve pequeno" data-planilha="${p.id}">${resumo(p.id)}</button>
      ${doc ? '<span class="status fechada">PDF</span>' : `${eMisto(nm, materia) ? '<span class="status fechada">PDF + redação</span> ' : ''}<span class="status ${p.aberta ? 'aberta' : 'fechada'}">${p.aberta ? 'aberta' : 'fechada'}</span>`}${selo(p.id)}</td>`;
    if (!veTudo()) return '<td class="pendente">não criada</td>';
    return doc
      ? `<td><button class="botao leve pequeno" data-importar="${nm}|${materia}|${turmaId}">Importar PDF</button></td>`
      : `<td><button class="botao pequeno" data-criar="${nm}|${materia}|${turmaId}">+ Criar planilha</button></td>`;
  };
  $('#conteudo').innerHTML = `
    <div class="barra"><button class="botao leve" id="voltar">← Ciclos</button><h1>${esc(ciclo.nome)}</h1></div>
    ${['NM1', 'NM2', 'NM3'].map(nm => `
      <h2>${NMS[nm]} <span class="etiqueta">${MULT[nm] === 1 ? 'mantém a nota' : '× ' + fmt(MULT[nm])}</span></h2>
      <div class="rolavel"><table>
        <thead><tr><th>Matéria</th>${TURMAS_NOTAS.map(t => `<th>${esc(nomeTurma(t))}</th>`).join('')}</tr></thead>
        <tbody>${MATERIAS.map(m => `<tr><td><strong>${m}</strong></td>${TURMAS_NOTAS.map(t => celula(nm, m, t)).join('')}</tr>`).join('')}</tbody>
      </table></div>`).join('')}`;
  $('#voltar').onclick = () => irPara('notas');
  document.querySelectorAll('[data-planilha]').forEach(b => b.onclick = () => irPara('planilha', Number(b.dataset.planilha)));
  document.querySelectorAll('[data-importar]').forEach(b => b.onclick = () => {
    const [nm, materia, turma] = b.dataset.importar.split('|');
    importarPdf(ciclo, nm, materia, Number(turma));
  });
  document.querySelectorAll('[data-criar]').forEach(b => b.onclick = () => {

// ---------- Criar planilha: escolher os professores ----------
async function criarPlanilha(ciclo, nm, materia, turmaId, planilhasDoCiclo) {
  $('#fundo-ficha').classList.remove('escondido');
  $('#ficha').innerHTML = '<div class="carregando">Carregando professores…</div>';
  const { data: profs } = await db.from('professores').select('*').eq('ativo', true).order('nome');
  // Sugestão: os mesmos professores da outra NM desta matéria/turma; senão, os cadastrados para a matéria e turma
  let sugestao = [];
  const irma = planilhasDoCiclo.find(p => p.materia === materia && p.turma_id === turmaId);
  if (irma) {
    const { data: q } = await db.from('questoes').select('professor, professor_email').eq('planilha_id', irma.id).order('numero');
    sugestao = (q || []).map(x => ({ nome: x.professor, email: x.professor_email || '' }));
  } else {
    const cod = codigoTurma(nomeTurma(turmaId));
    sugestao = (profs || []).filter(p => semAcento(p.materia || '') === semAcento(materia) && (!p.turmas || codigoTurma(p.turmas).includes(cod)))
      .map(p => ({ nome: p.nome, email: p.email || '' }));
  }
  sugestao = sugestao.filter(x => !/ \(PDF\)$/.test(x.nome));
  const misto = eMisto(nm, materia);
  if (misto) sugestao = sugestao.slice(0, 1);
  if (!sugestao.length) sugestao = [{ nome: '', email: '' }];

  const linha = (p) => `<div class="linha-prof">
      <input type="text" class="prof-nome" list="lista-profs" placeholder="Nome do professor" value="${esc(p.nome)}">
      <input type="email" class="prof-email" placeholder="E-mail (para o aviso)" value="${esc(p.email)}">
      <button type="button" class="botao leve pequeno remover" title="Remover">×</button></div>`;
  $('#ficha').innerHTML = `
    <div class="modal-topo"><div><h2>Nova planilha</h2>
      <span class="etiqueta">${esc(materia)} · ${nm} · ${esc(nomeTurma(turmaId))} · ${esc(ciclo.nome)}</span></div>
      <button class="fechar" aria-label="Fechar">×</button></div>
    <div class="secao">
      <h3>${misto ? 'Professor da Redação' : 'Professores (uma coluna/questão para cada um, na ordem)'}</h3>
      ${misto ? '<p class="subtitulo" style="margin-top:0">A planilha terá duas colunas: a nota do PDF da prova (você importa depois, dentro da planilha) e a Redação, lançada por este professor no link. Nota real = média das duas.</p>' : ''}
      <datalist id="lista-profs">${(profs || []).map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist>
      <div id="linhas-prof">${sugestao.map(linha).join('')}</div>
      ${misto ? '' : '<button type="button" class="botao leve pequeno" id="mais-prof">+ Adicionar professor</button>'}
    </div>
    <div class="secao"><button class="botao" id="gerar">Gerar planilha</button>
      <div id="msg-criar" class="aviso erro escondido"></div></div>`;
  $('#ficha .fechar').onclick = fecharFicha;
  const ligarLinhas = () => {
    document.querySelectorAll('.linha-prof .remover').forEach(b => b.onclick = () => b.parentElement.remove());
    document.querySelectorAll('.prof-nome').forEach(i => i.onchange = () => {
      const p = (profs || []).find(x => x.nome === i.value);
      const em = i.parentElement.querySelector('.prof-email');
      if (p && !em.value) em.value = p.email || '';
    });
  };
  ligarLinhas();
  if ($('#mais-prof')) $('#mais-prof').onclick = () => { $('#linhas-prof').insertAdjacentHTML('beforeend', linha({ nome: '', email: '' })); ligarLinhas(); };
  $('#gerar').onclick = async () => {
    const lista = [...document.querySelectorAll('.linha-prof')].map(l => ({
      nome: l.querySelector('.prof-nome').value.trim(), email: l.querySelector('.prof-email').value.trim().toLowerCase() || null,
    })).filter(x => x.nome);
    const msg = $('#msg-criar');
    if (!lista.length) { msg.textContent = 'Adicione pelo menos um professor.'; msg.classList.remove('escondido'); return; }
    $('#gerar').disabled = true;
    const { data: p, error } = await db.from('planilhas').insert({ ciclo_id: ciclo.id, nm, materia, turma_id: turmaId }).select().single();
    if (error) { msg.textContent = error.message; msg.classList.remove('escondido'); $('#gerar').disabled = false; return; }
    const colunas = misto
      ? [{ planilha_id: p.id, numero: 1, professor: 'Documento (PDF)' }, { planilha_id: p.id, numero: 2, professor: lista[0].nome, professor_email: lista[0].email }]
      : lista.map((x, i) => ({ planilha_id: p.id, numero: i + 1, professor: x.nome, professor_email: x.email }));
    const { error: e2 } = await db.from('questoes').insert(colunas);
    if (e2) { msg.textContent = e2.message; msg.classList.remove('escondido'); $('#gerar').disabled = false; return; }
    fecharFicha();
    irPara('planilha', p.id);
  };
}
